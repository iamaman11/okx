name: Bridge lock resolve

on:
  push:
    branches:
      - feat/okx-bridge-mcp

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
      - name: Resolve bridge lock only
        run: cargo check -p okx-bridge-mcp
      - name: Show exact lock diff
        if: always()
        run: git diff -- Cargo.lock

name: CP1 materialize accepted Cargo.lock

on:
  push:
    branches:
      - prod-closure/cp1-reproducible-lock

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod-closure/cp1-reproducible-lock
          fetch-depth: 0

      - name: Download exact accepted Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/11004606574/zip" \
            > "$RUNNER_TEMP/accepted.zip"
          mkdir "$RUNNER_TEMP/accepted"
          unzip -q "$RUNNER_TEMP/accepted.zip" -d "$RUNNER_TEMP/accepted"

      - name: Verify and materialize accepted lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCK="$RUNNER_TEMP/accepted/Cargo.lock"
          test -f "$LOCK"
          test "$(sha256sum "$LOCK" | awk '{print $1}')" = "685f5d8ebecd0ea9a3ecc1c56dcffd19cf1adee89a16f336d8f7c911539b9fe8"
          test "$(git hash-object "$LOCK")" = "21d5e7f58a481053415d019847ee15b4797dad20"
          cp "$LOCK" Cargo.lock

      - name: Commit accepted lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "prod: commit accepted Cargo dependency graph"
          git push origin HEAD:prod-closure/cp1-reproducible-lock

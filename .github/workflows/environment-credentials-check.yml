name: Environment credentials check

on:
  push:
    branches:
      - phase-1-account-capabilities
    paths:
      - .github/workflows/environment-credentials-check.yml

permissions:
  contents: read

jobs:
  observer:
    runs-on: ubuntu-latest
    environment: okx-succession-global-observer
    env:
      OKX_REGION: ${{ vars.OKX_REGION }}
      OKX_ACCOUNT: ${{ vars.OKX_ACCOUNT }}
      OKX_ACCESS_ROLE: ${{ vars.OKX_ACCESS_ROLE }}
      OKX_DEMO: ${{ vars.OKX_DEMO }}
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
      OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
    steps:
      - name: Verify observer environment
        shell: bash
        run: |
          set -euo pipefail
          test "$OKX_REGION" = "global"
          test "$OKX_ACCOUNT" = "Succession"
          test "$OKX_ACCESS_ROLE" = "observer"
          test "$OKX_DEMO" = "false"
          test -n "$OKX_API_KEY"
          test -n "$OKX_API_SECRET"
          test -n "$OKX_API_PASSPHRASE"
          echo "OBSERVER_ENVIRONMENT=PASS"

  executor:
    runs-on: ubuntu-latest
    environment: okx-succession-global-executor
    env:
      OKX_REGION: ${{ vars.OKX_REGION }}
      OKX_ACCOUNT: ${{ vars.OKX_ACCOUNT }}
      OKX_ACCESS_ROLE: ${{ vars.OKX_ACCESS_ROLE }}
      OKX_DEMO: ${{ vars.OKX_DEMO }}
      ALLOW_LIVE_TRADING: ${{ vars.ALLOW_LIVE_TRADING }}
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
      OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
    steps:
      - name: Verify executor environment
        shell: bash
        run: |
          set -euo pipefail
          test "$OKX_REGION" = "global"
          test "$OKX_ACCOUNT" = "Succession"
          test "$OKX_ACCESS_ROLE" = "executor"
          test "$OKX_DEMO" = "false"
          test "$ALLOW_LIVE_TRADING" = "false"
          test -n "$OKX_API_KEY"
          test -n "$OKX_API_SECRET"
          test -n "$OKX_API_PASSPHRASE"
          echo "EXECUTOR_ENVIRONMENT=PASS"

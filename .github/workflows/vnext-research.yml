name: vNext Research

on:
  push:
    branches: [vnext]
    paths: [vnext/research/**, .github/workflows/vnext-research.yml]
  pull_request:
    branches: [vnext]
    paths: [vnext/research/**, .github/workflows/vnext-research.yml]

permissions:
  contents: read

jobs:
  research:
    name: Research standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Export only the Research workspace
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/research"
          git archive HEAD:vnext/research | tar -x -C "$RUNNER_TEMP/research"
      - name: Check, test and build Research in isolation
        working-directory: ${{ runner.temp }}/research
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --release --bin okx-research-replay
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: okx-research-replay-linux
          path: ${{ runner.temp }}/research/target/release/okx-research-replay
          if-no-files-found: error

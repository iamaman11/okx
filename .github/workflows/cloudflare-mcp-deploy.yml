name: Cloudflare MCP Deploy

# A code merge must never change the production MCP tool contract ahead of
# its installed Windows Agent. Publish this Worker explicitly as one matched
# ReleaseSet operation only after the native runtime is accepted.
on:
  workflow_dispatch:
    inputs:
      initialize_clean_v2:
        description: 'One-time owner initialization of the isolated clean-v2 Durable Object'
        type: boolean
        default: false
      installation_id:
        description: 'Verified native Windows v2 installation ID (only for first initialization)'
        type: string
        required: false
      accepted_bundle_sha256:
        description: 'SHA256 of the accepted Windows GitHub bundle (only for first initialization)'
        type: string
        required: false

concurrency:
  group: cloudflare-mcp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-okx-cloudflare-mcp
    runs-on: ubuntu-latest
    environment: okx-succession-global-executor
    defaults:
      run:
        working-directory: cloudflare/okx-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secret preflight
        shell: bash
        env:
          OKX_RESEARCH_RUNTIME_TOKEN_SHA256: ${{ secrets.OKX_RESEARCH_RUNTIME_TOKEN_SHA256 }}
          OKX_CONTROL_ATTEST_TOKEN_SHA256: ${{ secrets.OKX_CONTROL_ATTEST_TOKEN_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 20; }
          # Only the public SHA-256 fingerprint is supplied. Never pass or
          # print the Research bearer outside its Windows Credential Manager.
          [[ "$OKX_RESEARCH_RUNTIME_TOKEN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'protected Research fingerprint missing or invalid'; exit 28;
          }
          engine_fingerprint="$(jq -r '.vars.RUNTIME_TOKEN_SHA256' wrangler.jsonc)"
          test "$OKX_RESEARCH_RUNTIME_TOKEN_SHA256" != "$engine_fingerprint" || {
            echo 'Research and Engine fingerprints must be distinct'; exit 29;
          }
          if test -n "$OKX_CONTROL_ATTEST_TOKEN_SHA256"; then
            [[ "$OKX_CONTROL_ATTEST_TOKEN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo 'protected CONTROL attestor fingerprint invalid'; exit 30;
            }
            if test "$OKX_CONTROL_ATTEST_TOKEN_SHA256" = "$engine_fingerprint" ||
               test "$OKX_CONTROL_ATTEST_TOKEN_SHA256" = "$OKX_RESEARCH_RUNTIME_TOKEN_SHA256"; then
              echo 'CONTROL attestor fingerprint must differ from runtime owners'; exit 31;
            fi
          fi

      - name: One-time v2 installation input preflight
        shell: bash
        env:
          INITIALIZE_V2: ${{ inputs.initialize_clean_v2 }}
          INSTALLATION_ID: ${{ inputs.installation_id }}
          BUNDLE_SHA256: ${{ inputs.accepted_bundle_sha256 }}
          OKX_MCP_OWNER_SECRET: ${{ secrets.OKX_MCP_OWNER_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$INITIALIZE_V2" == "true" ]]; then
            [[ "$INSTALLATION_ID" =~ ^[A-Za-z][A-Za-z0-9_-]{7,63}$ ]] || { echo 'invalid native installation identity'; exit 23; }
            [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'accepted GitHub bundle fingerprint required'; exit 24; }
            test -n "$OKX_MCP_OWNER_SECRET" || { echo 'MCP owner secret missing'; exit 25; }
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          package-manager-cache: false
      - name: Install locked package surface
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and release bindings regression
        run: npm run check

      - name: Deploy Worker
        shell: bash
        env:
          OKX_RESEARCH_RUNTIME_TOKEN_SHA256: ${{ secrets.OKX_RESEARCH_RUNTIME_TOKEN_SHA256 }}
          OKX_CONTROL_ATTEST_TOKEN_SHA256: ${{ secrets.OKX_CONTROL_ATTEST_TOKEN_SHA256 }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "must deploy exact main"; exit 21; }
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid tree"; exit 22; }
          echo "WORKER_DEPLOY_SOURCE_TREE=$SOURCE_TREE"
          # Build one complete, checked configuration. --var replaces config vars.
          trap 'rm -f wrangler.release.jsonc' EXIT
          node scripts/release-config.mjs "$SOURCE_TREE" wrangler.release.jsonc
          npx wrangler deploy --config wrangler.release.jsonc

      - name: Initialize isolated clean-v2 governance once
        if: ${{ inputs.initialize_clean_v2 }}
        shell: bash
        env:
          INSTALLATION_ID: ${{ inputs.installation_id }}
          BUNDLE_SHA256: ${{ inputs.accepted_bundle_sha256 }}
          OKX_MCP_OWNER_SECRET: ${{ secrets.OKX_MCP_OWNER_SECRET }}
        run: |
          set -euo pipefail
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          # Wait for the actual published Worker before calling the owner API.
          ready=false
          for attempt in 1 2 3 4 5 6 7 8; do
            health="$(curl -fsS https://okx-cloudflare-mcp.okx-794.workers.dev/health || true)"
            if jq -e --arg tree "$expected_tree" '.status == "ok" and .release_source_tree == $tree' >/dev/null 2>&1 <<< "$health"; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { echo 'Worker source provenance not yet current'; exit 27; }
          campaign_hash="$(printf 'okx-clean-v2:%s' "$INSTALLATION_ID" | sha256sum | cut -d' ' -f1)"
          payload="$(jq -cn \
            --arg installation "$INSTALLATION_ID" \
            --arg sha "$BUNDLE_SHA256" \
            --arg campaign "sha256:$campaign_hash" \
            '{contract:"okx.direct-transport.frame/v2",release_sha256:$sha,operation_id:("clean_v2_init_"+$installation),configuration:{schema:"okx.governance/v3",revision:0,installation_id:$installation,campaign_id:$campaign,campaign_loss_limit_usd:"10",campaign_entry_limit_usd:"10",max_total_modelled_loss_usdt:"5",accounts:[]}}')"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $OKX_MCP_OWNER_SECRET" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            https://okx-cloudflare-mcp.okx-794.workers.dev/installation/initialize)"
          jq -e --arg installation "$INSTALLATION_ID" \
            '.status == "CONFIGURED" and .installation_id == $installation and .revision == 0 and (.accounts | length) == 0' \
            >/dev/null <<< "$response"
          echo 'ISOLATED_V2_OWNER_INIT=PASS'

      - name: Owner-only read-only installation inspection
        shell: bash
        env:
          OKX_MCP_OWNER_SECRET: ${{ secrets.OKX_MCP_OWNER_SECRET }}
          INITIALIZE_V2: ${{ inputs.initialize_clean_v2 }}
          INSTALLATION_ID: ${{ inputs.installation_id }}
        run: |
          set -euo pipefail
          test -n "$OKX_MCP_OWNER_SECRET" || { echo "MCP owner secret missing"; exit 25; }
          # New Worker version propagation is not instantaneous. HTTP 200
          # plus jq's object construction is NOT evidence that new fields exist:
          # missing fields become null and previously passed deploy acceptance.
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          for attempt in 1 2 3 4 5 6 7 8; do
            health="$(curl -fsS https://okx-cloudflare-mcp.okx-794.workers.dev/health || true)"
            if ! jq -e --arg tree "$expected_tree" '
              .status == "ok" and
              .service == "okx-cloudflare-mcp" and
              .release_source_tree == $tree
            ' >/dev/null 2>&1 <<< "$health"; then
              sleep 2
              continue
            fi
            inspected="$(curl -fsS -H "Authorization: Bearer $OKX_MCP_OWNER_SECRET" \
              https://okx-cloudflare-mcp.okx-794.workers.dev/installation/inspect || true)"
            if jq -e --arg installation "$INSTALLATION_ID" --arg init "$INITIALIZE_V2" '
              .schema == "okx.installation-inspection/v1" and
              .state == "BOUND" and
              (.installation_id | type) == "string" and
              (if $init == "true" then .installation_id == $installation and .accounts_total == 0 and .revision == 0 else true end) and
              (.accounts_total | type) == "number" and
              (.revision | type) == "number" and
              .release_present == true and
              (.account_access | type) == "array" and
              (.account_access | length) == .accounts_total and
              (.real_accounts_enabled | type) == "number" and
              (.all_new_real_risk_paused | type) == "boolean" and
                .finance_authority == "native" and
                (has("risk") | not) and
              (.account_access | all(.[]; 
                (.id | type) == "string" and
                (.enabled | type) == "boolean" and
                (.explicit_pause | type) == "boolean" and
                (.identity_verified | type) == "boolean"))
            ' >/dev/null 2>&1 <<< "$inspected"; then
              jq -e -c '{schema,state,installation_id,accounts_total,revision,release_present,account_access,real_accounts_enabled,all_new_real_risk_paused,risk}' <<< "$inspected"
              echo "OWNER_POLICY_READBACK_CURRENT=PASS"
              exit 0
            fi
            sleep 2
          done
          echo "OWNER_POLICY_READBACK_CURRENT=FAIL" >&2
          exit 26

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 2 --retry-all-errors \
            https://okx-cloudflare-mcp.okx-794.workers.dev/health |
            jq -e '.status == "ok" and .service == "okx-cloudflare-mcp"'

name: Cloudflare MCP Deploy

# A code merge must never change the production MCP tool contract ahead of
# its installed Windows Agent. Publish this Worker explicitly as one matched
# ReleaseSet operation only after the native runtime is accepted.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-mcp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-okx-cloudflare-mcp
    runs-on: ubuntu-latest
    environment: okx-succession-global-executor
    defaults:
      run:
        working-directory: cloudflare/okx-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Secret preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 20; }

      - name: Install locked package surface
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and release bindings regression
        run: npm run check

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "must deploy exact main"; exit 21; }
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid tree"; exit 22; }
          echo "WORKER_DEPLOY_SOURCE_TREE=$SOURCE_TREE"
          # Build one complete, checked configuration. --var replaces config vars.
          node scripts/release-config.mjs "$SOURCE_TREE" wrangler.release.jsonc
          trap 'rm -f wrangler.release.jsonc' EXIT
          npx wrangler deploy --config wrangler.release.jsonc

      - name: Owner-only read-only installation inspection
        shell: bash
        env:
          OKX_MCP_OWNER_SECRET: ${{ secrets.OKX_MCP_OWNER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$OKX_MCP_OWNER_SECRET" || { echo "MCP owner secret missing"; exit 25; }
          # New Worker version propagation is not instantaneous. HTTP 200
          # plus jq's object construction is NOT evidence that new fields exist:
          # missing fields become null and previously passed deploy acceptance.
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          for attempt in 1 2 3 4 5 6 7 8; do
            health="$(curl -fsS https://okx-cloudflare-mcp.okx-794.workers.dev/health || true)"
            if ! jq -e --arg tree "$expected_tree" '
              .status == "ok" and
              .service == "okx-cloudflare-mcp" and
              .release_source_tree == $tree
            ' >/dev/null 2>&1 <<< "$health"; then
              sleep 2
              continue
            fi
            inspected="$(curl -fsS -H "Authorization: Bearer $OKX_MCP_OWNER_SECRET" \
              https://okx-cloudflare-mcp.okx-794.workers.dev/installation/inspect || true)"
            if jq -e '
              .schema == "okx.installation-inspection/v1" and
              .state == "BOUND" and
              (.installation_id | type) == "string" and
              (.accounts_total | type) == "number" and
              (.revision | type) == "number" and
              .release_present == true and
              (.account_access | type) == "array" and
              (.account_access | length) == .accounts_total and
              (.real_accounts_enabled | type) == "number" and
              (.all_new_real_risk_paused | type) == "boolean" and
              (.risk.unresolved_entries | type) == "number" and
              (.account_access | all(.[]; 
                (.id | type) == "string" and
                (.enabled | type) == "boolean" and
                (.explicit_pause | type) == "boolean" and
                (.identity_verified | type) == "boolean"))
            ' >/dev/null 2>&1 <<< "$inspected"; then
              jq -e -c '{schema,state,installation_id,accounts_total,revision,release_present,account_access,real_accounts_enabled,all_new_real_risk_paused,risk}' <<< "$inspected"
              echo "OWNER_POLICY_READBACK_CURRENT=PASS"
              exit 0
            fi
            sleep 2
          done
          echo "OWNER_POLICY_READBACK_CURRENT=FAIL" >&2
          exit 26

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 2 --retry-all-errors \
            https://okx-cloudflare-mcp.okx-794.workers.dev/health |
            jq -e '.status == "ok" and .service == "okx-cloudflare-mcp"'

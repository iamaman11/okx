name: vNext Edge

on:
  push:
    branches: [vnext]
    paths: [vnext/edge/**, .github/workflows/vnext-edge.yml]
  pull_request:
    branches: [vnext]
    paths: [vnext/edge/**, .github/workflows/vnext-edge.yml]

permissions:
  contents: read

jobs:
  worker:
    name: Edge Worker standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: vnext/edge/.node-version
          package-manager-cache: false
      - name: Export only the Edge workspace
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/edge"
          git archive HEAD:vnext/edge | tar -x -C "$RUNNER_TEMP/edge"
      - name: Check and bundle Edge in isolation
        working-directory: ${{ runner.temp }}/edge
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node scripts/test-native-finance-retirement-do.mjs
          ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/edge-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: okx-edge-worker
          path: ${{ runner.temp }}/edge-dist
          if-no-files-found: error

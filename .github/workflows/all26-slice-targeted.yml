name: All26 single-slice targeted Windows checks (WIP only)
on:
  push:
    branches:
      - work/all26-one-slice-20261104
      - work/b-seven-causal-consolidation-20261105
      - work/b-first-source-diagnostics-20261105
      - work/b-readonly-source-admission-20261105
      - work/b-t09-protection-causal-20261105
      - work/b-seven-readback-consolidation-20261105
      - work/b-source-owner-causal-fixes-20261105
      - work/b-replay-source-isolation-20261105
      - work/deterministic-recorded-source-phases-20261105
      - work/recorded-capture-scheduler-20261105
      - work/b-census-sql-owner-batch-20261105

permissions:
  contents: read

concurrency:
  group: all26-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-targeted:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Report repository formatting debt (required CI still enforces format)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Validate unchanged 26 mandatory IDs and evidence oracle
        shell: pwsh
        run: |
          node scripts/run-trade-integration.mjs --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-trade-integration.mjs --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify stage B case adapters parse
        shell: pwsh
        run: |
          foreach ($id in @('T09.8','T09-MA','T09-SPEC','T10-01','T10-02','T10-07','T10-14','T10-15')) {
            node --check "scripts/trade-integration/cases/$id.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install locked persisted Worker runtime
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Native integration binary once before bounded child deadlines
        shell: pwsh
        timeout-minutes: 12
        run: |
          cargo test --locked -p okx-agent --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw 'B_STAGE_NATIVE_PRECOMPILE_FAILED' }
      - name: Prove deterministic immutable signed-source phase isolation
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent --lib immutable_signed_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'SIGNED_SOURCE_PHASE_UNIT_PROOF_FAILED' }
      - name: Stage B seven candidates — exact-SHA Windows acceptance
        shell: pwsh
        timeout-minutes: 21
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'b-stage'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          # Run all seven B candidates on this exact SHA; T10-07 still needs its
          # own same-campaign Native source-backed 8->4 RELEASE witness.
          # Each case uses a separate Native/Worker child and durable artifacts.
          # Green here is 7/7 targeted, NEVER the required B 16/26 acceptance.
          $ids = @('T09.8','T09-MA','T09-SPEC','T10-01','T10-02','T10-14','T10-15')
          $env:OKX_B_CENSUS_CAUSE_PROBE = '1'
          $env:OKX_T09_4_SOURCE_COHERENCE_PROBE = '1'
          $env:OKX_T10_01_MAINT_SHUTDOWN_PROBE = '1'
          $rows = @()
          $attempt = 0
          foreach ($id in $ids) {
            $attempt++
            $out = Join-Path $dir "$id-$attempt"
            Write-Output "B_STAGE_START:${id}:attempt=$attempt"
            node scripts/run-trade-integration.mjs --case "$id" --artifacts "$out"
            $code = $LASTEXITCODE
            $file = Join-Path $out 'summary.json'
            if (Test-Path -LiteralPath $file) {
              $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
              $ok = $code -eq 0 -and
                $report.exact_commit -eq $env:GITHUB_SHA -and
                $report.spec_revision -eq '#449-r8.3' -and
                $report.required.Count -eq 26 -and
                $report.selected.Count -eq 1 -and
                $report.selected[0] -eq $id -and
                $report.executed_pass -eq 1 -and
                $report.executed_failures.Count -eq 0 -and
                $report.gate -eq 'PASS'
              $reason = if ($ok) { 'PASS' } elseif ($report.outcomes.Count -gt 0) {
                [string]$report.outcomes[0].reason
              } else { 'INVALID_RUNNER_SUMMARY' }
            } else {
              $ok = $false
              $reason = 'SUMMARY_MISSING'
            }
            $rows += [pscustomobject]@{id=$id;status= $(if($ok){'PASS'}else{'FAIL'});reason=$reason;exit_code=$code;sha=$env:GITHUB_SHA}
            Write-Output "B_STAGE_RESULT:${id}:attempt=${attempt}:${reason}"
          }
          $rows | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $dir 'b-stage-results.json') -Encoding utf8NoBOM
          $passed = @($rows | Where-Object status -eq 'PASS').Count
          Write-Output "B_STAGE_EXACT_SHA_RESULTS:$passed/$($ids.Count):$env:GITHUB_SHA"
          if ($passed -ne $ids.Count) { throw 'B_STAGE_ACCEPTANCE_NOT_COMPLETE' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: b-stage-${{ github.sha }}
          path: ${{ runner.temp }}\\b-stage
          if-no-files-found: warn
          retention-days: 14

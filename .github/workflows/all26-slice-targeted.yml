name: All26 single-slice targeted Windows checks (WIP only)
on:
  push:
    branches:
      - work/all26-one-slice-20261104

permissions:
  contents: read

concurrency:
  group: all26-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-targeted:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Report repository formatting debt (required CI still enforces format)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Validate unchanged 26 mandatory IDs and evidence oracle
        shell: pwsh
        run: |
          node scripts/run-trade-integration.mjs --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-trade-integration.mjs --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify stage B case adapters parse
        shell: pwsh
        run: |
          foreach ($id in @('T09.8','T09-MA','T09-SPEC','T10-01','T10-02','T10-07','T10-14','T10-15')) {
            node --check "scripts/trade-integration/cases/$id.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install locked persisted Worker runtime
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Native integration binary once before bounded child deadlines
        shell: pwsh
        timeout-minutes: 12
        run: |
          cargo test --locked -p okx-agent --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw 'B_STAGE_NATIVE_PRECOMPILE_FAILED' }
      - name: A1 first-cause T09.8 — exact-SHA Windows acceptance
        shell: pwsh
        timeout-minutes: 21
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'b-stage'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          # One causal blocker only; do not burn six independent B cohorts
          # while repairing the inherited T09.4 -> T09.6 -> T09.8 prefix.
          $ids = @('T09.8')
          $rows = @()
          foreach ($id in $ids) {
            $out = Join-Path $dir $id
            Write-Output "B_STAGE_START:$id"
            node scripts/run-trade-integration.mjs --case "$id" --artifacts "$out"
            $code = $LASTEXITCODE
            $file = Join-Path $out 'summary.json'
            if (Test-Path -LiteralPath $file) {
              $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
              $ok = $code -eq 0 -and
                $report.exact_commit -eq $env:GITHUB_SHA -and
                $report.spec_revision -eq '#449-r8.3' -and
                $report.required.Count -eq 26 -and
                $report.selected.Count -eq 1 -and
                $report.selected[0] -eq $id -and
                $report.executed_pass -eq 1 -and
                $report.executed_failures.Count -eq 0 -and
                $report.gate -eq 'PASS'
              $reason = if ($ok) { 'PASS' } elseif ($report.outcomes.Count -gt 0) {
                [string]$report.outcomes[0].reason
              } else { 'INVALID_RUNNER_SUMMARY' }
            } else {
              $ok = $false
              $reason = 'SUMMARY_MISSING'
            }
            $rows += [pscustomobject]@{id=$id;status= $(if($ok){'PASS'}else{'FAIL'});reason=$reason;exit_code=$code;sha=$env:GITHUB_SHA}
            Write-Output "B_STAGE_RESULT:${id}:${reason}"
          }
          $rows | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $dir 'b-stage-results.json') -Encoding utf8NoBOM
          $passed = @($rows | Where-Object status -eq 'PASS').Count
          Write-Output "B_STAGE_EXACT_SHA_RESULTS:$passed/$($ids.Count):$env:GITHUB_SHA"
          if ($passed -ne $ids.Count) { throw 'B_STAGE_ACCEPTANCE_NOT_COMPLETE' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: b-stage-${{ github.sha }}
          path: ${{ runner.temp }}\\b-stage
          if-no-files-found: warn
          retention-days: 14

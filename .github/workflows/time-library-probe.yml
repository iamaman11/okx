name: Temporary chrono replacement compatibility probe

on:
  push:
    branches: [work/512-rust-boundaries-20261116]
    paths:
      - .github/workflows/time-library-probe.yml
      - scripts/time-library-probe/**
      - Cargo.toml
      - Cargo.lock
      - crates/**

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Compare precise UTC, calendar and system-local semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path scripts/time-library-probe/Cargo.toml -- --nocapture 2>&1 | tee "$RUNNER_TEMP/time-probe.log"
          cargo tree --manifest-path scripts/time-library-probe/Cargo.toml -e normal 2>&1 | tee -a "$RUNNER_TEMP/time-probe.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: time-backend-comparison-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/time-probe.log
          if-no-files-found: warn
          retention-days: 7

  workspace-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Resolve replacement graph without modifying other dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Prepare formatter patch
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
      - name: Check every target against replacement graph
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/migration-check.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: temporary-workspace-migration-${{ github.sha }}
          path: |
            Cargo.lock
            ${{ runner.temp }}/rustfmt.patch
            ${{ runner.temp }}/migration-check.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify accepted Engine and build fresh Research for mixed owner evidence
        id: mixed_evidence
        if: needs.component_impact.outputs.component_scope == 'research-host'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse 'HEAD^{tree}').Trim()
          $env:OKX_BUILD_SOURCE_HEAD = (git rev-parse HEAD).Trim()
          & ./scripts/prepare-research-release.ps1 -VerifyOnly -MixedHost
          $proof = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'research-release-proof.json') | ConvertFrom-Json
          if ($proof.current_head_sha -cne $env:OKX_BUILD_SOURCE_HEAD -or
              $proof.scope.scope -cne 'research-host' -or
              $proof.scope.engine_windows_cargo_closure_identical -ne $true -or
              $proof.base_head_sha -cnotmatch '^[0-9a-f]{40}$') { throw 'MIXED_ENGINE_PROOF_REQUIRED' }
          cargo build --locked --release -p okx-research-service --bin okx-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = 'target/release/okx-research-service.exe'
          [ordered]@{
            fresh_component = 'okx-research-service.exe'
            source_head_sha = $env:OKX_BUILD_SOURCE_HEAD
            source_tree = $env:OKX_BUILD_SOURCE_TREE
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
            reused_engine = $proof.components.'okx-agent.exe'
            release_is_complete = $false
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mixed-research-proof.json') -Encoding utf8NoBOM
          "base_head=$($proof.base_head_sha)" >> $env:GITHUB_OUTPUT

      - name: Retain fresh Research binary and verified Engine origin
        if: needs.component_impact.outputs.component_scope == 'research-host'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixed-research-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/okx-research-service.exe
            ${{ runner.temp }}/mixed-research-proof.json
            ${{ runner.temp }}/research-release-proof.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
      - name: Research owner compiler cache statistics
        if: always() && steps.research-sccache.outcome == 'success'
        continue-on-error: true # Cache observability must not replace owner acceptance.
        shell: pwsh
        run: |
          $stats = @(& sccache --show-stats 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_OWNER_SCCACHE_STATS_UNAVAILABLE' }
          $stats | Where-Object { [string]$_ -match '^\s*(Compile requests|Cache hits|Cache misses|Cache read errors|Cache write errors|Non-cacheable compilations)' } | Out-Host


  research_component_release_windows:
    # Windows release compilation uses a different Cargo profile from owner
    # tests. Running on another runner removes its serial 60+ second wait
    # without weakening the existing Research Ready v3 status roster.
    name: research-component-windows
    needs: component_impact
    if: github.event_name == 'pull_request' && needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.research_only == 'true'
    runs-on: windows-latest
    env:
      # Match the trusted-main Research cache seed, including both debug and
      # release cache fingerprints. These do not override the release profile.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    outputs:
      research_component_sha256: ${{ steps.package.outputs.research_component_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact immutable PR HEAD for standalone Research release
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha }}'
          if ($expected -cnotmatch '^[0-9a-f]{40}$' -or
              (git rev-parse HEAD).Trim() -cne $expected) {
            throw 'RESEARCH_COMPONENT_NOT_EXACT_PR_HEAD'
          }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: research-release-cache
        with:
          prefix-key: v2-research-sccache
          shared-key: research-service-windows
          cache-workspace-crates: true
          save-if: false
          cache-on-failure: false
      - name: Export Research PR cache runtime credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install pinned Research compiler cache
        id: research-sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Enable read-only Research compiler cache
        shell: pwsh
        run: |
          'SCCACHE_GHA_ENABLED=on' >> $env:GITHUB_ENV
          'SCCACHE_GHA_VERSION=okx-research-sccache-v1' >> $env:GITHUB_ENV
          'SCCACHE_GHA_RW_MODE=READ_ONLY' >> $env:GITHUB_ENV
          'RUSTC_WRAPPER=sccache' >> $env:GITHUB_ENV
      - name: Prefer cached offline Cargo sources when complete
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & cargo fetch --locked --offline 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "CARGO_NET_OFFLINE=true" >> $env:GITHUB_ENV
            "Research release Cargo registry: complete local cache; offline" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Research release Cargo registry: incomplete cache; ordinary online fallback" >> $env:GITHUB_STEP_SUMMARY
            $global:LASTEXITCODE = 0
          }
      - name: Retain only byte-identical Research release Cargo fingerprints
        shell: pwsh
        env:
          OKX_RESEARCH_PR_SHA: ${{ github.event.pull_request.head.sha }}
          OKX_RESEARCH_ONLY: ${{ needs.component_impact.outputs.research_only }}
        run: |
          node scripts/research-trusted-cargo-freshness.cjs "profile=release" "head=$env:OKX_RESEARCH_PR_SHA" "cacheHit=${{ steps.research-release-cache.outputs.cache-hit }}" "researchOnly=$env:OKX_RESEARCH_ONLY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          package-manager-cache: false
      - name: Build self-contained Research-only Windows component
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Only accepted CONTROL with the explicit v3 policy may install this
          # component. The old v1/v2 seven-job provenance remains distinct.
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse "HEAD^{tree}").Trim()
          $env:OKX_BUILD_SOURCE_HEAD = (git rev-parse HEAD).Trim()
          $dist = Join-Path $env:RUNNER_TEMP 'okx-research-component'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $sourceHead = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          if ($sourceHead -cne '${{ github.event.pull_request.head.sha }}') {
            throw 'RESEARCH_COMPONENT_PR_HEAD_CHANGED_BEFORE_BUILD'
          }
          & node scripts/test-research-component-artifact.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # This path never looks up an accepted Native base, copies financial
          # Engine bytes or compiles Agent/CONTROL/Launcher. GitHub provenance
          # and exact main-tree promotion are independently verified by CONTROL.
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          . ./scripts/research-cargo-fingerprint-evidence.ps1
          Write-ResearchCargoMtimeSnapshot -Profile release
          $fingerprintCounts = New-ResearchCargoFingerprintCounts
          # Cargo timing report is diagnostic only, not part of the trusted
          # three-file component ZIP or its exact SHA-256 release provenance.
          $env:CARGO_LOG = 'cargo::compiler::fingerprint=info'
          cargo build --locked --release -p okx-research-service --bin okx-research-service --timings 2>&1 |
            ForEach-Object { if (-not (Test-ResearchCargoFingerprintLogLine -Line $_ -Counts $fingerprintCounts)) { $_ } } |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'research-only-build.log')
          $buildCode = $LASTEXITCODE
          Remove-Item Env:CARGO_LOG
          Write-ResearchCargoFingerprintCounts -Counts $fingerprintCounts -Job release
          if ($buildCode -ne 0) { exit $buildCode }
          $timingReports = @(Get-ChildItem -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'cargo-timings') -Filter '*.html' -File -ErrorAction SilentlyContinue)
          if ($timingReports.Count -lt 1) { throw 'RESEARCH_CARGO_TIMING_EVIDENCE_MISSING' }
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'release\okx-research-service.exe') (Join-Path $dist 'okx-research-service.exe')
          Copy-Item 'Cargo.lock' (Join-Path $dist 'Cargo.lock')
          [ordered]@{
            schema = 'okx.windows.research-component/v3'
            repository_id = 1388071566
            source_head_sha = $sourceHead
            source_tree = $sourceTree
            rust_version = (rustc --version).Trim()
            cargo_lock_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dist 'Cargo.lock')).Hash.ToLowerInvariant()
            ci_status_policy = 'okx.github.actions.research-ready/v3'
            worker = [ordered]@{
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dist 'okx-research-service.exe')).Hash.ToLowerInvariant()
              size = (Get-Item -LiteralPath (Join-Path $dist 'okx-research-service.exe')).Length
              protocol_version = 1
              storage_version = 1
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $dist 'manifest.json') -Encoding utf8NoBOM
          $proof = & node scripts/research-component-artifact.cjs $dist $sourceHead $sourceTree
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_COMPONENT_EXACT_THREE_FILE_PROOF_FAILED' }
          $proof | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'research-component-proof.json') -Encoding utf8NoBOM
          $component = $proof | ConvertFrom-Json
          if ($component.research_component_sha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'RESEARCH_COMPONENT_SHA_UNVERIFIED' }
          "research_component_sha256=$($component.research_component_sha256)" >> $env:GITHUB_OUTPUT
          "RESEARCH_READY_STATUS_POLICY=okx.github.actions.research-ready/v3" >> $env:GITHUB_STEP_SUMMARY
          "RESEARCH_READY_STATUS_NAMES=select-checks,architecture-contracts,dependency-audit,cloudflare-mcp,research-windows,ci" >> $env:GITHUB_STEP_SUMMARY
          "RESEARCH_COMPONENT_MANIFEST_SCHEMA=okx.windows.research-component/v3" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload isolated Research release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-only-release-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}\research-component-proof.json
            ${{ runner.temp }}\research-only-build.log
            target/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact standalone Research component ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okx-research-component-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-research-component
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
      - name: Research release compiler cache statistics
        if: always() && steps.research-sccache.outcome == 'success'
        continue-on-error: true # Cache observability must not replace release acceptance.
        shell: pwsh
        run: |
          $stats = @(& sccache --show-stats 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_RELEASE_SCCACHE_STATS_UNAVAILABLE' }
          $stats | Where-Object { [string]$_ -match '^\s*(Compile requests|Cache hits|Cache misses|Cache read errors|Cache write errors|Non-cacheable compilations)' } | Out-Host

  required_ci:
    # The sole required status checks owner jobs directly. A skipped job may
    # satisfy a GitHub branch rule, so require each expected result explicitly.
    name: ci
    needs: [component_impact, dependency-audit, architecture_contracts, rust_tests_linux, cloudflare_mcp_contracts, host_component_release_windows, host_controller_launcher_checks, trading_engine_acceptance_windows, trading_engine_isolation_windows, trading_engine_regressions_windows, trading_engine_build_windows, research_ipc_windows, research_clippy_windows, research_service_tests_windows, research_component_release_windows]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - name: Require all and only affected owner and consumer checks
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.component_impact.result }}" = "success"
          scope='${{ needs.component_impact.outputs.component_scope }}'
          build='${{ needs.component_impact.outputs.build_required }}'
          case "$scope" in docs|cloudflare|engine|research|research-host|host-controller|host-launcher|full) ;; *) exit 1 ;; esac
          case "$build" in true|false) ;; *) exit 1 ;; esac
          check_result() {
            local actual="$1" expected="$2" name="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error title=CI owner gate::$name expected $expected, observed $actual"
              exit 1
            fi
          }
          if [[ "$build" == false ]]; then
            test '${{ needs.component_impact.outputs.reason }}' = 'merged tree exactly matches successful PR head tree'
            # The immutable, first-attempt Ready `ci` already accepted this
            # exact tree, including its dependency audit. Require the duplicate
            # audit to be skipped rather than silently accepting a missing gate.
            check_result "${{ needs['dependency-audit'].result }}" skipped accepted-main-dependency-audit-reuse
            for item in \
              '${{ needs.architecture_contracts.result }}' \
              '${{ needs.rust_tests_linux.result }}' \
              '${{ needs.cloudflare_mcp_contracts.result }}' \
              '${{ needs.host_component_release_windows.result }}' \
              '${{ needs.host_controller_launcher_checks.result }}' \
              '${{ needs.trading_engine_acceptance_windows.result }}' \
              '${{ needs.trading_engine_isolation_windows.result }}' \
              '${{ needs.trading_engine_regressions_windows.result }}' \
              '${{ needs.trading_engine_build_windows.result }}' \
              '${{ needs.research_ipc_windows.result }}' \
              '${{ needs.research_clippy_windows.result }}' \
              '${{ needs.research_service_tests_windows.result }}' \
              '${{ needs.research_component_release_windows.result }}'; do
              check_result "$item" skipped accepted-main-reuse
            done
            echo 'CI=PASS; exact accepted Ready tree reused without compilation'
            exit 0
          fi
          case "$scope" in
            docs|cloudflare) check_result "${{ needs['dependency-audit'].result }}" skipped dependency-audit ;;
            *) check_result "${{ needs['dependency-audit'].result }}" success dependency-audit ;;
          esac
          case "$scope" in
            docs|cloudflare) check_result "${{ needs.architecture_contracts.result }}" skipped architecture-contracts ;;
            *) check_result "${{ needs.architecture_contracts.result }}" success architecture-contracts ;;
          esac
          if [[ '${{ needs.component_impact.outputs.edge_required }}' == true ]]; then
            check_result '${{ needs.cloudflare_mcp_contracts.result }}' success cloudflare-mcp
          else
            check_result '${{ needs.cloudflare_mcp_contracts.result }}' skipped cloudflare-mcp
          fi
          case "$scope" in
            docs|cloudflare)
              test '${{ needs.component_impact.outputs.native_proof }}' = COMPONENT_SCOPED_UNCHANGED_NATIVE
              check_result '${{ needs.rust_tests_linux.result }}' skipped portable-rust
              check_result '${{ needs.host_component_release_windows.result }}' skipped host-windows
              check_result '${{ needs.host_controller_launcher_checks.result }}' skipped host-contracts-windows
              check_result '${{ needs.research_ipc_windows.result }}' skipped research-ipc-windows
              check_result '${{ needs.research_clippy_windows.result }}' skipped research-clippy-windows
              check_result '${{ needs.research_service_tests_windows.result }}' skipped research-windows
              check_result '${{ needs.research_component_release_windows.result }}' skipped research-component-windows
              check_result '${{ needs.trading_engine_acceptance_windows.result }}' skipped engine-windows
              check_result '${{ needs.trading_engine_isolation_windows.result }}' skipped engine-isolation-windows
              check_result '${{ needs.trading_engine_regressions_windows.result }}' skipped engine-regressions
              check_result '${{ needs.trading_engine_build_windows.result }}' skipped engine-build
              ;;
            research|research-host|host-controller|host-launcher)
              check_result '${{ needs.rust_tests_linux.result }}' skipped portable-rust
              check_result '${{ needs.trading_engine_acceptance_windows.result }}' skipped engine-windows
              check_result '${{ needs.trading_engine_isolation_windows.result }}' skipped engine-isolation-windows
              check_result '${{ needs.trading_engine_regressions_windows.result }}' skipped engine-regressions
              check_result '${{ needs.trading_engine_build_windows.result }}' skipped engine-build
              case "$scope" in
                research)
                  test '${{ needs.component_impact.outputs.native_proof }}' = RESEARCH_OWNER_ONLY
                  [[ '${{ needs.research_component_release_windows.outputs.research_component_sha256 }}' =~ ^[0-9a-f]{64}$ ]]
                  check_result '${{ needs.research_ipc_windows.result }}' success research-ipc-windows
                  check_result '${{ needs.research_clippy_windows.result }}' success research-clippy-windows
                  check_result '${{ needs.research_service_tests_windows.result }}' success research-windows
                  check_result '${{ needs.research_component_release_windows.result }}' success research-component-windows
                  check_result '${{ needs.host_component_release_windows.result }}' skipped host-windows
                  check_result '${{ needs.host_controller_launcher_checks.result }}' skipped host-contracts-windows
                  ;;
                research-host)
                  test '${{ needs.component_impact.outputs.native_proof }}' = RESEARCH_HOST_OWNER_CHECKS
                  [[ '${{ needs.research_service_tests_windows.outputs.mixed_base_head }}' =~ ^[0-9a-f]{40}$ ]]
                  check_result '${{ needs.research_ipc_windows.result }}' skipped research-ipc-windows
                  check_result '${{ needs.research_clippy_windows.result }}' skipped research-clippy-windows
                  check_result '${{ needs.research_service_tests_windows.result }}' success research-windows
                  check_result '${{ needs.research_component_release_windows.result }}' skipped research-component-windows
                  check_result '${{ needs.host_component_release_windows.result }}' success host-windows
                  check_result '${{ needs.host_controller_launcher_checks.result }}' success host-contracts-windows
                  ;;
                *)
                  test '${{ needs.component_impact.outputs.native_proof }}' = HOST_WINDOWS_OWNER_AND_CONSUMER
                  check_result '${{ needs.research_ipc_windows.result }}' skipped research-ipc-windows
                  check_result '${{ needs.research_clippy_windows.result }}' skipped research-clippy-windows
                  check_result '${{ needs.research_service_tests_windows.result }}' skipped research-windows
                  check_result '${{ needs.research_component_release_windows.result }}' skipped research-component-windows
                  check_result '${{ needs.host_component_release_windows.result }}' success host-windows
                  check_result '${{ needs.host_controller_launcher_checks.result }}' success host-contracts-windows
                  ;;
              esac
              ;;
            engine|full)
              check_result '${{ needs.rust_tests_linux.result }}' success portable-rust
              check_result '${{ needs.trading_engine_acceptance_windows.result }}' success engine-windows
              check_result '${{ needs.trading_engine_isolation_windows.result }}' success engine-isolation-windows
              check_result '${{ needs.trading_engine_regressions_windows.result }}' success engine-regressions
              check_result '${{ needs.trading_engine_build_windows.result }}' success engine-build
              check_result '${{ needs.research_ipc_windows.result }}' skipped research-ipc-windows
              check_result '${{ needs.research_clippy_windows.result }}' skipped research-clippy-windows
              check_result '${{ needs.research_service_tests_windows.result }}' skipped research-windows
              check_result '${{ needs.research_component_release_windows.result }}' skipped research-component-windows
              check_result '${{ needs.host_component_release_windows.result }}' skipped host-windows
              check_result '${{ needs.host_controller_launcher_checks.result }}' skipped host-contracts-windows
              case "$scope" in
                engine) test '${{ needs.component_impact.outputs.native_proof }}' = ENGINE_OWNER_ONLY ;;
                full) test '${{ needs.component_impact.outputs.native_proof }}' = NONE ;;
              esac
              ;;
          esac
          echo "CI=PASS; scope=$scope; no redundant Linux/Windows aggregators"

  # Build the four-component Windows artifact in parallel with acceptance.
  trading_engine_build_windows:
    name: trading-engine-build-windows
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.native_required != 'false' && needs.component_impact.outputs.research_only != 'true'
    runs-on: windows-latest
    env:
      # Match the trusted-main release cache prime's full Cargo environment
      # fingerprint. Without these, PR releases miss its accepted compiler
      # cache and compile the same immutable Engine again for 8+ minutes.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: release-cache
        with:
          prefix-key: v1-rust
          shared-key: trading-engine-release-windows
          cache-workspace-crates: true
          save-if: false
          cache-on-failure: false
      - name: Reject an unreviewed main build without an accepted PR artifact
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: throw 'MAIN_NATIVE_REQUIRES_EXACT_ACCEPTED_READY_ARTIFACT'
      - name: Build standalone Engine component
        if: github.event_name == 'pull_request' && needs.component_impact.outputs.component_scope == 'engine'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This artifact contains ONLY the Engine binary. No Research or Host
          # binary is bundled, reused, or declared identical to an old accepted
          # full release. A standalone owner can advance independently.
          $log = Join-Path $env:RUNNER_TEMP 'engine-only-build.log'
          cargo build --locked --release -p okx-trading-engine 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dist = Join-Path $env:RUNNER_TEMP 'okx-engine-component'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $binary = Join-Path $dist 'okx-agent.exe'
          Copy-Item -LiteralPath 'target/release/okx-agent.exe' -Destination $binary
          $contract = & $binary runtime-contract
          if ($LASTEXITCODE -ne 0 -or ($contract -join "`n") -cne '{"schema":"okx.engine.runtime-contract/v1","runtime_owner":"engine","research_child":false}') {
            throw 'ENGINE_COMPONENT_RUNTIME_CONTRACT_INVALID'
          }
          [ordered]@{
            schema = 'okx.windows.engine-component/v2'
            repository_id = 1388071566
            source_head_sha = (git rev-parse HEAD).Trim()
            source_tree = (git rev-parse 'HEAD^{tree}').Trim()
            release_is_complete = $false
            installed_state_unchanged = $true
            artifact_scope = 'engine_only'
            other_windows_owners = 'NOT_EVALUATED'
            fresh_component = [ordered]@{
              name = 'okx-agent.exe'
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
              size = (Get-Item -LiteralPath $binary).Length
            }
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $dist 'engine-component-proof.json') -Encoding utf8NoBOM

      - name: Retain independently tested Engine-only bytes
        if: github.event_name == 'pull_request' && needs.component_impact.outputs.component_scope == 'engine'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okx-engine-component-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/okx-engine-component/okx-agent.exe
            ${{ runner.temp }}/okx-engine-component/engine-component-proof.json
            ${{ runner.temp }}/engine-only-build.log
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
      - name: Build deployable Windows binaries
        if: github.event_name == 'pull_request' && needs.component_impact.outputs.component_scope != 'engine'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse "HEAD^{tree}").Trim()
          $env:OKX_BUILD_SOURCE_HEAD = (git rev-parse HEAD).Trim()
          $dist = Join-Path $env:RUNNER_TEMP "okx-windows-bundle"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $names = @('okx-agent.exe', 'okx-host-control.exe', 'okx-host-launcher.exe', 'okx-research-service.exe')
          $sourceHead = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          $components = [ordered]@{}
          & node scripts/test-research-release-scope.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The full native gate ALWAYS produces fresh binaries, even when a
          # pinned Research reuse base exists. Reuse is isolated to its job.
          cargo build --locked --release -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in $names) { Copy-Item (Join-Path 'target\release' $name) (Join-Path $dist $name) }
          $engineContract = & (Join-Path $dist 'okx-agent.exe') runtime-contract
          if ($LASTEXITCODE -ne 0 -or ($engineContract -join "`n") -cne '{"schema":"okx.engine.runtime-contract/v1","runtime_owner":"engine","research_child":false}') {
            throw 'PACKAGED_ENGINE_RUNTIME_CONTRACT_INVALID'
          }
          $freshNames = $names
          foreach ($name in $freshNames) {
            $path = Join-Path $dist $name
            $components[$name] = [ordered]@{
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
              size = (Get-Item -LiteralPath $path).Length
              source_head_sha = $sourceHead
              source_tree = $sourceTree
              run_id = 0
              artifact_id = 0
              protocol_version = 1
              storage_version = 1
            }
          }
          Copy-Item 'Cargo.lock' (Join-Path $dist 'Cargo.lock')
          # Temporary one-release bridge for an already installed v1 CONTROL.
          # That executable rejects the v2 "components" field before it can
          # stage its successor. Keep the marker pinned in the tested source
          # tree and remove it in a follow-up full v2 release.
          if (Test-Path -LiteralPath '.github/windows-legacy-control-bridge.txt') {
            if (Test-Path -LiteralPath '.github/research-release-base.json') {
              throw 'LEGACY_BRIDGE_CANNOT_COMPOSE_RESEARCH_ORIGINS'
            }
            $files = [ordered]@{}
            foreach ($name in $names[0..2]) {
              $files[$name] = [ordered]@{
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dist $name)).Hash.ToLowerInvariant()
              }
            }
            # Current v1 readers never install Research; new v1 readers reject
            # unmanifested Research bytes. The next v2 release restores Worker.
            Remove-Item -LiteralPath (Join-Path $dist 'okx-research-service.exe') -Force
            $manifest = [ordered]@{
              schema = 'okx.windows.bundle/v1'
              repository_id = 1388071566
              source_head_sha = $sourceHead
              source_tree = $sourceTree
              rust_version = (rustc --version).Trim()
              files = $files
            }
          } else {
            $manifest = [ordered]@{
              schema = 'okx.windows.bundle/v2'
              repository_id = 1388071566
              source_head_sha = $sourceHead
              source_tree = $sourceTree
              rust_version = (rustc --version).Trim()
              components = $components
            }
          }
          $manifest | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $dist 'manifest.json') -Encoding utf8NoBOM

      - name: Upload deployable Windows bundle
        if: github.event_name == 'pull_request' && needs.component_impact.outputs.component_scope != 'engine'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okx-windows-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-windows-bundle
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

  # Optional manual cache seed only. An accepted PR merge on main reuses its
  # Ready evidence and must not compile/link Engine again merely to warm cache.
  # The Research v1 generation is a deliberate one-time rotation: cache entries
  # are immutable. An existing exact hit cannot refresh outputs for later main
  # trees; another explicit generation is required when a new seed is desired.
  trusted_main_cache_prime:
    name: warm-windows-cargo-cache (${{ matrix.profile }})
    needs: component_impact
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.prime_windows_cargo_cache == true &&
        needs.component_impact.outputs.build_required == 'false' &&
        needs.component_impact.outputs.reason == 'merged tree exactly matches successful PR head tree'
      }}
    strategy:
      fail-fast: false
      matrix:
        # Job-level `if` is evaluated before matrix expansion. Select actual
        # runners here so a single profile does not launch the other runner.
        # An invalid dispatcher value must fail matrix expansion, not launch
        # both expensive Windows profiles as an accidental fallback.
        profile: ${{ fromJSON(inputs.cache_profile == 'tests' && '["tests"]' || inputs.cache_profile == 'release' && '["release"]' || inputs.cache_profile == 'research' && '["research"]' || inputs.cache_profile == 'both' && '["tests","release"]' || '[]') }}
    runs-on: windows-latest
    env:
      # Cargo rejects an empty profile debug value, even during `--release`.
      # These valid test/dev settings do not override the release profile.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact trusted main checkout
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main' -or
              (git rev-parse HEAD).Trim() -cne '${{ github.sha }}' -or
              @(git status --porcelain).Count -ne 0) { throw 'UNTRUSTED_CACHE_SEED_CHECKOUT' }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: ${{ matrix.profile != 'release' && 'clippy' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: prime-cache
        with:
          prefix-key: ${{ matrix.profile == 'tests' && 'v2-rust' || matrix.profile == 'research' && 'v2-research-sccache' || 'v1-rust' }}
          shared-key: ${{ matrix.profile == 'research' && 'research-service-windows' || format('trading-engine-{0}-windows', matrix.profile) }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Export trusted Research cache runtime credentials
        if: matrix.profile == 'research'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install pinned trusted Research compiler cache
        if: matrix.profile == 'research'
        id: research-sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Enable trusted main Research compiler cache writer
        if: matrix.profile == 'research'
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main' -or (git rev-parse HEAD).Trim() -cne '${{ github.sha }}') {
            throw 'UNTRUSTED_RESEARCH_SCCACHE_WRITER'
          }
          'SCCACHE_GHA_ENABLED=on' >> $env:GITHUB_ENV
          'SCCACHE_GHA_VERSION=okx-research-sccache-v1' >> $env:GITHUB_ENV
          'SCCACHE_GHA_RW_MODE=READ_WRITE' >> $env:GITHUB_ENV
          'RUSTC_WRAPPER=sccache' >> $env:GITHUB_ENV
      - name: Seed only missing Windows debug/test outputs from trusted main
        if: matrix.profile == 'tests' && steps.prime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --locked -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-trade-execution --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_CLIPPY_BUILD_FAILED' }
          cargo test --locked --no-run --all-targets -p okx-trading-engine -p okx-trade-execution -p okx-host-controller -p okx-host-launcher -p okx-strategy-core -p okx-research -p okx-research-service
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_TEST_BUILD_FAILED' }
          # Match the single Cargo selection in the financial collector.
          cargo test --locked --no-run --lib -p okx-engine-domain -p okx-trade-execution -p okx-trading-engine -p okx-ipc-contracts -p okx-market-runtime
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_FINANCIAL_LIBTEST_BUILD_FAILED' }
          cargo build --locked -p okx-native-finance-check
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_COLLECTOR_BUILD_FAILED' }
          cargo test --locked --no-run -p okx-native-finance-check
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_COLLECTOR_LIBTEST_BUILD_FAILED' }
      - name: Seed only missing Windows release outputs from trusted main
        if: matrix.profile == 'release' && steps.prime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo build --locked --release -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-research-service
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_RELEASE_BUILD_FAILED' }
      - name: Seed only missing Research Windows tests and release from trusted main
        if: matrix.profile == 'research' && steps.prime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Reproduce the Research owner's Clippy, test and release compilation
          # without executing tests, packaging an artifact or accepting a PR.
          # The two independent PR Research runners restore this one trusted
          # main cache read-only; neither PR job may overwrite it.
          $ErrorActionPreference = 'Stop'
          cargo clippy --locked -p okx-strategy-core -p okx-research -p okx-research-service -p okx-analysis --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_CACHE_SEED_CLIPPY_FAILED' }
          cargo test --locked --no-run -p okx-strategy-core -p okx-research -p okx-analysis
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_CACHE_SEED_OWNER_TEST_BUILD_FAILED' }
          cargo test --locked --no-run -p okx-research-service --lib --bins --test causal_release_smoke --test ipc_process
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_CACHE_SEED_IPC_TEST_BUILD_FAILED' }
          cargo build --locked --release -p okx-research-service --bin okx-research-service
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_CACHE_SEED_RELEASE_BUILD_FAILED' }
      - name: Record non-acceptance cache evidence
        shell: pwsh
        run: |
          "CACHE_SEED=TRUSTED_MAIN_COMPILATION_ONLY" >> $env:GITHUB_STEP_SUMMARY
          "MAIN_SHA=${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "CACHE_PROFILE=${{ matrix.profile }} EXACT_HIT=${{ steps.prime-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          "FINANCIAL_TESTS=NOT_EXECUTED; RELEASE=NOT_PUBLISHED; ENGINE=NOT_INSTALLED" >> $env:GITHUB_STEP_SUMMARY
      - name: Trusted Research compiler cache statistics
        if: always() && matrix.profile == 'research' && steps.research-sccache.outcome == 'success'
        continue-on-error: true # Cache observability must not replace trust/prime checks.
        shell: pwsh
        run: |
          $stats = @(& sccache --show-stats 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'TRUSTED_RESEARCH_SCCACHE_STATS_UNAVAILABLE' }
          $stats | Where-Object { [string]$_ -match '^\s*(Compile requests|Cache hits|Cache misses|Cache read errors|Cache write errors|Non-cacheable compilations)' } | Out-Host

  # Successful protected main checks publish the verified PR artifact here.
  publish_accepted_windows_release:
    name: publish-accepted-windows-release
    needs: [dependency-audit, component_impact, required_ci]
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: native-base-publication
      cancel-in-progress: false
    # Explicit status guard is required: the sole protected ci job succeeds
    # even when intentionally skipped component jobs appear in its ancestry.
    # GitHub's implicit success() would otherwise skip publication on main.
    # The exact Ready tree already passed dependency-audit; `ci` checks that
    # the redundant main-side audit is skipped before publishing.
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.component_impact.outputs.component_scope == 'full' &&
        needs.component_impact.outputs.build_required == 'false' &&
        needs.component_impact.outputs.reason == 'merged tree exactly matches successful PR head tree' &&
        needs['dependency-audit'].result == 'skipped' &&
        needs.component_impact.result == 'success' &&
        needs.required_ci.result == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_MAIN: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select exact successful full Native PR release
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/windows-legacy-control-bridge.txt ]]; then
            echo "One-time v1 CONTROL migration bridge: preserve the existing v2 Native base; deploy only the exact accepted PR CI artifact through CONTROL."
            exit 0
          fi
          [[ "$ACCEPTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          current="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$current" != "$ACCEPTED_MAIN" ]]; then
            echo "Main advanced; a newer successful CI will publish the base."
            exit 0
          fi
          prs="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$ACCEPTED_MAIN/pulls")"
          test "$(jq -r --arg main "$ACCEPTED_MAIN" '[.[] | select(.merged_at != null and .merge_commit_sha == $main and .base.ref == "main")] | length' <<<"$prs")" = 1
          head="$(jq -r --arg main "$ACCEPTED_MAIN" '[.[] | select(.merged_at != null and .merge_commit_sha == $main and .base.ref == "main")] | .[0].head.sha' <<<"$prs")"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || exit 0
          main_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$ACCEPTED_MAIN" --jq .tree.sha)"
          head_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)"
          test "$main_tree" = "$head_tree"
          # GitHub's status=completed run index can omit already-successful
          # immutable PR runs; exact status/conclusion are checked by jq below.
          runs="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$head" -f event=pull_request -f per_page=100)"
          run_id=''; run_attempt=''; artifact_id=''; artifact_digest=''
          while IFS=$'\t' read -r candidate attempt; do
            [[ "$candidate" =~ ^[1-9][0-9]*$ && "$attempt" == 1 ]] || continue
            jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate/attempts/$attempt/jobs?per_page=100")"
            # Require the *fresh* 4-EXE financial gate, never an aggregate
            # that reused older proof or the isolated Research-only worker.
            if ! jq -e --arg head "$head" --argjson run "$candidate" '
              .total_count == (.jobs | length) and .total_count < 100 and
              ([.jobs[].name] | unique | length) == .total_count and
              all(.jobs[]; .run_id == $run and .head_sha == $head and .run_attempt == 1) and
              ([.jobs[] | select(.conclusion == "success") | .name] as $ok |
                all(["select-checks", "dependency-audit", "architecture-contracts",
                     "cloudflare-mcp", "rust-tests-linux",
                     "engine-windows", "trading-engine-regressions-windows (engine)",
                     "trading-engine-regressions-windows (host)", "trading-engine-regressions-windows (execution)",
                     "trading-engine-regressions-windows (research)",
                     "trading-engine-build-windows", "ci"][];
                    . as $name | $ok | index($name) != null))
            ' <<<"$jobs" >/dev/null; then
              continue
            fi
            artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100")"
            exact="$(jq -c --arg name "okx-windows-bundle-$head" --arg head "$head" --argjson run "$candidate" '
              [.artifacts[] | select(.name == $name and .expired == false and
                .workflow_run.id == $run and .workflow_run.repository_id == 1388071566 and
                .workflow_run.head_repository_id == 1388071566 and
                .workflow_run.head_sha == $head)] |
              if length == 1 then .[0] else empty end' <<<"$artifacts")"
            [[ -n "$exact" ]] || continue
            candidate_artifact="$(jq -r .id <<<"$exact")"
            candidate_digest="$(jq -r .digest <<<"$exact")"
            if [[ "$candidate_artifact" =~ ^[1-9][0-9]*$ && "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              run_id="$candidate"
              run_attempt="$attempt"
              artifact_id="$candidate_artifact"
              artifact_digest="$candidate_digest"
              break
            fi
          done < <(jq -r --arg head "$head" '
            .workflow_runs[] | select(.name == "CI" and
              (.path | test("^\\.github/workflows/ci\\.yml(@[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*)?$")) and
              .event == "pull_request" and .conclusion == "success" and .status == "completed" and
              .head_sha == $head and .run_attempt == 1 and
              .repository.id == 1388071566 and .head_repository.id == 1388071566) |
            [.id, .run_attempt] | @tsv' <<<"$runs")
          if [[ -z "$run_id" ]]; then
            echo 'NO_EXACT_FIRST_ATTEMPT_FULL_NATIVE_READY_PR_ARTIFACT' >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$head_tree" >> "$GITHUB_OUTPUT"
          echo "run=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Verify complete four-component source and archive
        if: steps.select.outputs.publish == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/okx-windows-base.zip"
          extract="$RUNNER_TEMP/native-base"
          mkdir -p "$extract"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.select.outputs.artifact }}/zip" > "$zip"
          digest="$(sha256sum "$zip" | cut -d' ' -f1)"
          test "sha256:$digest" = "${{ steps.select.outputs.digest }}"
          test "$(unzip -Z1 "$zip" | sort | paste -sd'|' -)" = 'Cargo.lock|manifest.json|okx-agent.exe|okx-host-control.exe|okx-host-launcher.exe|okx-research-service.exe'
          unzip -q "$zip" -d "$extract"
          jq -e --arg head '${{ steps.select.outputs.head }}' --arg tree '${{ steps.select.outputs.tree }}' '
            .schema == "okx.windows.bundle/v2" and .repository_id == 1388071566 and
            .source_head_sha == $head and .source_tree == $tree and
            (.components | length == 4) and (.rust_version | type == "string" and length > 0)
          ' "$extract/manifest.json" >/dev/null
          for file in okx-agent.exe okx-host-control.exe okx-host-launcher.exe okx-research-service.exe; do
            jq -e --arg f "$file" --arg head '${{ steps.select.outputs.head }}' --arg tree '${{ steps.select.outputs.tree }}' '
              .components[$f] | .source_head_sha == $head and .source_tree == $tree and .run_id == 0 and
              .artifact_id == 0 and .protocol_version == 1 and .storage_version == 1
            ' "$extract/manifest.json" >/dev/null
            test "$(sha256sum "$extract/$file" | cut -d' ' -f1)" = "$(jq -r --arg f "$file" '.components[$f].sha256' "$extract/manifest.json")"
            test "$(stat -c %s "$extract/$file")" = "$(jq -r --arg f "$file" '.components[$f].size' "$extract/manifest.json")"
          done
          input="$RUNNER_TEMP/native-base-origin-input.json"
          jq -n --arg head '${{ steps.select.outputs.head }}' --arg tree '${{ steps.select.outputs.tree }}' \
            --arg merge "$ACCEPTED_MAIN" --argjson run '${{ steps.select.outputs.run }}' \
            --argjson artifact '${{ steps.select.outputs.artifact }}' --arg digest "$digest" \
            '{repository_id:1388071566,source_head_sha:$head,source_tree:$tree,merged_main_sha:$merge,run_id:$run,artifact_id:$artifact,artifact_sha256:$digest}' > "$input"
          node scripts/test-published-release-origin.cjs
          node scripts/published-release-origin.cjs "$input" "$extract/manifest.json" "$zip" "$RUNNER_TEMP/published-origin.json"
          {
            (cd "$RUNNER_TEMP" && sha256sum okx-windows-base.zip published-origin.json)
            (cd "$extract" && sha256sum Cargo.lock manifest.json okx-agent.exe okx-host-control.exe okx-host-launcher.exe okx-research-service.exe)
          } > "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish current base and preserve verified rollback releases
        if: steps.select.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Every accepted tag retains its exact immutable commit identity.
          # Prior accepted native-base releases are intentionally retained;
          # installed and rollback SHA provenance is not known to this job.
          tag="native-base-$ACCEPTED_MAIN"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              '${{ steps.verify.outputs.zip }}' \
              "$RUNNER_TEMP/published-origin.json" \
              "$RUNNER_TEMP/SHA256SUMS.txt" \
              --target "$ACCEPTED_MAIN" --title "OKX accepted Native base $ACCEPTED_MAIN" \
              --notes "Automatically accepted after full financial/Windows CI. Download assets with checked SHA256; this is not a production deployment."
          fi
          release="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e --arg tag "$tag" --arg main "$ACCEPTED_MAIN" '
            .tag_name == $tag and .target_commitish == $main and .draft == false and .prerelease == false and
            ([.assets[].name] | sort) == ["SHA256SUMS.txt","okx-windows-base.zip","published-origin.json"]
          ' <<<"$release" >/dev/null
          for name in okx-windows-base.zip published-origin.json SHA256SUMS.txt; do
            expected="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest' <<<"$release")"
            actual="$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)"
            test "$expected" = "sha256:$actual"
          done
          current="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$current" = "$ACCEPTED_MAIN"
          # Installed/rollback provenance is not available to CI. Retain
          # accepted Native bases until CONTROL proves which previous images
          # are no longer installed or eligible for recovery (S3 acceptance).
          echo "NATIVE_BASE_RETENTION=KEEP_ACCEPTED_ROLLBACK_ORIGINS" >> "$GITHUB_STEP_SUMMARY"

  # Preserve the exact PR-tested Research-only bytes beyond Actions retention.
  # This is publication, not an installation or Engine release. No recompile,
  # native-base lookup, or ZIP repack is permitted on main.
  publish_accepted_research_component:
    name: publish-accepted-research-component
    needs: [dependency-audit, component_impact, required_ci]
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: research-component-publication
      cancel-in-progress: false
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.component_impact.outputs.component_scope == 'research' &&
        needs.component_impact.outputs.build_required == 'false' &&
        needs.component_impact.outputs.reason == 'merged tree exactly matches successful PR head tree' &&
        needs['dependency-audit'].result == 'skipped' &&
        needs.component_impact.result == 'success' &&
        needs.required_ci.result == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_MAIN: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select exact merged Research Ready PR and artifact
        id: select
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACCEPTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ACCEPTED_MAIN"
          current="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$current" != "$ACCEPTED_MAIN" ]]; then
            echo 'Main advanced; the newer accepted run owns publication.'
            exit 0
          fi
          prs="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$ACCEPTED_MAIN/pulls")"
          test "$(jq -r --arg main "$ACCEPTED_MAIN" '[.[] | select(.merged_at != null and .merge_commit_sha == $main and .base.ref == "main")] | length' <<<"$prs")" = 1
          head="$(jq -r --arg main "$ACCEPTED_MAIN" '[.[] | select(.merged_at != null and .merge_commit_sha == $main and .base.ref == "main")] | .[0].head.sha' <<<"$prs")"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          main_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$ACCEPTED_MAIN" --jq .tree.sha)"
          head_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)"
          [[ "$main_tree" =~ ^[0-9a-f]{40}$ ]]
          test "$main_tree" = "$head_tree"
          runs="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$head" -f event=pull_request -f per_page=100)"
          run_id=''; run_attempt=''; artifact_id=''; artifact_digest=''
          while IFS=$'\t' read -r candidate attempt; do
            [[ "$candidate" =~ ^[1-9][0-9]*$ && "$attempt" == 1 ]] || continue
            jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate/attempts/$attempt/jobs?per_page=100")"
            # The same Ready attempt must contain every authentic required
            # owner/gate success. Draft composition cannot satisfy this. The
            # Research Ready v3 is the only roster for new publications;
            # no legacy display aliases or green placeholders are accepted.
            if ! jq -e --arg head "$head" --argjson run "$candidate" '
              .total_count == (.jobs | length) and .total_count < 100 and
              ([.jobs[].name] | unique | length) == .total_count and
              all(.jobs[]; .run_id == $run and .head_sha == $head and .run_attempt == 1) and
              ([.jobs[] | select(.conclusion == "success") | .name] as $ok |
                all(["select-checks", "dependency-audit", "architecture-contracts",
                     "research-windows", "cloudflare-mcp", "ci"][];
                    . as $needed | $ok | index($needed) != null))
            ' <<<"$jobs" >/dev/null; then
              continue
            fi
            artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100")"
            exact="$(jq -c --arg name "okx-research-component-$head" --arg head "$head" --argjson run "$candidate" '
              [.artifacts[] | select(.name == $name and .expired == false and
                .workflow_run.id == $run and .workflow_run.repository_id == 1388071566 and
                .workflow_run.head_repository_id == 1388071566 and
                .workflow_run.head_sha == $head)] |
              if length == 1 then .[0] else empty end' <<<"$artifacts")"
            [[ -n "$exact" ]] || continue
            id="$(jq -r .id <<<"$exact")"
            digest="$(jq -r .digest <<<"$exact")"
            if [[ "$id" =~ ^[1-9][0-9]*$ && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              run_id="$candidate"; run_attempt="$attempt"; artifact_id="$id"; artifact_digest="$digest"
              break
            fi
          done < <(jq -r --arg head "$head" '
            .workflow_runs[] | select(.name == "CI" and
              (.path | test("^\\.github/workflows/ci\\.yml(@[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*)?$")) and
              .event == "pull_request" and .conclusion == "success" and .status == "completed" and
              .head_sha == $head and .run_attempt == 1 and
              .repository.id == 1388071566 and
              .head_repository.id == 1388071566) |
            [.id, .run_attempt] | @tsv' <<<"$runs")
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'NO_EXACT_SUCCESSFUL_RESEARCH_READY_PR_ARTIFACT' >&2; exit 1;
          }
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$head_tree" >> "$GITHUB_OUTPUT"
          echo "run=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Research ZIP bytes and origin
        id: verify
        if: steps.select.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/okx-research-component.zip"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.select.outputs.artifact }}/zip" > "$zip"
          digest="$(sha256sum "$zip" | cut -d' ' -f1)"
          test "sha256:$digest" = '${{ steps.select.outputs.digest }}'
          python3 -B scripts/test_verify_research_component_release.py
          python3 -B scripts/verify_research_component_release.py "$zip" "$digest" \
            '${{ steps.select.outputs.head }}' '${{ steps.select.outputs.tree }}' \
            > "$RUNNER_TEMP/research-component-validation.json"
          jq -n --slurpfile verified "$RUNNER_TEMP/research-component-validation.json" \
            --arg merge "$ACCEPTED_MAIN" --argjson run '${{ steps.select.outputs.run }}' \
            --argjson attempt '${{ steps.select.outputs.attempt }}' \
            --argjson artifact '${{ steps.select.outputs.artifact }}' '
            $verified[0] | {
              schema: "okx.published-research-origin/v1", repository_id,
              source_head_sha, source_tree, merged_main_sha: $merge,
              run_id: $run, run_attempt: $attempt, artifact_id: $artifact,
              archive_sha256, worker_sha256, worker_size, cargo_lock_sha256
            }' > "$RUNNER_TEMP/published-research-origin.json"
          (cd "$RUNNER_TEMP" && sha256sum okx-research-component.zip published-research-origin.json) \
            > "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish exact Research component and retain rollback origins
        if: steps.select.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$ACCEPTED_MAIN"
          tag="research-component-$ACCEPTED_MAIN"
          # target_commitish is ignored if the tag already exists. Bind the
          # actual Git ref (including peeled annotated tags) to accepted main.
          tag_ref() {
            local response status body
            response="$(curl --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -w '\n%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            case "$status" in
              200) printf '%s\n' "$body" ;;
              404) printf 'null\n' ;;
              *) echo "RESEARCH_TAG_LOOKUP_FAILED_HTTP_$status" >&2; return 1 ;;
            esac
          }
          verify_tag_target() {
            local required="$1" ref kind sha object
            ref="$(tag_ref)"
            if [[ "$ref" == null ]]; then
              [[ "$required" == optional ]] || { echo 'RESEARCH_PUBLISHED_TAG_REF_MISSING' >&2; return 1; }
              return 0
            fi
            kind="$(jq -r .object.type <<<"$ref")"
            sha="$(jq -r .object.sha <<<"$ref")"
            for peel in 1 2 3 4 5; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              if [[ "$kind" == commit ]]; then
                test "$sha" = "$ACCEPTED_MAIN" || { echo 'RESEARCH_TAG_REF_WRONG_COMMIT' >&2; return 1; }
                return 0
              fi
              [[ "$kind" == tag ]] || { echo 'RESEARCH_TAG_REF_INVALID_TYPE' >&2; return 1; }
              object="$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$sha")"
              kind="$(jq -r .object.type <<<"$object")"
              sha="$(jq -r .object.sha <<<"$object")"
            done
            echo 'RESEARCH_TAG_REF_ANNOTATION_DEPTH_EXCEEDED' >&2
            return 1
          }
          verify_tag_target optional
          # Draft releases are untagged: GitHub's /releases/tags/{tag}
          # endpoint only resolves published releases. Locate the one draft
          # through the authenticated paginated list, then use its numeric ID
          # for ALL draft reads, uploads and the publish transition.
          find_release() {
            gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -sc --arg tag "$tag" '
                [.[][] | select(.tag_name == $tag)] as $matches |
                if ($matches | length) > 1 then error("RESEARCH_RELEASE_TAG_COLLISION")
                elif ($matches | length) == 1 then $matches[0]
                else null end'
          }
          existing="$(find_release)"
          if [[ "$existing" == null ]]; then
            # Never retry creation after an ambiguous 422/500. Read back the
            # unique tag; if it is absent or mismatched, stop fail-closed.
            if ! gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$ACCEPTED_MAIN" \
              -f name="OKX accepted standalone Research $ACCEPTED_MAIN" \
              -f body='Exact Research-only PR CI bytes and provenance. No Engine/CONTROL binaries; no automatic Windows installation or financial actions.' \
              -F draft=true -F prerelease=false > "$RUNNER_TEMP/research-release-create.json"; then
              echo 'RESEARCH_DRAFT_CREATE_AMBIGUOUS_VERIFY_ORIGIN' >&2
            fi
            # List replication can lag creation; never create a second draft.
            for poll in 1 2 3 4 5; do
              existing="$(find_release)"
              [[ "$existing" != null ]] && break
              [[ "$poll" == 5 ]] || sleep 2
            done
          fi
          release_id="$(jq -r .id <<<"$existing")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || { echo 'RESEARCH_DRAFT_ORIGIN_NOT_FOUND' >&2; exit 1; }
          read_release() {
            gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id"
          }
          verify_release_identity() {
            jq -e --argjson id "$release_id" --arg tag "$tag" --arg main "$ACCEPTED_MAIN" '
            .id == $id and .tag_name == $tag and .target_commitish == $main and .prerelease == false and
            ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
            all(.assets[].name; . as $n |
              ["SHA256SUMS.txt", "okx-research-component.zip", "published-research-origin.json"] |
              index($n) != null)
            ' >/dev/null
          }
          release="$(read_release)"
          verify_release_identity <<<"$release"
          if jq -e '.draft == true' <<<"$release" >/dev/null; then
            for name in okx-research-component.zip published-research-origin.json SHA256SUMS.txt; do
              expected="sha256:$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)"
              present="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // ""' <<<"$release")"
              if [[ -z "$present" ]]; then
                # Never --clobber: a duplicate 422 or uncertain upload result
                # is accepted only after the server returns the SAME bytes.
                # Upload by release ID: gh release upload TAG fails on drafts.
                if ! curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'Content-Type: application/octet-stream' \
                  --data-binary "@$RUNNER_TEMP/$name" \
                  "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
                  > "$RUNNER_TEMP/research-release-upload.json"; then
                  echo "RESEARCH_ASSET_UPLOAD_AMBIGUOUS_VERIFY_SHA:$name" >&2
                fi
              fi
              # Also wait for the server's uploaded state (not `starter`).
              # An existing partial asset must never be uploaded over again.
              for poll in 1 2 3 4 5; do
                release="$(read_release)"
                verify_release_identity <<<"$release"
                present="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // ""' <<<"$release")"
                state="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .state // ""' <<<"$release")"
                size="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size // -1' <<<"$release")"
                asset_id="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id // 0' <<<"$release")"
                [[ -z "$present" || "$present" == "$expected" ]] || { echo 'RESEARCH_EXISTING_ASSET_SHA_MISMATCH' >&2; exit 1; }
                if [[ "$present" == "$expected" && "$state" == uploaded && "$size" == "$(stat -c %s "$RUNNER_TEMP/$name")" && "$asset_id" =~ ^[1-9][0-9]*$ ]]; then
                  break
                fi
                [[ "$poll" == 5 ]] || sleep 2
              done
              test "$present" = "$expected"
              test "$state" = uploaded
              test "$size" = "$(stat -c %s "$RUNNER_TEMP/$name")"
              [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            done
            # No partial draft becomes an installable release; the complete
            # origin set is read back before the single publish transition.
            release="$(read_release)"
            verify_release_identity <<<"$release"
            jq -e '([.assets[].name] | sort) ==
              ["SHA256SUMS.txt", "okx-research-component.zip", "published-research-origin.json"] and
              all(.assets[]; .state == "uploaded")' <<<"$release" >/dev/null
            for name in okx-research-component.zip published-research-origin.json SHA256SUMS.txt; do
              expected="sha256:$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)"
              test "$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest' <<<"$release")" = "$expected"
              test "$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .state' <<<"$release")" = uploaded
              test "$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size' <<<"$release")" = "$(stat -c %s "$RUNNER_TEMP/$name")"
              asset_id="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' <<<"$release")"
              [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            done
            verify_tag_target optional
            test "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$ACCEPTED_MAIN"
            if ! gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false > "$RUNNER_TEMP/research-release-publish.json"; then
              echo 'RESEARCH_DRAFT_PUBLISH_AMBIGUOUS_VERIFY_RELEASE' >&2
            fi
          fi
          release="$(read_release)"
          verify_release_identity <<<"$release"
          jq -e '
            .draft == false and .prerelease == false and
            ([.assets[].name] | sort) ==
            ["SHA256SUMS.txt", "okx-research-component.zip", "published-research-origin.json"] and
            all(.assets[]; .state == "uploaded")
          ' <<<"$release" >/dev/null
          for name in okx-research-component.zip published-research-origin.json SHA256SUMS.txt; do
            expected="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest' <<<"$release")"
            actual="$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)"
            test "$expected" = "sha256:$actual"
            test "$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .state' <<<"$release")" = uploaded
            test "$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size' <<<"$release")" = "$(stat -c %s "$RUNNER_TEMP/$name")"
            asset_id="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' <<<"$release")"
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
          done
          # The public tag endpoint must now resolve to this very same ID,
          # never to another release with an alias/collision. The new tag can
          # briefly lag the completed PATCH; retry reads only, never publish.
          published=''
          for poll in 1 2 3 4 5; do
            if published="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then break; fi
            [[ "$poll" == 5 ]] || sleep 2
          done
          [[ -n "$published" ]] || { echo 'RESEARCH_PUBLISHED_TAG_READBACK_NOT_VISIBLE' >&2; exit 1; }
          test "$(jq -r .id <<<"$published")" = "$release_id"
          verify_tag_target required
          test "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$ACCEPTED_MAIN"
          echo 'RESEARCH_COMPONENT_RELEASE=VERIFIED_APPEND_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'RESEARCH_ROLLBACK_RELEASE_RETENTION=KEEP_ALL_ACCEPTED' >> "$GITHUB_STEP_SUMMARY"

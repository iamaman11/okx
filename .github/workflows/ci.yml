        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy portable crates
        run: cargo clippy --locked --workspace --exclude okx-agent --exclude okx-host-control --all-targets -- -D warnings

      - name: Test portable crates
        run: cargo test --locked --workspace --exclude okx-agent --exclude okx-host-control

      - name: Research worker process and Agent dispatch contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p okx-research-worker --bin okx-research-worker
          export OKX_RESEARCH_WORKER_TEST_EXE="$PWD/target/debug/okx-research-worker"
          cargo test --locked -p okx-research-worker --lib analytics:: -- --test-threads 2 | tee "$RUNNER_TEMP/research-worker-unit.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/research-worker-unit.log"
          cargo test --locked -p okx-research-worker --test ipc_process -- --nocapture | tee "$RUNNER_TEMP/research-worker-ipc.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/research-worker-ipc.log"
          cargo test --locked -p okx-agent --lib research_dispatch_tests:: -- --test-threads 2 | tee "$RUNNER_TEMP/research-dispatch.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/research-dispatch.log"

      - name: Accept one million native SQLite terminal intents
        timeout-minutes: 30
        run: cargo test --locked -p okx-execution --lib sqlite_million_history_bounded_rss -- --ignored --nocapture

      - name: Measure two-account 100-parallel native SQL (not WSS)

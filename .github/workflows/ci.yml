      - name: Build research worker for process contracts
        shell: pwsh
        run: |
          cargo build --locked -p okx-research-worker --bin okx-research-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native trading, SQL, CONTROL and Launcher regression
        shell: pwsh
        run: |

name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prime_windows_cargo_cache:
        description: 'One-time trusted main Windows Cargo test/release cache seed (no acceptance or publish)'
        required: true
        type: boolean
        # Manual CI dispatch exists to seed the trusted main cache. The old
        # false default produced a green run with both prime jobs skipped.
        default: true
      cache_profile:
        description: 'Select which trusted main Windows Cargo cache to warm'
        required: true
        type: choice
        options: [tests, release, research, both]
        default: both

concurrency:
  # The release step is part of this main CI run. A later main commit must not
  # cancel an in-flight verified publication; stale commits are checked by SHA.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  dependency-audit:
    name: dependency-audit
    needs: component_impact
    # A merged main tree already passed this exact audit through the required
    # Ready `ci` gate. Do not repeat Cargo metadata and advisory work on publish.
    if: >-
      needs.component_impact.outputs.build_required == 'true' &&
      needs.component_impact.outputs.component_scope != '' &&
      !contains(fromJSON('["docs","cloudflare"]'), needs.component_impact.outputs.component_scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
      - name: Verify pinned cargo-deny release and audit locked graph
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-deny-home
        run: |
          set -euo pipefail
          asset=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$asset"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          deny="$RUNNER_TEMP/cargo-deny/cargo-deny"
          "$deny" --version | tee "$RUNNER_TEMP/dependency-audit.log"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/dependency-graph.json"
          "$deny" fetch 2>&1 | tee -a "$RUNNER_TEMP/dependency-audit.log"
          mapfile -t dbs < <(find "$CARGO_HOME/advisory-dbs" -mindepth 1 -maxdepth 1 -type d)
          test "${#dbs[@]}" -eq 1
          git -C "${dbs[0]}" rev-parse HEAD | tee "$RUNNER_TEMP/advisory-db-commit.txt"
          python3 scripts/check_dependency_policy.py --self-test
          python3 scripts/check_dependency_policy.py --graph "$RUNNER_TEMP/dependency-graph.json" --advisory-db "${dbs[0]}" 2>&1 | tee -a "$RUNNER_TEMP/dependency-audit.log"
          # Offline check fixes the fetched DB revision and fails if it is missing
          # or stale; cargo metadata above populated the locked crate graph.
          "$deny" --locked --offline --color never check advisories licenses sources 2>&1 | tee -a "$RUNNER_TEMP/dependency-audit.log"
      - name: Report actual Cargo release consumers without changing CI selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node scripts/test-ci-main-routing.cjs
          node scripts/test-ci-component-impact.cjs
          node scripts/test-research-trusted-cargo-freshness.cjs
          node scripts/test-ci-cargo-closure-proof.cjs "$RUNNER_TEMP/dependency-graph.json"
          files=()
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            if gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/ci-impact-files.json"; then
              files=("$RUNNER_TEMP/ci-impact-files.json")
            else
              # A failed secondary diagnostic lookup cannot weaken or block
              # the already fail-closed authoritative component-impact job.
              echo 'Diagnostic diff unavailable; report full uncertain impact.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Reuse cargo metadata already produced by dependency-audit. No
          # additional Cargo build, check, test, metadata or Windows runner.
          node scripts/ci-component-impact.cjs "$RUNNER_TEMP/dependency-graph.json" "${files[@]}" > "$RUNNER_TEMP/ci-component-impact.json"
          node scripts/ci-component-impact.cjs "$RUNNER_TEMP/dependency-graph.json" "${files[@]}" --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Retain dependency policy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/dependency-audit.log
            ${{ runner.temp }}/advisory-db-commit.txt
            ${{ runner.temp }}/ci-component-impact.json
          if-no-files-found: error
          retention-days: 14

  component_impact:
    # Single immutable changed-owner selector, not another required status.
    name: select-checks
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}
      reason: ${{ steps.classify.outputs.reason }}
      native_required: ${{ steps.classify.outputs.native_required }}
      native_proof: ${{ steps.classify.outputs.native_proof }}
      # A verified first-attempt Research artifact can narrow an identical
      # merged main tree. Unverified source changes keep the conservative scope.
      component_scope: ${{ steps.classify.outputs.component_scope || steps.proven_scope.outputs.scope }}
      research_only: ${{ steps.classify.outputs.research_only }}
      edge_required: ${{ steps.classify.outputs.edge_required }}
      draft_checks: ${{ steps.file_scope.outputs.draft_checks }}
      draft_mcp: ${{ steps.file_scope.outputs.draft_mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject unsafe component classifications
        run: |
          python3 -B scripts/check_ci_native_scope.py --self-test
          # A Host-only component is never an installable 4-EXE ReleaseSet.
          # These exact-byte negative controls run even on a Full workflow edit.
          python3 -B scripts/test_verify_host_component_release.py
      - name: Classify complete changed-file impact
        id: file_scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/ci-files.json"
          comparison=unavailable
          plan_args=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$PR_BASE"
            if [[ "${{ github.event.pull_request.draft }}" != "true" ]]; then
              plan_args+=(--allow-dependency-candidate)
            fi
          elif [[ "$FORCED_PUSH" != true ]]; then
            base="$BEFORE_SHA"
            # On main this is only a tentative owner candidate. The scope
            # remains full unless the exact merged PR Ready/artifact proof
            # below independently authorizes Research-only publication.
            if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
              plan_args+=(--allow-dependency-candidate)
            fi
          else
            base=''
          fi
          # Compare the immutable event commits. The live PR file list may
          # belong to a newer head while GitHub is cancelling this run.
          if [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != "0000000000000000000000000000000000000000" &&
                "$CHECKED_HEAD" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$CHECKED_HEAD" ]] &&
             gh api "/repos/$GITHUB_REPOSITORY/compare/$base...$CHECKED_HEAD" > "$RUNNER_TEMP/ci-compare.json" &&
             jq -e --arg base "$base" --arg head "$CHECKED_HEAD" '
                 (.status == "ahead" or .status == "diverged") and .base_commit.sha == $base
                 and .ahead_by > 0 and .total_commits == .ahead_by and .total_commits < 250
                 and (.commits | length) == .total_commits and .commits[-1].sha == $head
                 and (.files | type == "array" and length > 0 and length < 300)
               ' "$RUNNER_TEMP/ci-compare.json" >/dev/null; then
            jq -c '.files as $paths | [range(0; ($paths | length); 100) as $start |
              $paths[$start:$start + 100]]' "$RUNNER_TEMP/ci-compare.json" > "$files"
            comparison=complete
          else
            printf 'null\n' > "$files"
          fi
          echo "comparison=$comparison" >> "$GITHUB_OUTPUT"
          python3 -B scripts/check_ci_native_scope.py --github-plan "${plan_args[@]}" < "$files"
      # Manifest changes and Research protocol/domain sources incur the exact
      # Windows resolver proof. An unchanged graph is not enough for source
      # edits: the changed paths must also be absent from protected Engine,
      # CONTROL, Launcher and MCP Bridge normal/build/dev (test) closures.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && steps.file_scope.outputs.manifest_candidate != 'none'
        with:
          toolchain: 1.100.0
      - name: Prove protected Windows Cargo closure before narrowing owner inputs
        id: cargo_closure
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && steps.file_scope.outputs.manifest_candidate != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE: ${{ steps.file_scope.outputs.manifest_candidate }}
        run: |
          set -euo pipefail
          # Failure is a conservative full matrix, never a skipped finance gate.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ||
                "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo 'CARGO_PROOF=HEAD_OR_BASE_UNVERIFIED; fallback=full'
            exit 0
          fi
          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" 2>/dev/null)" || exit 0
          if ! jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" \
              '.head.sha == $head and .base.sha == $base and .base.ref == "main"' <<<"$pr" >/dev/null; then
            echo 'CARGO_PROOF=PR_MOVED; fallback=full'
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo 'CARGO_PROOF=BASE_UNAVAILABLE; fallback=full'
            exit 0
          fi
          temp="$(mktemp -d "$RUNNER_TEMP/ci-cargo-base.XXXXXX")"
          base="$temp/base"
          trap 'git worktree remove "$base" 2>/dev/null || true; rmdir "$temp" 2>/dev/null || true' EXIT
          if ! git worktree add --detach "$base" "$BASE_SHA"; then
            echo 'CARGO_PROOF=BASE_WORKTREE_UNAVAILABLE; fallback=full'
            exit 0
          fi
          if ! cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc > "$temp/head.json" ||
             ! (cd "$base" && cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc) > "$temp/base.json"; then
            echo 'CARGO_PROOF=WINDOWS_RESOLVER_FAILED; fallback=full'
            exit 0
          fi
          if node scripts/ci-cargo-closure-proof.cjs "$temp/base.json" "$temp/head.json" \
              "$RUNNER_TEMP/ci-files.json" "$CANDIDATE" > "$RUNNER_TEMP/ci-windows-closure-proof.json"; then
            echo "scope=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "CARGO_PROOF=IDENTICAL_PROTECTED_WINDOWS_CLOSURE; scope=$CANDIDATE"
          else
            echo 'CARGO_PROOF=CHANGED_OR_UNVERIFIED; fallback=full'
          fi
      - name: Select only proven component scope
        id: proven_scope
        shell: bash
        run: |
          set -euo pipefail
          scope='${{ steps.file_scope.outputs.scope }}'
          if [[ -n '${{ steps.cargo_closure.outputs.scope }}' ]]; then
            test "$scope" = full
            scope='${{ steps.cargo_closure.outputs.scope }}'
          fi
          case "$scope" in docs|cloudflare|engine|research|research-host|host-controller|host-launcher|full) ;; *) exit 1;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "COMPONENT_SCOPE=$scope"
      - name: Decide whether compilation is required
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # In-progress Draft edits must not launch repeated Windows releases.
          # A Ready-for-review event retains the original full CI contract.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "native_required=false" >> "$GITHUB_OUTPUT"
            echo "reason=draft PR; run owner feedback and defer acceptance and release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scope="${{ steps.proven_scope.outputs.scope }}"
          case "$scope" in
            docs) edge_required=false ;;
            engine|host-controller|host-launcher) edge_required="${{ steps.file_scope.outputs.edge_changed }}" ;;
            # A Research change must not lose its MCP/DO/WSS witnesses merely
            # because the same PR also edits Host/Launcher source.
            research|research-host) edge_required=true ;;
            *) edge_required=true ;;
          esac
          echo "edge_required=$edge_required" >> "$GITHUB_OUTPUT"
          # Docs and Edge never need a lookup of accepted Native runs.
          if [[ "$scope" == "docs" || "$scope" == "cloudflare" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "native_required=false" >> "$GITHUB_OUTPUT"
            echo "native_proof=COMPONENT_SCOPED_UNCHANGED_NATIVE" >> "$GITHUB_OUTPUT"
            echo "reason=$scope-only; Native source unaffected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # GitHub's Actions REST index can return ZERO entries when
            # status=completed is combined with an exact successful PR head
            # (observed on accepted #635/#637). Query the unfiltered immutable
            # head and check status/conclusion locally. Retry only bounded
            # eventual-consistency gaps; never compile a second Engine on main.
            for lookup_attempt in 1 2 3; do
              if ! prs_json="$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"; then
                echo "ACCEPTED_MAIN_PR_LOOKUP_RETRY=$lookup_attempt" >&2
                if [[ "$lookup_attempt" -lt 3 ]]; then sleep 2; continue; fi
                break
              fi
              head_sha="$(jq -r --arg main "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
                [.[] | select(.merged_at != null and .merge_commit_sha == $main
                  and .base.ref == "main" and .draft == false
                  and .head.repo.full_name == $repo)]
                | if length == 1 then .[0].head.sha else empty end
              ' <<<"$prs_json")"

              successful_pr_ci=0
              if [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
                # No status= query: GitHub sometimes loses already successful
                # runs in that index. Filter each immutable run here instead.
                if ! candidates="$(gh api --paginate --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" \
                  -f head_sha="$head_sha" -f event=pull_request -f per_page=100 \
                  --jq '.workflow_runs[] | select(.head_sha == "'"$head_sha"'" and .event == "pull_request"
                    and .status == "completed" and .conclusion == "success" and .run_attempt == 1
                    and .head_repository.full_name == "'"$GITHUB_REPOSITORY"'"
                    and (.path | test("^\\.github/workflows/ci\\.yml(@[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*)?$")))
                    | [.id, .run_attempt] | @tsv')"; then
                  echo "ACCEPTED_MAIN_READY_INDEX_RETRY=$lookup_attempt" >&2
                  if [[ "$lookup_attempt" -lt 3 ]]; then sleep 2; continue; fi
                  break
                fi
                while read -r run attempt; do
                  [[ -n "$run" ]] || continue
                  if ! jobs="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$attempt/jobs?per_page=100")"; then
                    echo "ACCEPTED_MAIN_READY_JOBS_RETRY=$lookup_attempt" >&2
                    continue
                  fi
                  if jq -e --argjson run "$run" --arg head "$head_sha" '
                    [.[].jobs[]] as $jobs |
                    ($jobs | length) > 0 and
                    (.[0].total_count == ($jobs | length)) and
                    all($jobs[]; .run_id == $run and .head_sha == $head and .run_attempt == 1) and
                    ([$jobs[] | select(.name == "ci")] | length == 1) and
                    ([$jobs[] | select(.name == "select-checks")] | length == 1) and
                    ([$jobs[] | select(.name == "ci" and .conclusion == "success")] | length == 1) and
                    ([$jobs[] | select(.name == "select-checks" and .conclusion == "success")] | length == 1)
                  ' <<<"$jobs" >/dev/null; then
                    successful_pr_ci=1
                    break
                  fi
                done <<<"$candidates"
                if [[ "$successful_pr_ci" -gt 0 ]]; then
                  if ! merge_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha')" ||
                     ! head_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq '.tree.sha')"; then
                    echo "ACCEPTED_MAIN_TREE_LOOKUP_RETRY=$lookup_attempt" >&2
                    if [[ "$lookup_attempt" -lt 3 ]]; then sleep 2; continue; fi
                    break
                  fi
                  if [[ "$merge_tree" =~ ^[0-9a-f]{40}$ && "$merge_tree" == "$head_tree" ]]; then
                    # A Research protocol/service edit is conservatively full
                    # on main because the Windows Cargo closure proof ran on
                    # its PR. Inherit Research-only only from that exact,
                    # successful first-attempt run AND its immutable component
                    # artifact; never trust a candidate or a missing witness.
                    if [[ "$scope" == full && '${{ steps.file_scope.outputs.manifest_candidate }}' == research ]] &&
                       jq -e --argjson run "$run" --arg head "$head_sha" '
                         [.[].jobs[]] as $jobs |
                         all($jobs[]; .run_id == $run and .head_sha == $head and .run_attempt == 1) and
                         all(["architecture-contracts", "dependency-audit", "cloudflare-mcp",
                              "research-windows", "research-clippy-windows",
                              "research-ipc-windows", "research-component-windows"][];
                           . as $name | ([$jobs[] | select(.name == $name and .conclusion == "success")] | length) == 1)
                       ' <<<"$jobs" >/dev/null; then
                      if artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")" &&
                         jq -e --arg name "okx-research-component-$head_sha" --arg head "$head_sha" --argjson run "$run" '
                           .total_count == (.artifacts | length) and .total_count < 100 and
                           ([.artifacts[] | select(.name == $name and .expired == false and
                              .id > 0 and .size_in_bytes > 0 and (.digest | test("^sha256:[0-9a-f]{64}$")) and
                              .workflow_run.id == $run and .workflow_run.repository_id == 1388071566 and
                              .workflow_run.head_repository_id == 1388071566 and
                              .workflow_run.head_sha == $head)] | length) == 1
                         ' <<<"$artifacts" >/dev/null; then
                        echo "component_scope=research" >> "$GITHUB_OUTPUT"
                        echo "ACCEPTED_MAIN_COMPONENT_SCOPE=research; exact first-attempt PR component witness"
                      fi
                    fi
                    echo "build_required=false" >> "$GITHUB_OUTPUT"
                    echo "native_required=false" >> "$GITHUB_OUTPUT"
                    echo "reason=merged tree exactly matches successful PR head tree" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                fi
              fi
              if [[ "$lookup_attempt" -lt 3 ]]; then sleep 2; fi
            done
            echo '::error title=ACCEPTED_MAIN_READY_UNPROVEN::No exact merged first-attempt Ready proof; refusing an unreviewed main build' >&2
            exit 1
          fi

          echo "build_required=true" >> "$GITHUB_OUTPUT"
          case "$scope" in
            engine)
              echo "native_required=true" >> "$GITHUB_OUTPUT"
              echo "native_proof=ENGINE_OWNER_ONLY" >> "$GITHUB_OUTPUT"
              echo "reason=Engine/Execution source; all financial witnesses required, only Engine executable needs fresh build" >> "$GITHUB_OUTPUT"
              ;;
            research)
              echo "research_only=true" >> "$GITHUB_OUTPUT"
              echo "native_required=false" >> "$GITHUB_OUTPUT"
              echo "native_proof=RESEARCH_OWNER_ONLY" >> "$GITHUB_OUTPUT"
              echo "reason=Research owner; build and verify standalone Research artifact without Engine bytes" >> "$GITHUB_OUTPUT"
              ;;
            research-host)
              echo "native_required=false" >> "$GITHUB_OUTPUT"
              echo "native_proof=RESEARCH_HOST_OWNER_CHECKS" >> "$GITHUB_OUTPUT"
              echo "reason=Research and Host sources; release job must prove unchanged Engine inputs" >> "$GITHUB_OUTPUT"
              ;;
            host-controller|host-launcher)
              echo "native_required=false" >> "$GITHUB_OUTPUT"
              echo "native_proof=HOST_WINDOWS_OWNER_AND_CONSUMER" >> "$GITHUB_OUTPUT"
              echo "reason=$scope Rust source only; run Windows host/consumer checks" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "native_required=true" >> "$GITHUB_OUTPUT"
              echo "native_proof=NONE" >> "$GITHUB_OUTPUT"
              echo "reason=Engine, shared build inputs or unverified scope" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Classification
        run: |
          {
            echo '### CI plan'
            echo 'Immutable comparison: ${{ steps.file_scope.outputs.comparison }}'
            echo 'Changed-file list accepted: ${{ steps.file_scope.outputs.diff_verified }}'
            echo 'Component scope: ${{ steps.proven_scope.outputs.scope }}'
            echo 'Cargo closure candidate: ${{ steps.file_scope.outputs.manifest_candidate }}'
            echo 'Reason: ${{ steps.classify.outputs.reason }}'
            echo 'Draft checks: ${{ steps.file_scope.outputs.draft_checks }}'
            echo 'Mandatory checks enabled: ${{ steps.classify.outputs.build_required }}'
            echo 'Trading Engine acceptance: ${{ steps.classify.outputs.native_required }}'
            echo 'Cloudflare contracts: ${{ steps.classify.outputs.edge_required }}'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  draft-component-tests:
    name: draft-owner-feedback
    needs: component_impact
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRAFT_CHECKS: ${{ needs.component_impact.outputs.draft_checks }}
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify CI routing contracts
        run: |
          if [[ -z "$DRAFT_CHECKS" && '${{ needs.component_impact.outputs.component_scope }}' != docs ]]; then
            echo 'Draft check list is missing for a code change'
            exit 1
          fi
          python3 -B scripts/test_check_p0.py
          node scripts/test-ci-main-routing.cjs
          node scripts/test-ci-component-impact.cjs
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        if: env.DRAFT_CHECKS != ''
        with:
          toolchain: 1.100.0
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.component_impact.outputs.draft_mcp == 'true'
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          cache: npm
          cache-dependency-path: cloudflare/okx-mcp/package-lock.json
      - name: Verify Rust formatting before compilation

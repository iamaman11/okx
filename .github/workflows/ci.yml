  host_component_release_windows:
    # Independent Host producer. Release bytes are compiled from a clean,
    # exact-HEAD checkout in their own runner, never from the checkout used
    # by untrusted PR-owned tests. This is NOT a complete Native ReleaseSet.
    name: host-windows
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && (needs.component_impact.outputs.component_scope == 'host-controller' || needs.component_impact.outputs.component_scope == 'host-launcher' || needs.component_impact.outputs.component_scope == 'research-host')
    runs-on: windows-latest
    env:
      # The same profile fingerprint as the trusted-main release seed.
      # PR runners may restore that cache, but must never write to it.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: host-release-cache
        with:
          prefix-key: v1-rust
          shared-key: trading-engine-release-windows
          cache-workspace-crates: true
          save-if: false
          cache-on-failure: false
      - name: Record trusted-main release cache restore
        shell: pwsh
        run: |
          "Host release Cargo cache exact hit: ${{ steps.host-release-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          "Host release cache is read-only on PR: true" >> $env:GITHUB_STEP_SUMMARY
      # This producer never invokes Host tests or runs code from their runner.
      # The artifact remains non-installable until independent contracts and
      # all other affected owners have passed the required `ci` gate.
      - name: Build both Windows host executables without Engine
        shell: pwsh
        run: |
          $dirty = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'HOST_RELEASE_CHECKOUT_DIRTY_BEFORE_BUILD' }
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          cargo build --locked --release -p okx-host-launcher -p okx-host-controller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build scripts execute from the PR source. Refuse provenance if any
          # tracked or previously untracked source changed during compilation.
          # The ignored target/ tree is only a build output, never a source.
          $dirtyAfterBuild = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirtyAfterBuild.Count -ne 0) { throw 'HOST_RELEASE_CHECKOUT_DIRTY_AFTER_BUILD' }
          $proof = @("scope=${{ needs.component_impact.outputs.component_scope }}", "head=$head", "tree=$tree", 'release_is_complete=false')
          foreach ($name in @('okx-host-launcher.exe', 'okx-host-control.exe')) {
            $path = Join-Path 'target/release' $name
            if (!(Test-Path -LiteralPath $path)) { throw "MISSING_HOST_BINARY_$name" }
            $proof += "$name=$((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant())"
          }
          $proof | Set-Content -LiteralPath "$env:RUNNER_TEMP/host-component-proof.txt" -Encoding utf8NoBOM
          # Retain real Host-only bytes and a fail-closed, explicitly
          # NON-INSTALLABLE provenance manifest. Existing CONTROL and Launcher
          # cannot consume this schema. No Engine or Research image is copied.
          $dist = Join-Path $env:RUNNER_TEMP 'okx-host-component'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $components = [ordered]@{}
          foreach ($name in @('okx-host-control.exe', 'okx-host-launcher.exe')) {
            $source = Join-Path 'target/release' $name
            $target = Join-Path $dist $name
            Copy-Item -LiteralPath $source -Destination $target
            $components[$name] = [ordered]@{
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
              size = (Get-Item -LiteralPath $target).Length
            }
          }
          Copy-Item -LiteralPath 'Cargo.lock' -Destination (Join-Path $dist 'Cargo.lock')
          $rustVersion = (& rustc --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'HOST_RUST_VERSION_UNAVAILABLE' }
          if ($rustVersion -cne 'rustc 1.100.0 (0ef1bc386 2026-11-09)') { throw 'HOST_RUST_VERSION_NOT_EXACT_PIN' }
          [ordered]@{
            schema = 'okx.windows.host-component/v1'
            ci_status_policy = 'okx.github.actions.host-ready/v1'
            repository_id = 1388071566
            source_head_sha = $head
            source_tree = $tree
            rust_version = $rustVersion
            cargo_lock_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dist 'Cargo.lock')).Hash.ToLowerInvariant()
            artifact_scope = 'host_only'
            release_is_complete = $false
            installation_allowed = $false
            components = $components
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $dist 'manifest.json') -Encoding utf8NoBOM
          python3 -B scripts/verify_host_component_release.py $dist $head $tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact Host-only bytes (NOT a deployable Native ReleaseSet)
        if: github.event_name == 'pull_request' && (needs.component_impact.outputs.component_scope == 'host-controller' || needs.component_impact.outputs.component_scope == 'host-launcher')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okx-host-component-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-host-component
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
      - name: Retain host-only build identities (not a deployable bundle)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-component-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/host-component-proof.txt
          if-no-files-found: error
          retention-days: 14

      - name: Retain fresh Host binaries for mixed owner evidence
        if: needs.component_impact.outputs.component_scope == 'research-host'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixed-host-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/okx-host-control.exe
            target/release/okx-host-launcher.exe
            ${{ runner.temp }}/host-component-proof.txt
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

  host_controller_launcher_checks:
    # Independent typed consumer acceptance. This job cannot mutate release
    # bytes in the separate producer runner, and neither job can bypass `ci`.
    name: host-contracts-windows
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && (needs.component_impact.outputs.component_scope == 'host-controller' || needs.component_impact.outputs.component_scope == 'host-launcher' || needs.component_impact.outputs.component_scope == 'research-host')
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: host-test-cache
        with:
          prefix-key: v2-rust
          shared-key: trading-engine-tests-windows
          cache-workspace-crates: true
          save-if: false
          cache-on-failure: false
      - name: Verify architecture and formatting
        shell: pwsh
        run: |
          "Host tests Cargo cache exact hit: ${{ steps.host-test-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          python3 scripts/check_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows installation root and lifecycle contracts
        shell: pwsh
        run: ./scripts/test-windows-unify-root.ps1
      - name: Clippy and test Host protocol, CONTROL, Launcher and MCP bridge consumer
        shell: pwsh
        run: |
          cargo clippy --locked -p okx-host-protocol -p okx-host-launcher -p okx-host-controller -p okx-bridge-mcp --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testLog = Join-Path $env:RUNNER_TEMP 'host-native-owner-tests.log'
          cargo test --locked -p okx-host-protocol -p okx-host-launcher -p okx-host-controller -p okx-bridge-mcp -- --test-threads 2 2>&1 |
            Tee-Object -FilePath $testLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Every process and policy witness must really execute, not merely
          # appear as a compiled or filtered test in a green cargo invocation.
          $output = Get-Content -LiteralPath $testLog -Raw
          foreach ($witness in @(
            'one_process_job_can_be_terminated_without_touching_the_other',
            'nested_job_assignment_waits_for_parent_ready_receipt',
            'research_control_root_is_independent_and_start_requires_verified_installation',
            'corrupted_and_hash_mismatched_research_image_never_launch',
            'research_state_is_strict_and_independent_of_engine_state',
            'control_reconciles_research_when_engine_image_is_incompatible',
            'independent_engine_runtime_receipt_is_strict',
            'typed_research_rollback_requires_two_distinct_exact_hashes',
            'standalone_research_lifecycle_requires_exact_image_and_process_generation',
            'standalone_research_status_is_typed_and_does_not_claim_edge_online',
            'research_token_provision_command_has_no_bearer_fields',
            'control_bridge_denies_research_mutations_before_network'
          )) {
            $pattern = 'test [^\r\n]*' + [regex]::Escape($witness) + ' \.\.\. ok'
            if ($output -notmatch $pattern) { throw "HOST_RESEARCH_OWNER_WITNESS_NOT_RUN_$witness" }
          }

  trading_engine_acceptance_windows:
    # Finance proof runs independently of process isolation witnesses.
    name: engine-windows
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.native_required != 'false' && needs.component_impact.outputs.research_only != 'true'
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: finance-test-cache
        with:
          # Trusted accepted-main builds are the only cache writers.
          cache-on-failure: false
          prefix-key: v2-rust
          shared-key: trading-engine-tests-windows
          cache-workspace-crates: true
          save-if: false

      # The Rust finance collector executes the retained workerd transport
      # witness via Node (Miniflare + esbuild). Its locked dependencies must
      # remain available on THIS runner, independently of the parallel MCP job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          cache: npm
          cache-dependency-path: cloudflare/okx-mcp/package-lock.json
      - name: Install locked financial collector transport dependencies
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The reviewed finance collector remains mandatory and complete.
      # Independent process/SQLite/MCP isolation witnesses run concurrently
      # on engine-isolation-windows; CONTROL tests and physical acceptance
      # retain their separate owners. No financial witness is skipped.
      - name: Current Rust collector negative controls
        shell: pwsh
        run: |
          cargo test --locked -p okx-native-finance-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mandatory current Rust financial property acceptance
        id: native-properties
        shell: pwsh
        run: |
          # The old Native/Worker finance driver is retired. Its properties
          # remain in the reviewed current Rust map; missing evidence BLOCKS
          # this full gate rather than falling back to historical26 results.
          cargo run --locked -p okx-native-finance-check > "$env:RUNNER_TEMP\native-finance-full.json"
          $collectorExit = $LASTEXITCODE
          if ($collectorExit -ne 0) {
            $reason = "Collector exit $collectorExit"
            try {
              $report = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\native-finance-full.json" | ConvertFrom-Json
              $identities = @($report.error, $report.failure.stage, $report.failure.package, $report.failure.code) |
                Where-Object { $_ -cmatch '^[A-Za-z0-9_.:-]{1,150}$' }
              if ($identities.Count -gt 0) { $reason += " / " + ($identities -join ' / ') }
              # Only manifest-selected witness names and finite cause codes;
              # never emit collected libtest stdout/stderr (may contain secrets).
              foreach ($witness in @($report.failed_witnesses) | Select-Object -First 12) {
                $package = [string]$witness.package
                $test = [string]$witness.test
                $cause = [string]$witness.cause_code
                if ($package -cmatch '^[A-Za-z0-9_.:-]{1,64}$' -and
                    $test -cmatch '^[A-Za-z0-9_.:-]{1,256}$' -and
                    @('LIBTEST_FAILED', 'TEST_PANIC', 'CLOCK_EVIDENCE_REJECTED', 'TEST_READINESS_TIMEOUT') -ccontains $cause) {
                  Write-Host "::error title=Native finance failed witness::$package / $test / $cause"
                }
              }
            } catch {
              $reason += ' / report unavailable'
            }
            Write-Host "::error title=Native financial acceptance::$reason"
            exit $collectorExit
          }
          # Exactly the roster excluded by the parallel regression step.
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          node scripts/ci-finance-witness-manifest.cjs --verify-report "$env:RUNNER_TEMP\native-finance-full.json" $head $tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize financial build and test time
        if: always() && steps.native-properties.outcome != 'skipped'
        shell: pwsh
        run: |
          "Windows financial Cargo cache exact hit: ${{ steps.finance-test-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          $path = Join-Path $env:RUNNER_TEMP 'native-finance-full.json'
          if (Test-Path -LiteralPath $path) {
            try { $report = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json } catch {
              'Financial timing report unavailable' >> $env:GITHUB_STEP_SUMMARY
              return
            }
            "Financial test binaries: $($report.build_ms) ms" >> $env:GITHUB_STEP_SUMMARY
            "Financial setup through teardown: $($report.runtime_setup_to_teardown_ms) ms" >> $env:GITHUB_STEP_SUMMARY
            foreach ($group in $report.stages | Where-Object { $_.stage -eq 'libtest' }) {
              "- $($group.package) / $($group.group): $($group.wall_ms) ms" >> $env:GITHUB_STEP_SUMMARY
            }
            if ($report.overall -eq 'FAIL') {
              $diagnostics = @()
              foreach ($witness in @($report.failed_witnesses) | Select-Object -First 12) {
                $package = [string]$witness.package
                $test = [string]$witness.test
                $cause = [string]$witness.cause_code
                if ($package -cmatch '^[A-Za-z0-9_.:-]{1,64}$' -and
                    $test -cmatch '^[A-Za-z0-9_.:-]{1,256}$' -and
                    @('LIBTEST_FAILED', 'TEST_PANIC', 'CLOCK_EVIDENCE_REJECTED', 'TEST_READINESS_TIMEOUT') -ccontains $cause) {
                  $diagnostics += "- $package / $test / $cause"
                }
              }
              if ($diagnostics.Count -gt 0) {
                "Failed financial witnesses (not accepted):" >> $env:GITHUB_STEP_SUMMARY
                $diagnostics | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              }
            }
          }

      - name: Upload current Rust property evidence even on failure
        if: always() && steps.native-properties.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-finance-full-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\native-finance-full.json
          if-no-files-found: error
          retention-days: 14

  trading_engine_isolation_windows:
    # Parallel Full/Engine proof: real Windows process, SQLite and MCP
    # isolation tests are independent from the financial property collector.
    # Two isolated runners preserve their clock/resource observations.
    name: engine-isolation-windows
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.native_required != 'false' && needs.component_impact.outputs.research_only != 'true'
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: isolation-test-cache
        with:
          cache-on-failure: false
          prefix-key: v2-rust
          shared-key: trading-engine-tests-windows
          cache-workspace-crates: true
          save-if: false
      - name: Summarize independent isolation owner
        shell: pwsh
        run: |
          'Scope: Full/Engine process + SQLite + real loopback MCP witnesses' >> $env:GITHUB_STEP_SUMMARY
          'Windows isolation Cargo cache exact hit: ${{ steps.isolation-test-cache.outputs.cache-hit }}' >> $env:GITHUB_STEP_SUMMARY

      - name: Windows installation root migration contracts
        shell: pwsh
        run: ./scripts/test-windows-unify-root.ps1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          cache: npm
          cache-dependency-path: cloudflare/okx-mcp/package-lock.json
      - name: Install locked production workerd test dependencies on Windows
        # The isolated MCP/DO/WSS finance witness runs on both PR and main.
        # Its Node fixture imports esbuild, so the locked npm tree is required
        # for the post-merge push gate as well as the PR release matrix.
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Previous Research catalog through MCP with Engine absent
        if: needs.component_impact.outputs.edge_required == 'true'
        shell: pwsh
        run: |
          $output = & cargo test --locked -p okx-research-service --lib edge_runtime::standalone_mcp_tests::standalone_catalog_reopens_through_real_mcp_do_websocket -- --exact --ignored --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed;') {
            throw 'STANDALONE_RESEARCH_MCP_WITNESS_NOT_RUN'
          }

      - name: Build research worker for isolated process contracts
        shell: pwsh
        run: |
          # The process-level production singleton remains strict. Legacy
          # T10 tests get an opt-in debug worker plus a non-shipping Research-
          # owned load fixture. The shipping release build enables neither.
          cargo build --locked -p okx-research-service --bin okx-research-service --features test-isolated-singleton
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath 'target/debug/okx-research-service.exe' -Destination 'target/debug/okx-research-service-test-isolated.exe'
          cargo build --locked -p okx-research-service --bin okx-research-load-fixture --features test-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'target/debug/okx-research-load-fixture.exe')) { throw 'RESEARCH_TEST_LOAD_FIXTURE_BINARY_MISSING' }

      - name: Isolated Native pending-fill crash recovery
        shell: pwsh
        run: |
          cargo test --locked -p okx-trading-engine --lib accounts::native_trade_contracts::native_crash::risk_book_contract_native_os_kill_pending_fill_projects_once -- --exact --test-threads 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The seven real SQL-owner cleanup transitions have bounded deadlines.
      # Run them separately so unrelated fixtures cannot age campaign-opening
      # or worker-termination observations during signed readback checks.
      - name: Isolated native protection cleanup SQL regressions
        shell: pwsh
        run: |
          $output = & cargo test --locked -p okx-trading-engine --lib trade_service::protection_cleanup::protection_cleanup_direct_tests:: -- --nocapture --test-threads 2 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 7 passed; 0 failed;') { throw 'PROTECTION_CLEANUP_EXACT_SEVEN_TESTS_MISSING' }

      # Keep the process tree exclusive to this one heavy test so resource
      # observations cannot include unrelated financial regression fixtures.
      - name: Engine autonomy under heavy research process tree
        id: engine-autonomy
        shell: pwsh
        run: |
          $env:OKX_RESEARCH_SERVICE_TEST_EXE = (Resolve-Path 'target/debug/okx-research-service-test-isolated.exe').Path
          $env:OKX_RESEARCH_LOAD_FIXTURE_EXE = (Resolve-Path 'target/debug/okx-research-load-fixture.exe').Path
          $output = & cargo test --locked -p okx-trading-engine --lib accounts::native_trade_contracts::native_engine_research::engine_maintenance_and_stop_remain_independent_of_heavy_research_and_disconnect -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\b-process-tree.log" | Out-Host
          if ($code -ne 0) { exit $code }
          $log = $output -join "`n"
          if ($log -notmatch 'test result: ok\. 1 passed;') { throw 'ENGINE_RESEARCH_EXACT_TEST_MISSING' }
          $matches = [regex]::Matches($log, 'RESEARCH_PROCESS_TREE=(\{[^\r\n]+\})')
          if ($matches.Count -ne 1) { throw 'PROCESS_TREE_RECEIPT_MISSING_OR_DUPLICATED' }
          $receipt = $matches[0].Groups[1].Value | ConvertFrom-Json
          if ($receipt.status -cne 'MEASURED') { throw 'PROCESS_TREE_NOT_MEASURED' }
          $matches[0].Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\b-process-tree.json" -Encoding utf8NoBOM

      - name: Upload Engine research process-tree observation
        if: always() && steps.engine-autonomy.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-research-process-tree-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}\b-process-tree.log
            ${{ runner.temp }}\b-process-tree.json
          if-no-files-found: error
          retention-days: 14

      # CONTROL supplies this incarnation in production. The loopback fixture
      # needs a synthetic valid value; no production transport or identity is
      # involved. Run alone so its process-tree and finance p95 are meaningful.
      - name: MCP DO WSS Native finance under isolated Research load
        id: mcp-native-load
        shell: pwsh
        env:
          OKX_CONTROL_AGENT_INCAR: ctl_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          $env:OKX_RESEARCH_SERVICE_TEST_EXE = (Resolve-Path 'target/debug/okx-research-service-test-isolated.exe').Path
          $env:OKX_RESEARCH_LOAD_FIXTURE_EXE = (Resolve-Path 'target/debug/okx-research-load-fixture.exe').Path
          $output = & cargo test --locked -p okx-trading-engine --lib accounts::native_trade_contracts::native_engine_research::mcp_http_durable_object_wss_native_finance_stays_readable_under_heavy_research -- --exact --nocapture --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\mcp-native-load.log" | Out-Host
          if ($code -ne 0) { exit $code }
          $log = $output -join "`n"
          if ($log -notmatch 'test result: ok\. 1 passed;') { throw 'MCP_NATIVE_LOAD_EXACT_TEST_MISSING' }
          $receipts = [regex]::Matches($log, 'T10_MCP_NATIVE_LOAD_JSON:(\{[^\r\n]+\})')
          if ($receipts.Count -ne 1) { throw 'MCP_NATIVE_LOAD_RECEIPT_MISSING_OR_DUPLICATED' }
          $receipt = $receipts[0].Groups[1].Value | ConvertFrom-Json
          if ($receipt.schema -cne 'okx.518.t10-mcp-do-wss-native-finance/v1' -or
              $receipt.mcp_transport -cne 'real_loopback_http_miniflare_sqlite_do_websocket_native' -or
              $receipt.exchange_trade_post -ne $false) { throw 'MCP_NATIVE_LOAD_RECEIPT_INVALID' }
          $receipts[0].Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\mcp-native-load.json" -Encoding utf8NoBOM

      - name: Upload isolated MCP DO WSS Native load observation
        if: always() && steps.mcp-native-load.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-native-load-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}\mcp-native-load.log
            ${{ runner.temp }}\mcp-native-load.json
          if-no-files-found: error
          retention-days: 14

  trading_engine_regressions_windows:
    # The Windows aggregate requires every suite in this matrix. Clippy runs
    # after Host tests on its existing runner, without extra Engine jobs.
    name: trading-engine-regressions-windows (${{ matrix.suite }})
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.native_required != 'false' && needs.component_impact.outputs.research_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [engine, host, execution, research]
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: ${{ matrix.suite == 'host' && 'clippy' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Separate runners restore the same accepted-main compiler cache.
          cache-on-failure: false
          prefix-key: v2-rust
          shared-key: trading-engine-tests-windows
          cache-workspace-crates: true
          save-if: false

      - name: Strategy Core and Research owner regressions on full Windows
        if: matrix.suite == 'research'
        shell: pwsh
        run: |
          # Full Native remains responsible for Agent/IPC migration consumers.
          cargo test --locked -p okx-strategy-core -p okx-research
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build research worker for regression process contracts
        if: matrix.suite == 'engine'
        shell: pwsh
        run: |
          cargo build --locked -p okx-research-service --bin okx-research-service --features test-isolated-singleton
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath 'target/debug/okx-research-service.exe' -Destination 'target/debug/okx-research-service-test-isolated.exe'
          cargo build --locked -p okx-research-service --bin okx-research-load-fixture --features test-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'target/debug/okx-research-load-fixture.exe')) { throw 'RESEARCH_TEST_LOAD_FIXTURE_BINARY_MISSING' }

      - name: Remaining native regression tests for this suite
        if: matrix.suite == 'engine' || matrix.suite == 'host' || matrix.suite == 'execution'
        shell: pwsh
        env:
          NATIVE_REGRESSION_SUITE: ${{ matrix.suite }}
        run: |
          $packages = switch ($env:NATIVE_REGRESSION_SUITE) {
            'engine' {
              $env:OKX_RESEARCH_SERVICE_TEST_EXE = (Resolve-Path 'target/debug/okx-research-service-test-isolated.exe').Path
              $env:OKX_RESEARCH_LOAD_FIXTURE_EXE = (Resolve-Path 'target/debug/okx-research-load-fixture.exe').Path
              'okx-trading-engine'
            }
            'host' { 'okx-host-controller'; 'okx-host-launcher'; 'okx-host-protocol'; 'okx-bridge-mcp' }
            'execution' { 'okx-trade-execution' }
            default { throw 'UNKNOWN_NATIVE_REGRESSION_SUITE' }
          }
          # Compile no extra Engine example just to discover the reviewed
          # Rust witness set (~79s in measured Ready). The source parser
          # accepts only explicit immutable Witness + CONTRACTS syntax.
          # Parallel acceptance independently proves FULL_PASS and compares
          # this set to every current-tree executed witness; any difference
          # keeps the protected ci gate RED.
          $manifestJson = & node scripts/ci-finance-witness-manifest.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $covered = @(($manifestJson | ConvertFrom-Json).witnesses)
          $ownerTestLines = [System.Collections.Generic.List[string]]::new()
          foreach ($package in $packages) {
            $testArgs = @('--skip','accounts::native_trade_contracts::native_engine_research::engine_maintenance_and_stop_remain_independent_of_heavy_research_and_disconnect','--skip','accounts::native_trade_contracts::native_engine_research::mcp_http_durable_object_wss_native_finance_stays_readable_under_heavy_research','--skip','trade_service::protection_cleanup::protection_cleanup_direct_tests::','--test-threads','2')
            # OS-kill is checked exclusively in the finance/isolated job.
            if ($package -eq 'okx-trading-engine') {
              $testArgs += @('--skip','accounts::native_trade_contracts::native_crash::risk_book_contract_native_os_kill_pending_fill_projects_once')
              # Six Native account/catalog fixtures verify the actual writer
              # termination and SQLite lease within 3s. Do not race their
              # clocks against hundreds of independent Engine fixtures.
              $testArgs += @('--skip','accounts::native_connect_contracts::')
              # These two real-clock source-frontier tests must not race each
              # other for 2s market / 5s account freshness on a loaded runner.
              # They are mandatory in the explicitly counted serial step below.
              $testArgs += @('--skip','trade_service::terminal_release::tests::stale_fill_coverage_blocks_release_before_worker')
              $testArgs += @('--skip','trade_service::terminal_release::tests::stale_bill_coverage_blocks_settlement_after_inspect')
            }
            foreach ($witness in @($covered | Where-Object package -eq $package)) { $testArgs += @('--skip',$witness.test) }
            Write-Host "Remaining regression: $package; financial witnesses routed to full collector: $(@($covered | Where-Object package -eq $package).Count)"
            $failedTests = [System.Collections.Generic.List[string]]::new()
            # Several bin/doc targets legitimately have zero tests. Require
            # at least one real passing test target per selected Rust package;
            # a successful Cargo process with every target filtered is not CI.
            $passedByTarget = [System.Collections.Generic.List[int]]::new()
            & cargo test --locked -p $package -- @testArgs 2>&1 | ForEach-Object {
              $line = "$_"
              Write-Host $line
              if ($line -cmatch '^test result: ok\. ([0-9]+) passed; 0 failed;') {
                $passedByTarget.Add([int]$Matches[1])
              }
              if ($line -cmatch '^test ([A-Za-z0-9_:]+) \.\.\. FAILED$') {
                $failedTests.Add($Matches[1])
              }
              if ($env:NATIVE_REGRESSION_SUITE -eq 'host' -and $line -cmatch '^test [A-Za-z0-9_:]+ \.\.\. ok$') {
                $ownerTestLines.Add($line)
              }
            }
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              if ($failedTests.Count -eq 0) {
                Write-Host "::error title=Windows regression in ${package}::Cargo exited $exitCode before a failing test was reported."
              }
              foreach ($testName in $failedTests) {
                Write-Host "::error title=Windows regression in ${package}::$testName"
              }
              exit $exitCode
            }
            if (@($passedByTarget | Where-Object { $_ -gt 0 }).Count -eq 0) {
              throw "NATIVE_REGRESSION_PACKAGE_ZERO_EXECUTED_TESTS_$package"
            }
          }
          if ($env:NATIVE_REGRESSION_SUITE -eq 'host') {
            # Full-scope PRs skip the dedicated Host owner job, but must still
            # execute the Windows-only Research child/Job tests and typed wire.
            $passed = $ownerTestLines -join "`n"
            foreach ($witness in @(
              'one_process_job_can_be_terminated_without_touching_the_other',
              'nested_job_assignment_waits_for_parent_ready_receipt',
              'research_control_root_is_independent_and_start_requires_verified_installation',
              'corrupted_and_hash_mismatched_research_image_never_launch',
              'research_state_is_strict_and_independent_of_engine_state',
              'control_reconciles_research_when_engine_image_is_incompatible',
              'independent_engine_runtime_receipt_is_strict',
              'typed_research_rollback_requires_two_distinct_exact_hashes',
              'standalone_research_lifecycle_requires_exact_image_and_process_generation',
              'standalone_research_status_is_typed_and_does_not_claim_edge_online',
              'research_token_provision_command_has_no_bearer_fields',
              'control_bridge_denies_research_mutations_before_network'
            )) {
              if ($passed -notmatch ('test [^\r\n]*' + [regex]::Escape($witness) + ' \.\.\. ok')) {
                throw "FULL_HOST_RESEARCH_WITNESS_NOT_RUN_$witness"
              }
            }
          }

      - name: Clippy native Windows crates
        if: matrix.suite == 'host'
        shell: pwsh
        run: |
          cargo clippy --locked -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-trade-execution --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Serial native account catalog and writer-termination regressions
        if: matrix.suite == 'engine'
        shell: pwsh
        run: |
          # Keep the original 3s SQLite writer release deadlines and all six
          # real file-lock/recovery tests; only the test-harness scheduling
          # changes. A missing test cannot be counted as passed.
          $output = & cargo test --locked -p okx-trading-engine --lib accounts::native_connect_contracts:: -- --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 6 passed; 0 failed;') {
            throw 'NATIVE_ACCOUNT_CATALOG_ALL_SIX_TESTS_REQUIRED'
          }

      - name: Serial terminal release source-frontier regression
        if: matrix.suite == 'engine'
        shell: pwsh
        run: |
          # Still execute BOTH original real-clock tests on this exact tree.
          # Their initial market and private-account sources must remain FRESH;
          # no production timeouts, assertions or recorded bytes are changed.
          $output = & cargo test --locked -p okx-trading-engine --lib trade_service::terminal_release::tests::stale_ -- --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 2 passed; 0 failed;') {
            throw 'BOTH_TERMINAL_SOURCE_FRONTIER_WITNESSES_REQUIRED'
          }

      - name: Exact source-capture queue retry negative control
        if: matrix.suite == 'engine'
        shell: pwsh
        run: |
          # Execute the new unit negative, not just compile it into the 62
          # fixed financial witnesses. Other typed SQL/queue errors must
          # remain hard failures; no deadline, actor or frontier is relaxed.
          $testName = 'accounts::native_trade_contracts::filled_fixture::source_read_fixture_retry_is_exact_and_never_accepts_other_finance_errors'
          $output = & cargo test --locked -p okx-trading-engine --lib $testName -- --exact --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          $log = $output -join "`n"
          $passedLine = '(?m)^test ' + [regex]::Escape($testName)
          $oneSelected = 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;'
          if ($log -notmatch ($passedLine + ' \.\.\. ok$') -or
              $log -notmatch ($oneSelected + ' [1-9][0-9]* filtered out;')) {
            throw 'SOURCE_CAPTURE_QUEUE_RETRY_NEGATIVE_TEST_NOT_EXECUTED'
          }

      # K9 runs once on its own runner, not beside isolated OS/SQL clocks.
      - name: Worker library regression and actual IPC child
        if: matrix.suite == 'research'
        shell: pwsh
        run: |
          $output = & cargo test --locked -p okx-research-service --lib -- --skip analytics::cpu_executor::heavy_fixtures::two_heavy_research_jobs_ingestion_stop_and_cancel_latency --test-threads 2 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          $workerTests = $output -join "`n"
          if ($workerTests -notmatch 'test result: ok\. [1-9][0-9]* passed;') { throw 'WORKER_ANALYTICS_TESTS_MISSING' }
          foreach ($witness in @(
            'research_token_validation_is_bounded_and_ascii_only',
            'research_native_target_is_distinct_from_engine',
            'mock_store_never_exposes_research_bearer_to_engine_target',
            'research_starts_only_after_finite_supervisor_job_receipt',
            'installed_research_bearer_is_pinned_to_control_edge_origin'
          )) {
            if ($workerTests -notmatch ('test [^\r\n]*' + [regex]::Escape($witness) + ' \.\.\. ok')) {
              throw "WINDOWS_RESEARCH_SECRET_OWNER_WITNESS_NOT_RUN_$witness"
            }
          }
          # Each IPC case starts real Windows child processes and nested Jobs.
          # Serialize cases; their own 10s Hello/command deadlines stay intact.
          $output = & cargo test --locked -p okx-research-service --test ipc_process -- --nocapture --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 10 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;') {
            throw 'WORKER_IPC_ALL_TEN_TESTS_REQUIRED'
          }

      - name: Engine rejects Research owner attempts to mutate Native finance
        if: matrix.suite == 'engine'
        shell: pwsh
        run: |
          # The removed Engine ResearchClient integration suite must not be
          # replaced by a green 0-test filter. Research-owned T06–T12 child
          # causality now runs through Research ipc_process; this separate
          # actual Engine test proves Research handoff cannot enqueue writes.
          $output = & cargo test --locked -p okx-trading-engine --lib query::public_dispatch_tests::research_owner_handoff_cannot_change_native_finance_files_or_enqueue_writes -- --exact --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          # `--exact` selects this one named test and filters out the other
          # Engine libtests. Zero filtered would reject a correctly scoped
          # current suite; instead require BOTH this test's positive line and
          # one exact passing result with a nonzero filtered roster.
          $log = $output -join "`n"
          $testName = 'query::public_dispatch_tests::research_owner_handoff_cannot_change_native_finance_files_or_enqueue_writes'
          if ($log -notmatch ('(?m)^test ' + [regex]::Escape($testName) + ' \.\.\. ok$') -or
              $log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [1-9][0-9]* filtered out;') {
            throw 'ENGINE_RESEARCH_OWNER_FINANCE_DENIAL_EXACT_TEST_REQUIRED'
          }

      # Worker-local CPU/cancellation benchmark, not physical Engine autonomy.
      - name: K9 worker two-heavy cancellation latency evidence
        if: matrix.suite == 'research'
        shell: pwsh
        run: |
          cargo test --locked -p okx-research-service --lib two_heavy_research_jobs_ingestion_stop_and_cancel_latency -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          if ($log -notmatch 'test result: ok\. [1-9][0-9]* passed;') { throw 'K9_WORKER_TEST_MISSING' }
          $line = [regex]::Match($log, 'ANALYTICS_PERF_JSON:(\{[^\r\n]+\})')
          if (-not $line.Success) { throw "K9_PERF_RECEIPT_MISSING" }
          $evidence = $line.Groups[1].Value | ConvertFrom-Json
          if ($evidence.two_heavy_stop.measurements -ne 30) { throw "K9_PERF_SAMPLE_COUNT_INVALID" }
          if ($evidence.two_heavy_stop.os -ne "windows") { throw "K9_PERF_NOT_WINDOWS" }
          $line.Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\k9-native-evidence.json" -Encoding utf8NoBOM

      - name: Upload K9 native latency evidence
        if: matrix.suite == 'research'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k9-native-two-heavy-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\k9-native-evidence.json
          if-no-files-found: error
          retention-days: 14

  research_ipc_windows:
    # The ten real Windows child-process tests and the ignored live MCP/DO/WSS
    # witness run in parallel with the Research owner unit tests and release.
    # Research+Host retains the original single owner runner for accepted v3
    # mixed-component evidence; this job is only for a strict Research-only diff.
    name: research-ipc-windows
    needs: component_impact
    if: github.event_name == 'pull_request' && needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.research_only == 'true'
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact immutable PR HEAD for Research IPC
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha }}'
          if ($expected -cnotmatch '^[0-9a-f]{40}$' -or
              (git rev-parse HEAD).Trim() -cne $expected) {
            throw 'RESEARCH_IPC_NOT_EXACT_PR_HEAD'
          }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: research-ipc-cache
        with:
          prefix-key: v2-research-sccache
          shared-key: research-service-windows
          cache-workspace-crates: true
          save-if: false
          cache-on-failure: false
      - name: Export Research PR cache runtime credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install pinned Research compiler cache
        id: research-sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Enable read-only Research compiler cache
        shell: pwsh
        run: |
          'SCCACHE_GHA_ENABLED=on' >> $env:GITHUB_ENV
          'SCCACHE_GHA_VERSION=okx-research-sccache-v1' >> $env:GITHUB_ENV
          'SCCACHE_GHA_RW_MODE=READ_ONLY' >> $env:GITHUB_ENV
          'RUSTC_WRAPPER=sccache' >> $env:GITHUB_ENV
      - name: Prefer cached offline Cargo sources when complete
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & cargo fetch --locked --offline 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "CARGO_NET_OFFLINE=true" >> $env:GITHUB_ENV
            "Research IPC Cargo registry: complete local cache; offline" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Research IPC Cargo registry: incomplete cache; ordinary online fallback" >> $env:GITHUB_STEP_SUMMARY
            # GitHub's pwsh wrapper exits with LASTEXITCODE after this step.
            # The offline *probe* is optional; only the real build is gated.
            $global:LASTEXITCODE = 0
          }
      - name: Retain only byte-identical Research IPC Cargo fingerprints
        shell: pwsh
        env:
          OKX_RESEARCH_PR_SHA: ${{ github.event.pull_request.head.sha }}
          OKX_RESEARCH_ONLY: ${{ needs.component_impact.outputs.research_only }}
        run: |
          node scripts/research-trusted-cargo-freshness.cjs "profile=debug" "head=$env:OKX_RESEARCH_PR_SHA" "cacheHit=${{ steps.research-ipc-cache.outputs.cache-hit }}" "researchOnly=$env:OKX_RESEARCH_ONLY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: All ten real Research child IPC process tests
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          "Research IPC Cargo cache exact hit: ${{ steps.research-ipc-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          . ./scripts/research-cargo-fingerprint-evidence.ps1
          Write-ResearchCargoMtimeSnapshot -Profile debug
          $fingerprintCounts = New-ResearchCargoFingerprintCounts
          # The existing 10-second Hello/command deadlines are unchanged. A
          # failing, skipped or filtered Windows IPC witness blocks Ready.
          # Cargo 1.100 documents this module at INFO. Only this command sees
          # the diagnostic env; setting it at job scope would change cache keys.
          $env:CARGO_LOG = 'cargo::compiler::fingerprint=info'
          $ipcOutput = & cargo test --locked -p okx-research-service --test ipc_process -- --nocapture --test-threads 1 2>&1 |
            ForEach-Object { if (-not (Test-ResearchCargoFingerprintLogLine -Line $_ -Counts $fingerprintCounts)) { $_ } }
          $code = $LASTEXITCODE
          Remove-Item Env:CARGO_LOG
          Write-ResearchCargoFingerprintCounts -Counts $fingerprintCounts -Job ipc
          $ipcOutput | Out-Host
          if ($code -ne 0) { exit $code }
          if (($ipcOutput -join "`n") -notmatch 'test result: ok\. 10 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;') {
            throw 'RESEARCH_IPC_ALL_TEN_TESTS_REQUIRED'
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          cache: npm
          cache-dependency-path: cloudflare/okx-mcp/package-lock.json
      - name: Install isolated Research MCP/DO/WSS fixture dependencies
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Research owner live loopback MCP DO WSS without Engine
        shell: pwsh
        run: |
          # This witness is #[ignore] by default. Require the actual loopback
          # Miniflare DO/WebSocket test to run, never a skipped Rust summary.
          $output = & cargo test --locked -p okx-research-service --lib edge_runtime::standalone_mcp_tests::standalone_catalog_reopens_through_real_mcp_do_websocket -- --exact --ignored --nocapture --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed;') {
            throw 'RESEARCH_ONLY_REAL_MCP_DO_WSS_WITNESS_NOT_EXECUTED'
          }
      - name: Research IPC compiler cache statistics
        if: always() && steps.research-sccache.outcome == 'success'
        continue-on-error: true # Cache observability must not replace IPC acceptance.
        shell: pwsh
        run: |
          $stats = @(& sccache --show-stats 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_IPC_SCCACHE_STATS_UNAVAILABLE' }
          $stats | Where-Object { [string]$_ -match '^\s*(Compile requests|Cache hits|Cache misses|Cache read errors|Cache write errors|Non-cacheable compilations)' } | Out-Host


name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Decide whether compilation is required
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-push event" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prs_json="$(gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"

          head_sha="$(jq -r '
            [.[] | select(.merged_at != null and .base.ref == "main")]
            | first
            | .head.sha // empty
          ' <<<"$prs_json")"

          if [[ -z "$head_sha" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=direct main push or no merged PR association" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          successful_pr_ci="$(gh api             --method GET             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/runs"             -f head_sha="$head_sha"             -f event="pull_request"             -f status="completed"             -f per_page=100             --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')"

          if [[ "$successful_pr_ci" -gt 0 ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "reason=merged PR head already passed CI" >> "$GITHUB_OUTPUT"
          else
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=no successful PR CI found for merged head" >> "$GITHUB_OUTPUT"
          fi

      - name: Classification
        run: |
          echo "BUILD_REQUIRED=${{ steps.classify.outputs.build_required }}"
          echo "REASON=${{ steps.classify.outputs.reason }}"

  linux:
    name: linux-core
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy portable crates
        run: cargo clippy --workspace --exclude okx-agent --exclude okx-host-control --all-targets -- -D warnings

      - name: Test portable crates
        run: cargo test --workspace --exclude okx-agent --exclude okx-host-control

  windows-agent:
    name: windows-native
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy native Windows crates
        run: cargo clippy -p okx-agent -p okx-host-control --all-targets -- -D warnings

      - name: Test native Windows crates
        run: cargo test -p okx-agent -p okx-host-control

      - name: Build deployable Windows binaries
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          cargo build --release -p okx-agent -p okx-host-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dist = Join-Path $env:RUNNER_TEMP "okx-windows-bundle"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "target\release\okx-agent.exe" (Join-Path $dist "okx-agent.exe")
          Copy-Item "target\release\okx-host-control.exe" (Join-Path $dist "okx-host-control.exe")
          Copy-Item "Cargo.lock" (Join-Path $dist "Cargo.lock")

          $sourceHead = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          $agentHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-agent.exe")).Hash.ToLowerInvariant()
          $controllerHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-host-control.exe")).Hash.ToLowerInvariant()
          $rustVersion = (rustc --version).Trim()

          $manifest = [ordered]@{
            schema = "okx.windows.bundle/v1"
            repository_id = 1388071566
            source_head_sha = $sourceHead
            source_tree = $sourceTree
            rust_version = $rustVersion
            files = [ordered]@{
              "okx-agent.exe" = [ordered]@{ sha256 = $agentHash }
              "okx-host-control.exe" = [ordered]@{ sha256 = $controllerHash }
            }
          }

          $manifest |
            ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $dist "manifest.json") -Encoding utf8NoBOM

      - name: Upload deployable Windows bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: okx-windows-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-windows-bundle
          if-no-files-found: error
          retention-days: 14

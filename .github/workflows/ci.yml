name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      # Existing A1 work branch: targeted Windows only, no premature full gate.
      - work/t10-07-one-campaign-native-20261105
  workflow_dispatch:
    inputs:
      run_a1:
        description: 'Run exact 21-case A1 gate on this SHA (no duplicate target preflight)'
        type: boolean
        required: false
        default: false
      target_case:
        description: 'One targeted Windows integration case, B1 or S2-05 (not 26/26)'
        type: choice
        required: false
        default: T09.6
        options:
          - T09.1
          - T09.5
          - B1
          - S2-05
          - T10-14
          - T10-03
          - T10-05
          - T10-06
          - T10-08
          - T10-09
          - T10-10
          - T10-11
          - T10-12
          - T10-15
          - T09.3
          - T09.4
          - T09.6
          - T09.7
          - T09.8

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  classify:
    name: classify
    if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/work/t10-07-one-campaign-native-20261105'
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Decide whether compilation is required
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-push event" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prs_json="$(gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"

          head_sha="$(jq -r '
            [.[] | select(.merged_at != null and .base.ref == "main")]
            | first
            | .head.sha // empty
          ' <<<"$prs_json")"

          if [[ -z "$head_sha" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=direct main push or no merged PR association" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          successful_pr_ci="$(gh api             --method GET             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/runs"             -f head_sha="$head_sha"             -f event="pull_request"             -f status="completed"             -f per_page=100             --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')"

          merge_tree="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" \
            --jq '.tree.sha')"
          head_tree="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
            --jq '.tree.sha')"

          if [[ "$successful_pr_ci" -gt 0 && "$merge_tree" == "$head_tree" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "reason=merged tree exactly matches successful PR head tree" >> "$GITHUB_OUTPUT"
          elif [[ "$successful_pr_ci" -gt 0 ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=merge tree differs from successful PR head tree" >> "$GITHUB_OUTPUT"
          else
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=no successful PR CI found for merged head" >> "$GITHUB_OUTPUT"
          fi

      - name: Classification
        run: |
          echo "BUILD_REQUIRED=${{ steps.classify.outputs.build_required }}"
          echo "REASON=${{ steps.classify.outputs.reason }}"

  architecture:
    name: architecture
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Architecture checker self-test
        run: python3 scripts/check_architecture.py --self-test

      - name: Enforce accepted local-crate dependency graph
        run: python3 scripts/check_architecture.py

      - name: Verify versioned SQLite account ledger schema
        run: python3 scripts/check_ledger_sql.py

      - name: Verify exact T09/T10 required-case manifest
        run: node scripts/run-trade-integration.mjs --list

      - name: Reject incomplete or fabricated T09/T10 runner evidence
        run: node scripts/run-trade-integration.mjs --self-test

      - name: Verify clean Engine product contract
        run: |
          python3 scripts/check_product_contract.py --self-test
          python3 scripts/check_product_contract.py

      - name: Verify fail-closed capability acceptance
        run: python3 scripts/acceptance_product.py --self-test


  linux-rust:
    name: linux-rust
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy portable crates
        run: cargo clippy --locked --workspace --exclude okx-agent --exclude okx-host-control --all-targets -- -D warnings

      - name: Test portable crates
        run: cargo test --locked --workspace --exclude okx-agent --exclude okx-host-control

      - name: Accept one million native SQLite terminal intents
        timeout-minutes: 30
        run: cargo test --locked -p okx-execution --lib sqlite_million_history_bounded_rss -- --ignored --nocapture

      - name: Measure two-account 100-parallel native SQL (not WSS)
        run: cargo test --locked -p okx-execution --lib two_account_100_parallel_sql_readonly_isolation -- --nocapture

      - name: Verify actual Worker governance CAS history against native SQL owner
        shell: bash
        run: |
          set -euo pipefail
          # Run in the same job/toolchain that already compiled native SQL.
          # No new runner or production transport, no additional Rust rebuild.
          # Native SQL creates actual immutable terminal fill/bill admission
          # and campaign source *before* the Worker financial CAS fixture.
          # This is a single offline CI composition, no real exchange POST.
          OKX_E1_BRIDGE_SOURCE_PATH="$RUNNER_TEMP/e1-native-sql-source.json" \
            cargo test --locked -p okx-execution --lib \
              e1_e2_native_real_fee_sources_baseline_and_second_admission_under_ten -- --nocapture
          test -s "$RUNNER_TEMP/e1-native-sql-source.json"
          pushd cloudflare/okx-mcp
          npm ci --ignore-scripts --no-audit --no-fund
          OKX_E1_BRIDGE_SOURCE_JSON="$(cat "$RUNNER_TEMP/e1-native-sql-source.json")" \
            OKX_A2_TRACE=1 npm run check | tee "$RUNNER_TEMP/a2-worker-cas.log"
          popd
          test "$(grep -c '^E1_SQL_WORKER_BRIDGE_TRACE_V1:' "$RUNNER_TEMP/a2-worker-cas.log")" -eq 1
          sed -n 's/^E1_SQL_WORKER_BRIDGE_TRACE_V1://p' "$RUNNER_TEMP/a2-worker-cas.log" \
            > "$RUNNER_TEMP/e1-worker-riskbook.json"
          test -s "$RUNNER_TEMP/e1-worker-riskbook.json"
          OKX_E1_BRIDGE_SOURCE_PATH="$RUNNER_TEMP/e1-native-sql-source.json" \
            OKX_E1_BRIDGE_RESULT_PATH="$RUNNER_TEMP/e1-worker-riskbook.json" \
            cargo test --locked -p okx-execution --lib \
              e1_worker_finance_receipt_roundtrip_matches_native_sql_after_restart -- --ignored --nocapture
          test "$(grep -c '^A2_SQL_BRIDGE_TRACE_V1:' "$RUNNER_TEMP/a2-worker-cas.log")" -eq 1
          sed -n 's/^A2_SQL_BRIDGE_TRACE_V1://p' "$RUNNER_TEMP/a2-worker-cas.log" > "$RUNNER_TEMP/a2-worker-governance.json"
          test -s "$RUNNER_TEMP/a2-worker-governance.json"
          OKX_A2_TRACE_PATH="$RUNNER_TEMP/a2-worker-governance.json" \
            cargo test --locked -p okx-protocol --lib worker_do_policy_frames_decode_and_fail_closed_in_native_protocol -- --ignored --nocapture
          OKX_A2_TRACE_PATH="$RUNNER_TEMP/a2-worker-governance.json" \
            cargo test --locked -p okx-execution --lib central_worker_cas_trace_native_sql_readback_and_restart -- --ignored --nocapture

      - name: Real Rust Native WSS to persisted Worker SQLite DO (no exchange POST)
        timeout-minutes: 8
        working-directory: cloudflare/okx-mcp
        run: OKX_NATIVE_WORKER_INTEGRATION=1 node scripts/test-runtime-do.mjs


  cloudflare-mcp:
    name: cloudflare-mcp
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/okx-mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Install locked package surface
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run check
      - name: Accept production RuntimeSession backed by persisted workerd SQLite
        run: node scripts/test-runtime-do.mjs

      # B1/#449 T10-07: real SQLite-backed Worker shared-cap prerequisite.
      # This is NOT Native/SQL T10-07 acceptance; mandatory 26-case gate stays blocked.
      - name: B1 Worker two-account shared-cap regression (component only)
        working-directory: .
        run: |
          node scripts/trade-integration/worker-shared-cap.mjs --self-test
          node scripts/trade-integration/worker-shared-cap.mjs --artifacts "${{ runner.temp }}/b1-worker-cap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-worker-only-${{ github.sha }}
          path: ${{ runner.temp }}/b1-worker-cap
          retention-days: 7
          if-no-files-found: warn

      - name: Reject drift in generated MCP public contracts
        working-directory: cloudflare/okx-mcp
        run: git diff --exit-code -- contracts/tools.schema.json contracts/action-fixtures.json



  linux:
    name: linux-core
    needs: [classify, architecture, linux-rust, cloudflare-mcp]
    if: always() && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/work/t10-07-one-campaign-native-20261105'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required Linux, architecture and Cloudflare gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.classify.result }}" = "success"
          if [[ "${{ needs.classify.outputs.build_required }}" == "false" ]]; then
            echo "REUSED_SUCCESSFUL_PR_CI=true"
            exit 0
          fi
          test "${{ needs.architecture.result }}" = "success"
          test "${{ needs.linux-rust.result }}" = "success"
          test "${{ needs.cloudflare-mcp.result }}" = "success"
          echo "REPOSITORY_GUARD_AND_LINUX=PASS"


  windows-agent:
    name: windows-native
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Clippy native Windows crates
        run: cargo clippy --locked -p okx-agent -p okx-host-control -p okx-host-launcher -p okx-execution --all-targets -- -D warnings

      - name: Test native Windows crates
        run: cargo test --locked -p okx-agent -p okx-host-control -p okx-host-launcher -p okx-execution

      - name: Install locked production workerd test dependencies on Windows
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mandatory native Windows T09/T10 recorded acceptance
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP "trade-integration"
          node scripts/run-trade-integration.mjs --suite t09,t10 --artifacts "$artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload T09/T10 acceptance evidence even on failure
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t09-t10-native-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\trade-integration
          if-no-files-found: warn
          retention-days: 14

      - name: K9 native two-heavy cancellation latency evidence
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent --lib two_heavy_research_jobs_ingestion_stop_and_cancel_latency -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          $line = [regex]::Match($log, 'ANALYTICS_PERF_JSON:(\{[^\r\n]+\})')
          if (-not $line.Success) { throw "K9_PERF_RECEIPT_MISSING" }
          $evidence = $line.Groups[1].Value | ConvertFrom-Json
          if ($evidence.two_heavy_stop.measurements -ne 30) { throw "K9_PERF_SAMPLE_COUNT_INVALID" }
          if ($evidence.two_heavy_stop.os -ne "windows") { throw "K9_PERF_NOT_WINDOWS" }
          $line.Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\k9-native-evidence.json" -Encoding utf8NoBOM

      - name: Upload K9 native latency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k9-native-two-heavy-${{ github.sha }}
          path: ${{ runner.temp }}\k9-native-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Build deployable Windows binaries
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse "HEAD^{tree}").Trim()
          cargo build --locked --release -p okx-agent -p okx-host-control -p okx-host-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dist = Join-Path $env:RUNNER_TEMP "okx-windows-bundle"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "target\release\okx-agent.exe" (Join-Path $dist "okx-agent.exe")
          Copy-Item "target\release\okx-host-control.exe" (Join-Path $dist "okx-host-control.exe")
          Copy-Item "target\release\okx-host-launcher.exe" (Join-Path $dist "okx-host-launcher.exe")
          Copy-Item "Cargo.lock" (Join-Path $dist "Cargo.lock")

          $sourceHead = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          $agentHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-agent.exe")).Hash.ToLowerInvariant()
          $controllerHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-host-control.exe")).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-host-launcher.exe")).Hash.ToLowerInvariant()
          $rustVersion = (rustc --version).Trim()

          $manifest = [ordered]@{
            schema = "okx.windows.bundle/v1"
            repository_id = 1388071566
            source_head_sha = $sourceHead
            source_tree = $sourceTree
            rust_version = $rustVersion
            files = [ordered]@{
              "okx-agent.exe" = [ordered]@{ sha256 = $agentHash }
              "okx-host-control.exe" = [ordered]@{ sha256 = $controllerHash }
              "okx-host-launcher.exe" = [ordered]@{ sha256 = $launcherHash }
            }
          }

          $manifest |
            ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $dist "manifest.json") -Encoding utf8NoBOM

      - name: Upload deployable Windows bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: okx-windows-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-windows-bundle
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  # Manually dispatched from the existing CI workflow on the selected PR
  # branch. No deployment, no exchange network and no relaxation of the
  # mandatory 26-case pull_request gate.
  windows-t09-preflight:
    name: windows-t09-b1-s2-targeted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/work/t10-07-one-campaign-native-20261105')
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Bind exact source SHA and restrict target scenario
        shell: pwsh
        env:
          OKX_TARGET_CASE: ${{ inputs.target_case || ((github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-09]') && 'T10-09') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-08]') && 'T10-08') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-05]') && 'T10-05') || (github.event_name == 'push' && 'T09.8')) || 'T09.6' }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "PREFLIGHT_HEAD_MISMATCH" }
          if ($env:OKX_TARGET_CASE -notin @('T09.1','T09.3','T09.4','T09.5','T09.6','T09.7','T09.8','B1','S2-05','T10-14','T10-03','T10-05','T10-06','T10-08','T10-09','T10-10','T10-11','T10-12','T10-15')) {
            throw "PREFLIGHT_CASE_NOT_ALLOWED"
          }
          Write-Host "PREFLIGHT_HEAD=$head"
          Write-Host "PREFLIGHT_CASE=$env:OKX_TARGET_CASE"
          Write-Host "PREFLIGHT_SCOPE=TARGETED_ONLY_NOT_26_CASE_ACCEPTANCE"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Prove ACK-bound immutable order source before Native acceptance
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent --lib immutable_acked_order_readback_is_bound_to_one_signed_post_and_query -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'ACK_BOUND_ORDER_SOURCE_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib immutable_acked_orders_keep_independent_sources_on_one_route -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'TWO_ORDER_SOURCE_SCOPE_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib recorded_terminal_algo_witness_requires_delivered_complete_account_scopes -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'TERMINAL_ALGO_DELIVERY_WITNESS_FAILED' }
          cargo test --locked -p okx-agent --lib executor_uid_cache_cannot_cross_account_or_outlive_signed_source -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'EXECUTOR_IDENTITY_UID_GENERATION_TTL_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib uid_waiting_is_bounded_and_other_account_progresses -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'EXECUTOR_UID_ASYNC_ADMISSION_FAILED' }
          cargo test --locked -p okx-agent --lib bounded_source_owner_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'FINANCE_SOURCE_OWNER_ASYNC_ADMISSION_FAILED' }
          cargo test --locked -p okx-agent --lib managed_census_stale_position_source_requires_fresh_event -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'MANAGED_CENSUS_EVENT_ORDER_REGRESSION' }
          cargo test --locked -p okx-agent --lib unresolved_peer_outcome_is_not_verified_protection_failure -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'MANAGED_CENSUS_PENDING_PEER_MUST_NOT_TRIGGER_EMERGENCY' }
          cargo test --locked -p okx-agent --lib e2_active_real_intents_have_complete_bounded_central_coverage -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'COHORT_PEER_POSTING_SQL_BOUNDARY_FAILED' }
          cargo test --locked -p okx-agent --lib t10_08_emergency_policy_is_bounded_before_financial_capture -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_PROTECTIVE_ACTION_MUST_PRECEDE_FINANCE' }
          cargo test --locked -p okx-agent --lib t10_08_emergency_close_requires_same_intent_signed_sql_lots -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_EMERGENCY_UNOWNED_REDUCE_MUST_NOT_POST' }
          cargo test --locked -p okx-agent --lib t10_08_later_live_stop_get_cannot_clear_durable_protection_incident -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_INCIDENT_RESTORATION_MUST_BE_PROVEN' }
          cargo test --locked -p okx-execution --lib t10_08_flat_protection_stop_resolution_is_atomic_and_idempotent -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_ATOMIC_SQL_AND_ORIGINAL_WORKER_RELEASE_REQUIRED' }
          cargo test --locked -p okx-agent --lib immutable_signed_leverage_handoff_preserves_exact_source_without_extra_pages -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'SIGNED_LEVERAGE_SOURCE_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib signed_fee_phase_advances_only_on_explicit_event_and_keeps_prior_source_time -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'SIGNED_FEE_CAUSAL_EVENT_UNIT_FAILED' }

      - name: Check Rust format before expensive Native/Worker scenarios
        run: cargo fmt --all -- --check

      - name: Install locked workerd test dependencies
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute one Native/Worker scenario or B1/S2-05 prerequisite
        if: (github.event_name == 'workflow_dispatch' && !inputs.run_a1) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[A1]'))
        shell: pwsh
        env:
          OKX_TARGET_CASE: ${{ inputs.target_case || ((github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-09]') && 'T10-09') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-08]') && 'T10-08') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-05]') && 'T10-05') || (github.event_name == 'push' && 'T09.8')) || 'T09.6' }}
        run: |
          if ($env:OKX_TARGET_CASE -notin @('T09.1','T09.3','T09.4','T09.5','T09.6','T09.7','T09.8','B1','S2-05','T10-14','T10-03','T10-05','T10-06','T10-08','T10-09','T10-10','T10-11','T10-12','T10-15')) {
            throw "PREFLIGHT_CASE_NOT_ALLOWED"
          }
          $artifacts = Join-Path $env:RUNNER_TEMP "trade-integration"
          if ($env:OKX_TARGET_CASE -eq 'B1') {
            $env:OKX_B1_SECOND_POSITIVE_PROBE = '1'
            node scripts/trade-integration/b1-native-cap.mjs --artifacts "$artifacts"
          } elseif ($env:OKX_TARGET_CASE -eq 'S2-05') {
            $env:OKX_S2_05_POLICY_CAS_PROBE = '1'
            node scripts/run-trade-integration.mjs --case T09.5 --artifacts "$artifacts"
          } else {
            node scripts/run-trade-integration.mjs --case $env:OKX_TARGET_CASE --artifacts "$artifacts"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Canonical #449 r9.3 A1 exact 21-case gate on one SHA
        if: (github.event_name == 'workflow_dispatch' && inputs.run_a1 && github.ref == 'refs/heads/work/t10-07-one-campaign-native-20261105') || (github.event_name == 'push' && github.ref == 'refs/heads/work/t10-07-one-campaign-native-20261105' && contains(github.event.head_commit.message, '[A1]'))
        shell: pwsh
        timeout-minutes: 28
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'GIT_HEAD_FAILED' }
          $raw = node scripts/run-trade-integration.mjs --list
          if ($LASTEXITCODE -ne 0) { throw 'MANIFEST_FAILED' }
          $manifest = ($raw -join "`n") | ConvertFrom-Json
          if ($manifest.spec_revision -ne '#449-r9') { throw 'SPEC_NOT_ADOPTED' }
          $required = @($manifest.required)
          if ($required.Count -ne 26 -or @($required | Sort-Object -Unique).Count -ne 26) {
              throw 'INVALID_26_MANIFEST'
          }
          $excluded = @('T10-08','T10-09','T10-10','T10-11','T10-12')
          $ids = @($required | Where-Object { $_ -notin $excluded })
          if ($ids.Count -ne 21) { throw 'INVALID_A1_SELECTION' }
          $runRoot = Join-Path $env:TEMP ('okx-a1-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runRoot | Out-Null
          $rows = @()
          foreach ($id in $ids) {
              $out = Join-Path $runRoot $id
              node scripts/run-trade-integration.mjs --case $id --artifacts $out
              $exitCode = $LASTEXITCODE
              $file = Join-Path $out 'summary.json'
              $ok = $false
              if (Test-Path -LiteralPath $file) {
                  $s = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
                  $ok = $exitCode -eq 0 -and $s.exact_commit -eq $sha -and
                      $s.spec_revision -eq $manifest.spec_revision -and
                      @($s.selected).Count -eq 1 -and $s.selected[0] -eq $id -and
                      @($s.outcomes).Count -eq 1 -and $s.outcomes[0].id -eq $id -and
                      $s.outcomes[0].status -eq 'PASS' -and $s.gate -eq 'PASS'
              }
              $rows += [pscustomobject]@{id=$id;pass=$ok;exit_code=$exitCode;sha=$sha;artifact=$out}
          }
          $rows | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $runRoot 'a1-results.json')
          Write-Output "A1_ARTIFACTS=$runRoot"
          # Preserve exact canonical summary and each case evidence on CI failure as well.
          $a1ArtifactRoot = Join-Path $env:RUNNER_TEMP 'trade-integration/a1'
          New-Item -ItemType Directory -Path $a1ArtifactRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $runRoot '*') -Destination $a1ArtifactRoot -Recurse -Force
          if (@($rows | Where-Object { -not $_.pass }).Count -gt 0) { throw 'A1_NOT_ACCEPTED' }
          Write-Output 'A1=21/21; CODE=BLOCKED_PENDING_OTHER_REQUIREMENTS'

      - name: Preserve targeted evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-targeted-${{ inputs.target_case || ((github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-09]') && 'T10-09') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-08]') && 'T10-08') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-05]') && 'T10-05') || (github.event_name == 'push' && 'T09.8')) || 'T09.6' }}-${{ github.sha }}
          path: ${{ runner.temp }}\trade-integration
          if-no-files-found: warn
          retention-days: 14

  # Opt-in autonomous Windows reproduction on the exact PR head.
  # Triggered by PR synchronize only while the temporary PR title has
  # [T09-REPRO]; intentionally does NOT substitute the mandatory ALL26 gate.
  windows-t09-autonomous:
    name: windows-t09-repro-${{ matrix.case_id }}
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[T09-REPRO]')
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        case_id: ['T09.3', 'T09.6', 'T09.7', 'T09.8']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Pin the immutable PR HEAD
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          CASE_ID: ${{ matrix.case_id }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "T09_REPRO_SOURCE_SHA_MISMATCH" }
          Write-Host "T09_REPRO_HEAD=$actual"
          Write-Host "T09_REPRO_CASE=$env:CASE_ID"
          Write-Host "T09_REPRO_SCOPE=THREE_TARGETED_REPETITIONS_NOT_ALL26"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # Compile the exact Rust test harness before the nested Workerd run:
      # its 115s/120s bootstrap deadlines measure runtime readiness, not a
      # cold cargo build. No production timeout or finance guard is changed.
      - name: Precompile Native SQL and Worker acceptance Rust harness
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw "T09_REPRO_NATIVE_PREBUILD_FAILED" }

      - name: Install pinned Workerd dependencies
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run three independent repetitions with separate evidence
        shell: pwsh
        env:
          CASE_ID: ${{ matrix.case_id }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/run-trade-integration.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "T09_REPRO_RUNNER_SELF_TEST_FAILED" }
          $base = Join-Path $env:RUNNER_TEMP "t09-repro"
          for ($repetition = 1; $repetition -le 3; $repetition++) {
            $dir = Join-Path $base "repeat-$repetition"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            "head=$env:EXPECTED_SHA case=$env:CASE_ID repeat=$repetition" |
              Set-Content -Path (Join-Path $dir "source.txt")
            Write-Host "T09_REPRO_BEGIN case=$env:CASE_ID repeat=$repetition"
            node scripts/run-trade-integration.mjs --case $env:CASE_ID --artifacts "$dir/evidence" 2>&1 |
              Tee-Object -FilePath (Join-Path $dir "console.log")
            $status = $LASTEXITCODE
            Write-Host "T09_REPRO_END case=$env:CASE_ID repeat=$repetition exit=$status"
            if ($status -ne 0) { throw "T09_REPRO_CASE_FAILED:$($env:CASE_ID):repeat-$repetition" }
          }

      - name: Preserve each repetition even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t09-repro-${{ matrix.case_id }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\\t09-repro
          if-no-files-found: warn
          retention-days: 14

# B1 uses its own Windows OS process/runner. Its source/SQL/workerd test
  # must not alter the workload or maintenance cadence of mandatory ALL26.
  # This is a PARTIAL Native prerequisite, not T09-MA/T10-07 acceptance.
  b1-native:
    name: windows-b1-native-prerequisite
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.build_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install locked production workerd test dependencies
        run: npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
      - name: Precompile actual Native/Worker child
        run: cargo test --locked -p okx-agent --lib native_to_workerd_risk_summary_over_actual_websocket --no-run
      - name: T10-14 isolated Native SQL owners prerequisite (not a required case PASS)
        shell: pwsh
        run: |
          cargo test --locked -p okx-execution --lib blocked_a_sql_owner_does_not_delay_b_cancel_receipt -- --nocapture |
            Tee-Object -FilePath "$env:RUNNER_TEMP\t10-14-native-sql.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\t10-14-native-sql.log"
          if ($evidence -notmatch 'T10_14_NATIVE_SQL_PREREQUISITE_V1:') {
            throw "T10_14_NATIVE_SQL_RECEIPT_MISSING"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: t10-14-sql-prerequisite-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\t10-14-native-sql.log
          if-no-files-found: warn
          retention-days: 7
      - name: B1 Native A/B independent order ACK and central shared-cap denial (partial only)
        env:
          OKX_B1_SECOND_POSITIVE_PROBE: "1"
        shell: pwsh
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP "b1-native"
          node scripts/trade-integration/b1-native-cap.mjs --artifacts "$artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-native-partial-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\b1-native
          if-no-files-found: warn
          retention-days: 7
      # Actual Worker governance CAS after a signed Native ACK; T09.5
      # verifies preserved original identity/hash/deadline and zero extra POST.
      - name: S2-05 live Native/Worker policy CAS and semantic replay
        shell: pwsh
        env:
          OKX_S2_05_POLICY_CAS_PROBE: "1"
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP "s2-05-policy-cas"
          node scripts/run-trade-integration.mjs --case T09.5 --artifacts "$artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s2-05-native-worker-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\s2-05-policy-cas
          if-no-files-found: warn
          retention-days: 14

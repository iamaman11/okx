name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prime_windows_cargo_cache:
        description: 'One-time trusted main Windows Cargo test/release cache seed (no acceptance or publish)'
        required: true
        type: boolean
        # Manual CI dispatch exists to seed the trusted main cache. The old
        # false default produced a green run with both prime jobs skipped.
        default: true

concurrency:
  # The release step is part of this main CI run. A later main commit must not
  # cancel an in-flight verified publication; stale commits are checked by SHA.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  research_package_proof:
    # Supplementary Draft proof for #537 T10. Does not compile or deploy an
    # Engine/Worker and never substitutes for mandatory Ready Native CI.
    name: research-package-proof
    if: github.event_name == 'pull_request' && github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'research-composition-evidence')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject mixed-origin substitution and unsupported names
        run: node scripts/test-compose-verified-research-v2.cjs
      - name: Compose two accepted GitHub artifacts for installed CONTROL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'okx-research-composition-v2'
          $proof = Join-Path $env:RUNNER_TEMP 'research-composition-proof.json'
          & ./scripts/prepare-research-release.ps1 `
            -AcceptedCompositionSpec 'docs/acceptance/537/t10-composition-spec.json' `
            -Dist $dist -ProofFile $proof
          if ($LASTEXITCODE -ne 0) { throw 'RESEARCH_COMPOSITION_FAILED' }
          $result = Get-Content -LiteralPath $proof -Raw | ConvertFrom-Json
          if ($result.control_candidate_rules -cne 'PASS_OFFLINE_NOT_ACTIVATED' -or
              $result.candidate_head -cne '${{ github.event.pull_request.head.sha }}' -or
              $result.candidate_tree -cne (git rev-parse 'HEAD^{tree}').Trim()) {
            throw 'CANDIDATE_PROOF_NOT_EXACT_TREE'
          }
      - name: Retain exact v2 candidate for later Ready/promotion review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okx-windows-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/okx-research-composition-v2
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
      - name: Retain composition identities and negative-test proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-composition-proof-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/research-composition-proof.json
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: dependency-audit
    needs: component_impact
    if: needs.component_impact.outputs.component_scope != '' && !contains(fromJSON('["docs","cloudflare"]'), needs.component_impact.outputs.component_scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
      - name: Verify pinned cargo-deny release and audit locked graph
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-deny-home
        run: |
          set -euo pipefail
          asset=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$asset"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          deny="$RUNNER_TEMP/cargo-deny/cargo-deny"
          "$deny" --version | tee "$RUNNER_TEMP/dependency-audit.log"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/dependency-graph.json"
          "$deny" fetch 2>&1 | tee -a "$RUNNER_TEMP/dependency-audit.log"
          mapfile -t dbs < <(find "$CARGO_HOME/advisory-dbs" -mindepth 1 -maxdepth 1 -type d)
          test "${#dbs[@]}" -eq 1
          git -C "${dbs[0]}" rev-parse HEAD | tee "$RUNNER_TEMP/advisory-db-commit.txt"
          python3 scripts/check_dependency_policy.py --self-test
          python3 scripts/check_dependency_policy.py --graph "$RUNNER_TEMP/dependency-graph.json" --advisory-db "${dbs[0]}" 2>&1 | tee -a "$RUNNER_TEMP/dependency-audit.log"
          # Offline check fixes the fetched DB revision and fails if it is missing
          # or stale; cargo metadata above populated the locked crate graph.
          "$deny" --locked --offline --color never check advisories licenses sources 2>&1 | tee -a "$RUNNER_TEMP/dependency-audit.log"
      - name: Report actual Cargo release consumers without changing CI selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node scripts/test-ci-main-routing.cjs
          node scripts/test-ci-component-impact.cjs
          node scripts/test-ci-cargo-closure-proof.cjs "$RUNNER_TEMP/dependency-graph.json"
          files=()
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            if gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/ci-impact-files.json"; then
              files=("$RUNNER_TEMP/ci-impact-files.json")
            else
              # A failed secondary diagnostic lookup cannot weaken or block
              # the already fail-closed authoritative component-impact job.
              echo 'Diagnostic diff unavailable; report full uncertain impact.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Reuse cargo metadata already produced by dependency-audit. No
          # additional Cargo build, check, test, metadata or Windows runner.
          node scripts/ci-component-impact.cjs "$RUNNER_TEMP/dependency-graph.json" "${files[@]}" > "$RUNNER_TEMP/ci-component-impact.json"
          node scripts/ci-component-impact.cjs "$RUNNER_TEMP/dependency-graph.json" "${files[@]}" --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Retain dependency policy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/dependency-audit.log
            ${{ runner.temp }}/advisory-db-commit.txt
            ${{ runner.temp }}/ci-component-impact.json
          if-no-files-found: error
          retention-days: 14

  component_impact:
    # This is the protected classifier itself; no redundant alias job.
    name: classify
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}
      reason: ${{ steps.classify.outputs.reason }}
      native_required: ${{ steps.classify.outputs.native_required }}
      native_proof: ${{ steps.classify.outputs.native_proof }}
      component_scope: ${{ steps.proven_scope.outputs.scope }}
      research_only: ${{ steps.classify.outputs.research_only }}
      edge_required: ${{ steps.classify.outputs.edge_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject unsafe component classifications
        if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
        run: python3 -B scripts/check_ci_native_scope.py --self-test
      - name: Classify complete changed-file impact
        id: file_scope
        if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scope=full
          candidate=none
          edge=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ "$FORCED_PUSH" != true ]]; then
            base="$BEFORE_SHA"
          else
            base=''
          fi
          # Compare the immutable event commits. The live PR file list may
          # belong to a newer head while GitHub is cancelling this run.
          if [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != "0000000000000000000000000000000000000000" &&
                "$CHECKED_HEAD" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$CHECKED_HEAD" ]] &&
             gh api "/repos/$GITHUB_REPOSITORY/compare/$base...$CHECKED_HEAD" > "$RUNNER_TEMP/ci-compare.json" &&
             jq -e --arg base "$base" --arg head "$CHECKED_HEAD" '
                 (.status == "ahead" or .status == "diverged") and .base_commit.sha == $base
                 and .ahead_by > 0 and .total_commits == .ahead_by and .total_commits < 250
                 and (.commits | length) == .total_commits and .commits[-1].sha == $head
                 and (.files | type == "array" and length > 0 and length < 300)
               ' "$RUNNER_TEMP/ci-compare.json" >/dev/null; then
            jq -c '[.files]' "$RUNNER_TEMP/ci-compare.json" > "$RUNNER_TEMP/ci-files.json"
            scope="$(python3 -B scripts/check_ci_native_scope.py < "$RUNNER_TEMP/ci-files.json")"
            edge="$(python3 -B scripts/check_ci_native_scope.py --edge-changed < "$RUNNER_TEMP/ci-files.json")"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              candidate="$(python3 -B scripts/check_ci_native_scope.py --dependency-candidate < "$RUNNER_TEMP/ci-files.json")"
            fi
          fi
          case "$scope" in docs|cloudflare|research|research-host|host-controller|host-launcher|full) ;; *) exit 1;; esac
          case "$candidate" in none|research|host-controller|host-launcher) ;; *) exit 1;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "manifest_candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "edge_changed=$edge" >> "$GITHUB_OUTPUT"
          echo "FILE_SCOPE=$scope; MANIFEST_CANDIDATE=$candidate"
      # Only a narrow manifest+optional lock candidate incurs an extra Cargo
      # resolver check. Every other Ready PR keeps its existing fast selector.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && steps.file_scope.outputs.manifest_candidate != 'none'
        with:
          toolchain: 1.100.0
      - name: Prove Windows Cargo closure before narrowing manifest changes
        id: cargo_closure
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && steps.file_scope.outputs.manifest_candidate != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE: ${{ steps.file_scope.outputs.manifest_candidate }}
        run: |
          set -euo pipefail
          # Failure is a conservative full matrix, never a skipped finance gate.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ||
                "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo 'CARGO_PROOF=HEAD_OR_BASE_UNVERIFIED; fallback=full'
            exit 0
          fi
          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" 2>/dev/null)" || exit 0
          if ! jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" \
              '.head.sha == $head and .base.sha == $base and .base.ref == "main"' <<<"$pr" >/dev/null; then
            echo 'CARGO_PROOF=PR_MOVED; fallback=full'
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo 'CARGO_PROOF=BASE_UNAVAILABLE; fallback=full'
            exit 0
          fi
          temp="$(mktemp -d "$RUNNER_TEMP/ci-cargo-base.XXXXXX")"
          base="$temp/base"
          trap 'git worktree remove "$base" 2>/dev/null || true; rmdir "$temp" 2>/dev/null || true' EXIT
          if ! git worktree add --detach "$base" "$BASE_SHA"; then
            echo 'CARGO_PROOF=BASE_WORKTREE_UNAVAILABLE; fallback=full'
            exit 0
          fi
          if ! cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc > "$temp/head.json" ||
             ! (cd "$base" && cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc) > "$temp/base.json"; then
            echo 'CARGO_PROOF=WINDOWS_RESOLVER_FAILED; fallback=full'
            exit 0
          fi
          if node scripts/ci-cargo-closure-proof.cjs "$temp/base.json" "$temp/head.json" \
              "$RUNNER_TEMP/ci-files.json" "$CANDIDATE" > "$RUNNER_TEMP/ci-windows-closure-proof.json"; then
            echo "scope=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "CARGO_PROOF=IDENTICAL_PROTECTED_WINDOWS_CLOSURE; scope=$CANDIDATE"
          else
            echo 'CARGO_PROOF=CHANGED_OR_UNVERIFIED; fallback=full'
          fi
      - name: Select only proven component scope
        id: proven_scope
        if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
        shell: bash
        run: |
          set -euo pipefail
          scope='${{ steps.file_scope.outputs.scope }}'
          if [[ -n '${{ steps.cargo_closure.outputs.scope }}' ]]; then
            test "$scope" = full
            scope='${{ steps.cargo_closure.outputs.scope }}'
          fi
          case "$scope" in docs|cloudflare|research|research-host|host-controller|host-launcher|full) ;; *) exit 1;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "COMPONENT_SCOPE=$scope"
      - name: Decide whether compilation is required
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # In-progress Draft edits must not launch repeated Windows releases.
          # A Ready-for-review event retains the original full CI contract.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "native_required=false" >> "$GITHUB_OUTPUT"
            echo "reason=draft PR; defer release build until ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scope="${{ steps.proven_scope.outputs.scope }}"
          case "$scope" in
            docs) edge_required=false ;;
            research-host|host-controller|host-launcher) edge_required="${{ steps.file_scope.outputs.edge_changed }}" ;;
            *) edge_required=true ;;
          esac
          echo "edge_required=$edge_required" >> "$GITHUB_OUTPUT"
          # Docs and Edge never need a lookup of accepted Native runs.
          if [[ "$scope" == "docs" || "$scope" == "cloudflare" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "native_required=false" >> "$GITHUB_OUTPUT"
            echo "native_proof=COMPONENT_SCOPED_UNCHANGED_NATIVE" >> "$GITHUB_OUTPUT"
            echo "reason=$scope-only; Native source unaffected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # On main, reuse only a successful Ready run with the exact tree.
            prs_json="$(gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"

            head_sha="$(jq -r '
              [.[] | select(.merged_at != null and .base.ref == "main")]
              | first
              | .head.sha // empty
            ' <<<"$prs_json")"

            # A successful Draft run can share this SHA. Only a completed Ready
            # run has successful Linux and Windows aggregate jobs in the same attempt.
            successful_pr_ci=0
            if [[ -n "$head_sha" ]]; then
              candidates="$(gh api --paginate --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" \
                -f head_sha="$head_sha" -f event=pull_request -f status=completed -f per_page=100 \
                --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | [.id, .run_attempt] | @tsv')"
              while read -r run attempt; do
                [[ -n "$run" ]] || continue
                jobs="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$attempt/jobs?per_page=100")"
                if jq -e '[.[].jobs[] | select(.conclusion == "success") | .name] | index("linux-core") != null and index("windows-native") != null' <<<"$jobs" >/dev/null; then
                  successful_pr_ci=1
                  break
                fi
              done <<<"$candidates"
              merge_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha')"
              head_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq '.tree.sha')"
            fi

            if [[ "$successful_pr_ci" -gt 0 && "$merge_tree" == "$head_tree" ]]; then
              echo "build_required=false" >> "$GITHUB_OUTPUT"
              echo "native_required=false" >> "$GITHUB_OUTPUT"
              echo "reason=merged tree exactly matches successful PR head tree" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "build_required=true" >> "$GITHUB_OUTPUT"
          case "$scope" in
            research)
              echo "research_only=true" >> "$GITHUB_OUTPUT"
              echo "native_required=false" >> "$GITHUB_OUTPUT"
              echo "native_proof=RESEARCH_OWNER_ONLY" >> "$GITHUB_OUTPUT"
              echo "reason=Research owner; release job must verify the accepted Native base" >> "$GITHUB_OUTPUT"
              ;;
            research-host)
              echo "native_required=false" >> "$GITHUB_OUTPUT"
              echo "native_proof=RESEARCH_HOST_OWNER_CHECKS" >> "$GITHUB_OUTPUT"
              echo "reason=Research and Host sources; release job must prove unchanged Engine inputs" >> "$GITHUB_OUTPUT"
              ;;
            host-controller|host-launcher)
              echo "native_required=false" >> "$GITHUB_OUTPUT"
              echo "native_proof=HOST_WINDOWS_OWNER_AND_CONSUMER" >> "$GITHUB_OUTPUT"
              echo "reason=$scope Rust source only; run Windows host/consumer checks" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "native_required=true" >> "$GITHUB_OUTPUT"
              echo "native_proof=NONE" >> "$GITHUB_OUTPUT"
              echo "reason=Engine, shared build inputs or unverified scope" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Classification
        run: |
          echo "BUILD_REQUIRED=${{ steps.classify.outputs.build_required }}"
          echo "REASON=${{ steps.classify.outputs.reason }}"

  draft-component-tests:
    name: draft-component-tests
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete PR diff
        id: scope
        run: |
          python3 -B scripts/check_ci_native_scope.py --self-test
          python3 -B scripts/test_check_p0.py
          node scripts/test-ci-main-routing.cjs
          node scripts/test-ci-component-impact.cjs
          python3 scripts/check_p0.py --base "$BASE_SHA" --plan
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.100.0
          components: rustfmt
      - name: Verify Rust formatting before compilation
        if: steps.scope.outputs.code == 'true'
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.scope.outputs.code == 'true'
        id: cache
        with:
          shared-key: draft-component-tests
          cache-workspace-crates: true
      - name: Run selected owner and consumer checks
        if: steps.scope.outputs.code == 'true'
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "Cargo cache exact hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_p0.py --base "$BASE_SHA"

  architecture_contracts:
    name: architecture-contracts
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && !contains(fromJSON('["docs","cloudflare"]'), needs.component_impact.outputs.component_scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Draft feedback selector and missing-test controls
        run: python3 -B scripts/test_check_p0.py

      - name: Reject unsafe component CI shortcuts
        run: |
          python3 -B scripts/check_ci_native_scope.py --self-test
          node scripts/test-research-release-scope.cjs
          node scripts/test-compose-verified-research-v2.cjs

      - name: Parse permanent Native-base release verifier
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('scripts/prepare-research-release.ps1', 'scripts/prepare-verified-research-bundle.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "RESEARCH_COMPOSITION_POWERSHELL_PARSE_FAILED: $file $($errors -join '; ')" }
          }

      - name: Architecture checker self-test
        run: python3 scripts/check_architecture.py --self-test

      - name: Enforce accepted local-crate dependency graph
        run: python3 scripts/check_architecture.py

      - name: Verify versioned SQLite account ledger schema
        run: python3 scripts/check_ledger_sql.py

      - name: Verify exact T09/T10 required-case manifest
        run: node scripts/run-trade-integration.mjs --list

      - name: Reject incomplete or fabricated T09/T10 runner evidence
        run: node scripts/run-trade-integration.mjs --self-test

      - name: Preserve bounded primary and secondary Native failures
        run: node --test scripts/trade-integration/native-failure.test.mjs

      - name: Verify clean Engine product contract
        run: |
          python3 scripts/check_product_contract.py --self-test
          python3 scripts/check_product_contract.py

      - name: Verify fail-closed capability acceptance
        run: python3 scripts/acceptance_product.py --self-test

      - name: Check Research handoff receipt verification
        run: python3 -B scripts/test_check_research_handoff.py


  rust_tests_linux:
    name: rust-tests-linux
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.native_required == 'true' && needs.component_impact.outputs.research_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy portable crates
        run: cargo clippy --locked --workspace --exclude okx-trading-engine --exclude okx-host-controller --all-targets -- -D warnings

      - name: Test portable crates
        # Research has its own complete run below, including real IPC children.
        run: cargo test --locked --workspace --exclude okx-trading-engine --exclude okx-host-controller --exclude okx-research-service

      - name: Research worker process and Agent dispatch contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p okx-research-service --bin okx-research-service
          export OKX_RESEARCH_SERVICE_TEST_EXE="$PWD/target/debug/okx-research-service"
          cargo test --locked -p okx-research-service --lib -- --test-threads 2 | tee "$RUNNER_TEMP/research-worker-unit.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/research-worker-unit.log"
          cargo test --locked -p okx-research-service --test ipc_process -- --nocapture | tee "$RUNNER_TEMP/research-worker-ipc.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/research-worker-ipc.log"
          cargo test --locked -p okx-research-service --doc
          cargo test --locked -p okx-trading-engine --lib research_dispatch_tests:: -- --test-threads 2 | tee "$RUNNER_TEMP/research-dispatch.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/research-dispatch.log"

      - name: Accept one million native SQLite terminal intents
        timeout-minutes: 30
        run: cargo test --locked -p okx-trade-execution --lib sqlite_million_history_bounded_rss -- --ignored --nocapture

      - name: Measure two-account 100-parallel native SQL (not WSS)
        run: cargo test --locked -p okx-trade-execution --lib two_account_100_parallel_sql_readonly_isolation -- --nocapture

      # #510: finances now commit inside the Native SQLite owner. Old Worker
      # monetary CAS traces are retired; they cannot witness the current owner.
      - name: Native policy and original financial invariants
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p okx-trade-execution --lib risk_book_contract_native_campaign_policy_ -- --nocapture | tee "$RUNNER_TEMP/native-policy.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/native-policy.log"
          cargo test --locked -p okx-trade-execution --lib e1_e2_native_real_fee_sources_baseline_and_second_admission_under_ten -- --nocapture

  cloudflare_mcp_contracts:
    name: cloudflare-mcp-contracts
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.edge_required == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/okx-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          cache: npm
          cache-dependency-path: cloudflare/okx-mcp/package-lock.json
      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Install locked package surface
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run check
      - name: Accept authenticated RuntimeSession transport without financial authority
        run: node scripts/test-native-finance-retirement-do.mjs

      # The previous Worker shared-cap owner no longer exists. The original
      # scoped Rust shared-budget invariants run in the execution job. Full
      # Native T10-07 acceptance remains part of the mandatory matrix (#512).
      - name: Reject drift in generated MCP public contracts
        working-directory: cloudflare/okx-mcp
        run: git diff --exit-code -- contracts/tools.schema.json contracts/action-fixtures.json



  required_linux:
    # Legacy required-check name is kept until branch protection is migrated.
    name: linux-core
    needs: [component_impact, architecture_contracts, rust_tests_linux, cloudflare_mcp_contracts, research_service_tests_windows]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required Linux, architecture and Cloudflare gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.component_impact.result }}" = "success"
          if [[ "${{ needs.component_impact.outputs.build_required }}" == "false" ]]; then
            echo "REUSED_SUCCESSFUL_PR_CI=true"
            exit 0
          fi
          case "${{ needs.component_impact.outputs.component_scope }}" in
            docs|cloudflare) test "${{ needs.architecture_contracts.result }}" = "skipped" ;;
            *) test "${{ needs.architecture_contracts.result }}" = "success" ;;
          esac
          if [[ "${{ needs.component_impact.outputs.research_only }}" == "true" || "${{ needs.component_impact.outputs.component_scope }}" == "research-host" ]]; then
            test "${{ needs.rust_tests_linux.result }}" = "skipped"
            test "${{ needs.research_service_tests_windows.result }}" = "success"
            echo "LINUX_FINANCE_REUSED_BASE=${{ needs.research_service_tests_windows.outputs.base_head }}"
          elif [[ "${{ needs.component_impact.outputs.component_scope }}" == "host-controller" || "${{ needs.component_impact.outputs.component_scope }}" == "host-launcher" ]]; then
            test "${{ needs.rust_tests_linux.result }}" = "skipped"
            test "${{ needs.component_impact.outputs.native_proof }}" = "HOST_WINDOWS_OWNER_AND_CONSUMER"
            echo "LINUX_FINANCE_UNCHANGED_HOST_SOURCE_ONLY=true"
          elif [[ "${{ needs.component_impact.outputs.native_required }}" == "false" ]]; then
            test "${{ needs.rust_tests_linux.result }}" = "skipped"
            test "${{ needs.component_impact.outputs.native_proof }}" = "COMPONENT_SCOPED_UNCHANGED_NATIVE"
            echo "LINUX_FINANCE_UNCHANGED_NATIVE_SOURCE=true"
          else
            test "${{ needs.rust_tests_linux.result }}" = "success"
          fi
          if [[ "${{ needs.component_impact.outputs.edge_required }}" == "true" ]]; then
            test "${{ needs.cloudflare_mcp_contracts.result }}" = "success"
          else
            test "${{ needs.cloudflare_mcp_contracts.result }}" = "skipped"
          fi
          echo "REPOSITORY_GUARD_AND_LINUX=PASS"


  host_controller_launcher_checks:
    # Source-only lifecycle changes never compile a new trading Engine or SQL
    # owner. Every host change tests CONTROL and Launcher together because
    # CONTROL is a real consumer of the Launcher crate. This is NOT a complete
    # four-EXE release; publishing a new Native base still requires full CI.
    name: host-controller-launcher-checks
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && (needs.component_impact.outputs.component_scope == 'host-controller' || needs.component_impact.outputs.component_scope == 'host-launcher' || needs.component_impact.outputs.component_scope == 'research-host')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Verify architecture and formatting
        shell: pwsh
        run: |
          python3 scripts/check_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows installation root and lifecycle contracts
        shell: pwsh
        run: ./scripts/test-windows-unify-root.ps1
      - name: Clippy and test Host protocol, CONTROL, Launcher and MCP bridge consumer
        shell: pwsh
        run: |
          cargo clippy --locked -p okx-host-protocol -p okx-host-launcher -p okx-host-controller -p okx-bridge-mcp --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p okx-host-protocol -p okx-host-launcher -p okx-host-controller -p okx-bridge-mcp -- --test-threads 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build both Windows host executables without Engine
        shell: pwsh
        run: |
          cargo build --locked --release -p okx-host-launcher -p okx-host-controller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $proof = @("scope=${{ needs.component_impact.outputs.component_scope }}", "head=$head", "tree=$tree", 'release_is_complete=false')
          foreach ($name in @('okx-host-launcher.exe', 'okx-host-control.exe')) {
            $path = Join-Path 'target/release' $name
            if (!(Test-Path -LiteralPath $path)) { throw "MISSING_HOST_BINARY_$name" }
            $proof += "$name=$((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant())"
          }
          $proof | Set-Content -LiteralPath "$env:RUNNER_TEMP/host-component-proof.txt" -Encoding utf8NoBOM
      - name: Retain host-only build identities (not a deployable bundle)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-component-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/host-component-proof.txt
          if-no-files-found: error
          retention-days: 14

      - name: Retain fresh Host binaries for mixed owner evidence
        if: needs.component_impact.outputs.component_scope == 'research-host'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixed-host-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/okx-host-control.exe
            target/release/okx-host-launcher.exe
            ${{ runner.temp }}/host-component-proof.txt
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

  trading_engine_acceptance_windows:
    name: trading-engine-acceptance-windows
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.native_required != 'false' && needs.component_impact.outputs.research_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: finance-test-cache
        with:
          cache-on-failure: true
          # New immutable generation: include the compiled workspace crates
          # built by the trusted main test-cache seed.
          prefix-key: v1-rust
          shared-key: trading-engine-tests-windows
          cache-workspace-crates: true
          save-if: false

      - name: Windows installation root migration contracts
        shell: pwsh
        run: ./scripts/test-windows-unify-root.ps1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/okx-mcp/.node-version
          cache: npm
          cache-dependency-path: cloudflare/okx-mcp/package-lock.json
      - name: Install locked production workerd test dependencies on Windows
        # The isolated MCP/DO/WSS finance witness runs on both PR and main.
        # Its Node fixture imports esbuild, so the locked npm tree is required
        # for the post-merge push gate as well as the PR release matrix.
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The JavaScript Native/Worker finance scenario driver is retired with
      # its separate financial owner. Its driver-only PID/cleanup tests do not
      # establish the shipped Engine lifecycle. Current Rust process, SQLite,
      # Engine drain and real workerd transport witnesses run in the gate below;
      # CONTROL/Launcher tests above and #449 physical acceptance remain.
      - name: Current Rust collector negative controls
        shell: pwsh
        run: |
          cargo test --locked -p okx-trading-engine --example native_finance_acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mandatory current Rust financial property acceptance
        id: native-properties
        shell: pwsh
        run: |
          # The old Native/Worker finance driver is retired. Its properties
          # remain in the reviewed current Rust map; missing evidence BLOCKS
          # this full gate rather than falling back to historical26 results.
          cargo run --locked -p okx-trading-engine --example native_finance_acceptance > "$env:RUNNER_TEMP\native-finance-full.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exactly the roster excluded by the parallel regression step.
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          node scripts/ci-finance-witness-manifest.cjs --verify-report "$env:RUNNER_TEMP\native-finance-full.json" $head $tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize financial build and test time
        if: always() && steps.native-properties.outcome != 'skipped'
        shell: pwsh
        run: |
          "Windows financial Cargo cache exact hit: ${{ steps.finance-test-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          $path = Join-Path $env:RUNNER_TEMP 'native-finance-full.json'
          if (Test-Path -LiteralPath $path) {
            try { $report = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json } catch {
              'Financial timing report unavailable' >> $env:GITHUB_STEP_SUMMARY
              return
            }
            "Financial test binaries: $($report.build_ms) ms" >> $env:GITHUB_STEP_SUMMARY
            "Financial setup through teardown: $($report.runtime_setup_to_teardown_ms) ms" >> $env:GITHUB_STEP_SUMMARY
            foreach ($group in $report.stages | Where-Object { $_.stage -eq 'libtest' }) {
              "- $($group.package) / $($group.group): $($group.wall_ms) ms" >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Upload current Rust property evidence even on failure
        if: always() && steps.native-properties.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-finance-full-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\native-finance-full.json
          if-no-files-found: error
          retention-days: 14

      - name: Build research worker for isolated process contracts
        shell: pwsh
        run: |
          cargo build --locked -p okx-research-service --bin okx-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Isolated Native pending-fill crash recovery
        shell: pwsh
        run: |
          cargo test --locked -p okx-trading-engine --lib accounts::native_trade_contracts::native_crash::risk_book_contract_native_os_kill_pending_fill_projects_once -- --exact --test-threads 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The seven real SQL-owner cleanup transitions have bounded deadlines.
      # Run them separately so unrelated fixtures cannot age campaign-opening
      # or worker-termination observations during signed readback checks.
      - name: Isolated native protection cleanup SQL regressions
        shell: pwsh
        run: |
          $output = & cargo test --locked -p okx-trading-engine --lib trade_service::protection_cleanup::protection_cleanup_direct_tests:: -- --nocapture --test-threads 2 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 7 passed; 0 failed;') { throw 'PROTECTION_CLEANUP_EXACT_SEVEN_TESTS_MISSING' }

      # Keep the process tree exclusive to this one heavy test so resource
      # observations cannot include unrelated financial regression fixtures.
      - name: Engine autonomy under heavy research process tree
        id: engine-autonomy
        shell: pwsh
        run: |
          $env:OKX_RESEARCH_SERVICE_TEST_EXE = (Resolve-Path 'target/debug/okx-research-service.exe').Path
          $output = & cargo test --locked -p okx-trading-engine --lib accounts::native_trade_contracts::native_engine_research::engine_maintenance_and_stop_remain_independent_of_heavy_research_and_disconnect -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\b-process-tree.log" | Out-Host
          if ($code -ne 0) { exit $code }
          $log = $output -join "`n"
          if ($log -notmatch 'test result: ok\. 1 passed;') { throw 'ENGINE_RESEARCH_EXACT_TEST_MISSING' }
          $matches = [regex]::Matches($log, 'RESEARCH_PROCESS_TREE=(\{[^\r\n]+\})')
          if ($matches.Count -ne 1) { throw 'PROCESS_TREE_RECEIPT_MISSING_OR_DUPLICATED' }
          $receipt = $matches[0].Groups[1].Value | ConvertFrom-Json
          if ($receipt.status -cne 'MEASURED') { throw 'PROCESS_TREE_NOT_MEASURED' }
          $matches[0].Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\b-process-tree.json" -Encoding utf8NoBOM

      - name: Upload Engine research process-tree observation
        if: always() && steps.engine-autonomy.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-research-process-tree-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}\b-process-tree.log
            ${{ runner.temp }}\b-process-tree.json
          if-no-files-found: error
          retention-days: 14

      # CONTROL supplies this incarnation in production. The loopback fixture
      # needs a synthetic valid value; no production transport or identity is
      # involved. Run alone so its process-tree and finance p95 are meaningful.
      - name: MCP DO WSS Native finance under isolated Research load
        id: mcp-native-load
        shell: pwsh
        env:
          OKX_CONTROL_AGENT_INCAR: ctl_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          $env:OKX_RESEARCH_SERVICE_TEST_EXE = (Resolve-Path 'target/debug/okx-research-service.exe').Path
          $output = & cargo test --locked -p okx-trading-engine --lib accounts::native_trade_contracts::native_engine_research::mcp_http_durable_object_wss_native_finance_stays_readable_under_heavy_research -- --exact --nocapture --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\mcp-native-load.log" | Out-Host
          if ($code -ne 0) { exit $code }
          $log = $output -join "`n"
          if ($log -notmatch 'test result: ok\. 1 passed;') { throw 'MCP_NATIVE_LOAD_EXACT_TEST_MISSING' }
          $receipts = [regex]::Matches($log, 'T10_MCP_NATIVE_LOAD_JSON:(\{[^\r\n]+\})')
          if ($receipts.Count -ne 1) { throw 'MCP_NATIVE_LOAD_RECEIPT_MISSING_OR_DUPLICATED' }
          $receipt = $receipts[0].Groups[1].Value | ConvertFrom-Json
          if ($receipt.schema -cne 'okx.518.t10-mcp-do-wss-native-finance/v1' -or
              $receipt.mcp_transport -cne 'real_loopback_http_miniflare_sqlite_do_websocket_native' -or
              $receipt.exchange_trade_post -ne $false) { throw 'MCP_NATIVE_LOAD_RECEIPT_INVALID' }
          $receipts[0].Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\mcp-native-load.json" -Encoding utf8NoBOM

      - name: Upload isolated MCP DO WSS Native load observation
        if: always() && steps.mcp-native-load.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-native-load-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}\mcp-native-load.log
            ${{ runner.temp }}\mcp-native-load.json
          if-no-files-found: error
          retention-days: 14

  trading_engine_regressions_windows:
    # Non-clock-sensitive regression coverage can compile and run independently
    # of the one uninterrupted financial property acceptance on another runner.
    # It does not issue a financial PASS: windows-native joins both exact-tree
    # jobs and the full Windows release build before publication.
    name: trading-engine-regressions-windows
    needs: component_impact
    if: needs.component_impact.outputs.build_required == 'true' && needs.component_impact.outputs.native_required != 'false' && needs.component_impact.outputs.research_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Both runners restore the same trusted-main debug/test profile.
          # Their target directories are physically isolated by runner.
          cache-on-failure: true
          prefix-key: v1-rust
          shared-key: trading-engine-tests-windows
          cache-workspace-crates: true
          save-if: false

      - name: Clippy native Windows crates
        shell: pwsh
        run: |
          cargo clippy --locked -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-trade-execution --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Strategy Core and Research owner regressions on full Windows
        shell: pwsh
        run: |
          # Full Native remains responsible for Agent/IPC migration consumers.
          cargo test --locked -p okx-strategy-core -p okx-research
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build research worker for regression process contracts
        shell: pwsh
        run: |
          cargo build --locked -p okx-research-service --bin okx-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native trading, SQL, CONTROL and Launcher remaining regression
        shell: pwsh
        run: |
          $env:OKX_RESEARCH_SERVICE_TEST_EXE = (Resolve-Path 'target/debug/okx-research-service.exe').Path
          # Compile no extra Engine example just to discover the reviewed
          # Rust witness set (~79s in measured Ready). The source parser
          # accepts only explicit immutable Witness + CONTRACTS syntax.
          # Parallel acceptance independently proves FULL_PASS and compares
          # this set to every current-tree executed witness; any difference
          # keeps the protected windows-native gate RED.
          $manifestJson = & node scripts/ci-finance-witness-manifest.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $covered = @(($manifestJson | ConvertFrom-Json).witnesses)
          foreach ($package in @('okx-trading-engine','okx-host-controller','okx-host-launcher','okx-trade-execution')) {
            $testArgs = @('--skip','research_dispatch_tests::','--skip','accounts::native_trade_contracts::native_engine_research::engine_maintenance_and_stop_remain_independent_of_heavy_research_and_disconnect','--skip','accounts::native_trade_contracts::native_engine_research::mcp_http_durable_object_wss_native_finance_stays_readable_under_heavy_research','--skip','trade_service::protection_cleanup::protection_cleanup_direct_tests::','--test-threads','2')
            # OS-kill is checked exclusively in the finance/isolated job.
            if ($package -eq 'okx-trading-engine') {
              $testArgs += @('--skip','accounts::native_trade_contracts::native_crash::risk_book_contract_native_os_kill_pending_fill_projects_once')
              # Six Native account/catalog fixtures verify the actual writer
              # termination and SQLite lease within 3s. Do not race their
              # clocks against hundreds of independent Engine fixtures.
              $testArgs += @('--skip','accounts::native_connect_contracts::')
              # These two real-clock source-frontier tests must not race each
              # other for 2s market / 5s account freshness on a loaded runner.
              # They are mandatory in the explicitly counted serial step below.
              $testArgs += @('--skip','trade_service::terminal_release::tests::stale_fill_coverage_blocks_release_before_worker')
              $testArgs += @('--skip','trade_service::terminal_release::tests::stale_bill_coverage_blocks_settlement_after_inspect')
            }
            foreach ($witness in @($covered | Where-Object package -eq $package)) { $testArgs += @('--skip',$witness.test) }
            Write-Host "Remaining regression: $package; financial witnesses routed to full collector: $(@($covered | Where-Object package -eq $package).Count)"
            cargo test --locked -p $package -- @testArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Serial native account catalog and writer-termination regressions
        shell: pwsh
        run: |
          # Keep the original 3s SQLite writer release deadlines and all six
          # real file-lock/recovery tests; only the test-harness scheduling
          # changes. A missing test cannot be counted as passed.
          $output = & cargo test --locked -p okx-trading-engine --lib accounts::native_connect_contracts:: -- --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 6 passed; 0 failed;') {
            throw 'NATIVE_ACCOUNT_CATALOG_ALL_SIX_TESTS_REQUIRED'
          }

      - name: Serial terminal release source-frontier regression
        shell: pwsh
        run: |
          # Still execute BOTH original real-clock tests on this exact tree.
          # Their initial market and private-account sources must remain FRESH;
          # no production timeouts, assertions or recorded bytes are changed.
          $output = & cargo test --locked -p okx-trading-engine --lib trade_service::terminal_release::tests::stale_ -- --test-threads 1 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. 2 passed; 0 failed;') {
            throw 'BOTH_TERMINAL_SOURCE_FRONTIER_WITNESSES_REQUIRED'
          }

      # K9 runs once on its own runner, not beside isolated OS/SQL clocks.
      - name: Worker library regression and actual IPC child
        shell: pwsh
        run: |
          $output = & cargo test --locked -p okx-research-service --lib -- --skip analytics::cpu_executor::heavy_fixtures::two_heavy_research_jobs_ingestion_stop_and_cancel_latency --test-threads 2 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. [1-9][0-9]* passed;') { throw 'WORKER_ANALYTICS_TESTS_MISSING' }
          $output = & cargo test --locked -p okx-research-service --test ipc_process -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. [1-9][0-9]* passed;') { throw 'WORKER_IPC_TESTS_MISSING' }

      - name: Agent dispatch to actual research child
        shell: pwsh
        run: |
          $env:OKX_RESEARCH_SERVICE_TEST_EXE = (Resolve-Path 'target/debug/okx-research-service.exe').Path
          $output = & cargo test --locked -p okx-trading-engine --lib research_dispatch_tests:: -- --test-threads 2 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\. [1-9][0-9]* passed;') { throw 'AGENT_RESEARCH_DISPATCH_TESTS_MISSING' }

      # Worker-local CPU/cancellation benchmark, not physical Engine autonomy.
      - name: K9 worker two-heavy cancellation latency evidence
        shell: pwsh
        run: |
          cargo test --locked -p okx-research-service --lib two_heavy_research_jobs_ingestion_stop_and_cancel_latency -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          if ($log -notmatch 'test result: ok\. [1-9][0-9]* passed;') { throw 'K9_WORKER_TEST_MISSING' }
          $line = [regex]::Match($log, 'ANALYTICS_PERF_JSON:(\{[^\r\n]+\})')
          if (-not $line.Success) { throw "K9_PERF_RECEIPT_MISSING" }
          $evidence = $line.Groups[1].Value | ConvertFrom-Json
          if ($evidence.two_heavy_stop.measurements -ne 30) { throw "K9_PERF_SAMPLE_COUNT_INVALID" }
          if ($evidence.two_heavy_stop.os -ne "windows") { throw "K9_PERF_NOT_WINDOWS" }
          $line.Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\k9-native-evidence.json" -Encoding utf8NoBOM

      - name: Upload K9 native latency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k9-native-two-heavy-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\k9-native-evidence.json
          if-no-files-found: error
          retention-days: 14

  research_service_tests_windows:
    name: research-service-tests-windows
    needs: component_impact
    # A successful, identical PR tree is already accepted; main must reuse it.
    if: needs.component_impact.outputs.build_required == 'true' && (needs.component_impact.outputs.research_only == 'true' || needs.component_impact.outputs.component_scope == 'research-host')
    runs-on: windows-latest
    outputs:
      base_head: ${{ steps.package.outputs.base_head }}
      mixed_base_head: ${{ steps.mixed_evidence.outputs.base_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: research-cache
        with:
          shared-key: research-service-windows
          cache-workspace-crates: true
      - name: Fresh Strategy Core, Research and Worker owner checks
        shell: pwsh
        run: |
          # One Cargo target root for tests and release, and the action cache.
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          "Research Cargo cache exact hit: ${{ steps.research-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          # This is the REQUIRED Ready gate for all three Research owners.
          # A failing primitive unit test must fail this job before packaging.
          cargo clippy --locked -p okx-strategy-core -p okx-research -p okx-research-service -p okx-analysis --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p okx-strategy-core -p okx-research -p okx-research-service -p okx-analysis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build deployable Windows binaries
        id: package
        if: needs.component_impact.outputs.research_only == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse "HEAD^{tree}").Trim()
          $env:OKX_BUILD_SOURCE_HEAD = (git rev-parse HEAD).Trim()
          $dist = Join-Path $env:RUNNER_TEMP "okx-windows-bundle"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $names = @('okx-agent.exe', 'okx-host-control.exe', 'okx-host-launcher.exe', 'okx-research-service.exe')
          $sourceHead = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          $components = [ordered]@{}
          & node scripts/test-research-release-scope.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/prepare-research-release.ps1 -Dist $dist
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          cargo build --locked --release -p okx-research-service --bin okx-research-service 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'research-only-build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $proof = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'research-release-proof.json') | ConvertFrom-Json
          if ($proof.current_head_sha -cne $sourceHead -or $proof.base_head_sha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'RESEARCH_BASE_PROOF_REQUIRED'
          }
          "base_head=$($proof.base_head_sha)" >> $env:GITHUB_OUTPUT
          foreach ($name in $names[0..2]) { $components[$name] = $proof.components.PSObject.Properties[$name].Value }
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'release\okx-research-service.exe') (Join-Path $dist 'okx-research-service.exe')
          $freshNames = @('okx-research-service.exe')
          foreach ($name in $freshNames) {
            $path = Join-Path $dist $name
            $components[$name] = [ordered]@{
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
              size = (Get-Item -LiteralPath $path).Length
              source_head_sha = $sourceHead
              source_tree = $sourceTree
              run_id = 0
              artifact_id = 0
              protocol_version = 1
              storage_version = 1
            }
          }
          Copy-Item 'Cargo.lock' (Join-Path $dist 'Cargo.lock')
          $manifest = [ordered]@{
            schema = 'okx.windows.bundle/v2'
            repository_id = 1388071566
            source_head_sha = $sourceHead
            source_tree = $sourceTree
            rust_version = (rustc --version).Trim()
            components = $components
          }
          $manifest | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $dist 'manifest.json') -Encoding utf8NoBOM

      - name: Upload isolated Research release evidence
        if: github.event_name == 'pull_request' && needs.component_impact.outputs.research_only == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-only-release-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}\research-release-proof.json
            ${{ runner.temp }}\research-only-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload deployable Windows bundle
        if: github.event_name == 'pull_request' && needs.component_impact.outputs.research_only == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okx-windows-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-windows-bundle
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

      - name: Verify accepted Engine and build fresh Research for mixed owner evidence
        id: mixed_evidence
        if: needs.component_impact.outputs.component_scope == 'research-host'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse 'HEAD^{tree}').Trim()
          $env:OKX_BUILD_SOURCE_HEAD = (git rev-parse HEAD).Trim()
          & ./scripts/prepare-research-release.ps1 -VerifyOnly -MixedHost
          $proof = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'research-release-proof.json') | ConvertFrom-Json
          if ($proof.current_head_sha -cne $env:OKX_BUILD_SOURCE_HEAD -or
              $proof.scope.scope -cne 'research-host' -or
              $proof.scope.engine_windows_cargo_closure_identical -ne $true -or
              $proof.base_head_sha -cnotmatch '^[0-9a-f]{40}$') { throw 'MIXED_ENGINE_PROOF_REQUIRED' }
          cargo build --locked --release -p okx-research-service --bin okx-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = 'target/release/okx-research-service.exe'
          [ordered]@{
            fresh_component = 'okx-research-service.exe'
            source_head_sha = $env:OKX_BUILD_SOURCE_HEAD
            source_tree = $env:OKX_BUILD_SOURCE_TREE
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
            reused_engine = $proof.components.'okx-agent.exe'
            release_is_complete = $false
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mixed-research-proof.json') -Encoding utf8NoBOM
          "base_head=$($proof.base_head_sha)" >> $env:GITHUB_OUTPUT

      - name: Retain fresh Research binary and verified Engine origin
        if: needs.component_impact.outputs.component_scope == 'research-host'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixed-research-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/okx-research-service.exe
            ${{ runner.temp }}/mixed-research-proof.json
            ${{ runner.temp }}/research-release-proof.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 14


  required_windows:
    # This exact name remains the protected main required check. It succeeds
    # on a real Windows gate or on the narrowly proven identical native tree;
    # it never reports a newly executed 26/26 on the reuse path.
    name: windows-native
    needs: [component_impact, trading_engine_acceptance_windows, trading_engine_regressions_windows, trading_engine_build_windows, host_controller_launcher_checks, cloudflare_mcp_contracts, research_service_tests_windows]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - name: Enforce native gate or exact accepted evidence reuse
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.component_impact.result }}" = "success"
          if [[ "${{ needs.component_impact.outputs.build_required }}" == "true" && "${{ needs.component_impact.outputs.edge_required }}" == "true" ]]; then
            test "${{ needs.cloudflare_mcp_contracts.result }}" = "success"
          else
            test "${{ needs.cloudflare_mcp_contracts.result }}" = "skipped"
          fi
          if [[ "${{ needs.component_impact.outputs.build_required }}" == "false" ]]; then
            test "${{ needs.trading_engine_acceptance_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_regressions_windows.result }}" = "skipped"
            # Manual trusted-main cache priming intentionally compiles release
            # outputs without running acceptance; normal main pushes do not.
            if [[ "${{ github.event_name }}" == "push" ]]; then
              test "${{ needs.trading_engine_build_windows.result }}" = "skipped"
            fi
            test "${{ needs.component_impact.outputs.reason }}" = "merged tree exactly matches successful PR head tree"
            echo "WINDOWS_NATIVE_PROOF=EXACT_SUCCESSFUL_MERGED_TREE"
          elif [[ "${{ needs.component_impact.outputs.research_only }}" == "true" ]]; then
            # Isolated compilation is always allowed. Ready acceptance is NOT:
            # without an independently verified prior Native base there is no
            # safe composite release and the protected check must stay red.
            test "${{ needs.component_impact.outputs.native_proof }}" = "RESEARCH_OWNER_ONLY"
            [[ "${{ needs.research_service_tests_windows.outputs.base_head }}" =~ ^[0-9a-f]{40}$ ]]
            test "${{ needs.trading_engine_acceptance_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_regressions_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_build_windows.result }}" = "skipped"
            test "${{ needs.research_service_tests_windows.result }}" = "success"
            echo "WINDOWS_NATIVE_PROOF=REUSED_ACCEPTED_BASE_${{ needs.research_service_tests_windows.outputs.base_head }}"
            echo "WINDOWS_NATIVE_EXECUTED_IN_THIS_RUN=false"
          elif [[ "${{ needs.component_impact.outputs.component_scope }}" == "research-host" ]]; then
            test "${{ needs.component_impact.outputs.native_proof }}" = "RESEARCH_HOST_OWNER_CHECKS"
            [[ "${{ needs.research_service_tests_windows.outputs.mixed_base_head }}" =~ ^[0-9a-f]{40}$ ]]
            test "${{ needs.trading_engine_acceptance_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_regressions_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_build_windows.result }}" = "skipped"
            test "${{ needs.host_controller_launcher_checks.result }}" = "success"
            test "${{ needs.research_service_tests_windows.result }}" = "success"
            echo "WINDOWS_NATIVE_PROOF=MIXED_OWNER_CHECKS_WITH_VERIFIED_ENGINE"
            echo "WINDOWS_NATIVE_EXECUTED_IN_THIS_RUN=false"
          elif [[ "${{ needs.component_impact.outputs.component_scope }}" == "host-controller" || "${{ needs.component_impact.outputs.component_scope }}" == "host-launcher" ]]; then
            test "${{ needs.component_impact.outputs.native_proof }}" = "HOST_WINDOWS_OWNER_AND_CONSUMER"
            test "${{ needs.trading_engine_acceptance_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_regressions_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_build_windows.result }}" = "skipped"
            test "${{ needs.host_controller_launcher_checks.result }}" = "success"
            test "${{ needs.research_service_tests_windows.result }}" = "skipped"
            echo "WINDOWS_NATIVE_PROOF=HOST_COMPONENTS_TESTED_NO_ENGINE_REBUILD"
            echo "WINDOWS_NATIVE_EXECUTED_IN_THIS_RUN=false"
          elif [[ "${{ needs.component_impact.outputs.native_required }}" == "false" ]]; then
            test "${{ needs.component_impact.outputs.native_proof }}" = "COMPONENT_SCOPED_UNCHANGED_NATIVE"
            scope="${{ needs.component_impact.outputs.component_scope }}"
            [[ "$scope" == "docs" || "$scope" == "cloudflare" ]]
            test "${{ needs.trading_engine_acceptance_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_regressions_windows.result }}" = "skipped"
            test "${{ needs.trading_engine_build_windows.result }}" = "skipped"
            test "${{ needs.research_service_tests_windows.result }}" = "skipped"
            echo "WINDOWS_NATIVE_PROOF=COMPONENT_${scope}_NO_NATIVE_SOURCE_CHANGED"
            echo "WINDOWS_NATIVE_EXECUTED_IN_THIS_RUN=false"
          else
            test "${{ needs.trading_engine_acceptance_windows.result }}" = "success"
            test "${{ needs.trading_engine_regressions_windows.result }}" = "success"
            test "${{ needs.trading_engine_build_windows.result }}" = "success"
            echo "WINDOWS_NATIVE_PROOF=FULL_WINDOWS_NATIVE_SUCCESS"
            echo "WINDOWS_NATIVE_EXECUTED_IN_THIS_RUN=true"
          fi

  # #560: build the full Windows release in parallel with financial tests.
  # A manual accepted-main run can warm its release cache for future PRs.
  # Neither cache priming path runs acceptance, publishes or deploys.
  trading_engine_build_windows:
    name: trading-engine-build-windows
    needs: component_impact
    if: >-
      ${{
        (needs.component_impact.outputs.build_required == 'true' &&
         needs.component_impact.outputs.native_required != 'false' &&
         needs.component_impact.outputs.research_only != 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.prime_windows_cargo_cache == true &&
         github.ref == 'refs/heads/main' &&
         needs.component_impact.outputs.build_required == 'false' &&
         needs.component_impact.outputs.reason == 'merged tree exactly matches successful PR head tree')
      }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact trusted main checkout
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main' -or
              (git rev-parse HEAD).Trim() -cne '${{ github.sha }}' -or
              @(git status --porcelain).Count -ne 0) { throw 'UNTRUSTED_CACHE_SEED_CHECKOUT' }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: release-cache
        with:
          prefix-key: v1-rust
          shared-key: trading-engine-release-windows
          cache-workspace-crates: true
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Seed only missing Windows release outputs from trusted main
        if: github.event_name == 'workflow_dispatch' && steps.release-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo build --locked --release -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-research-service
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_RELEASE_BUILD_FAILED' }
      - name: Build deployable Windows binaries
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse "HEAD^{tree}").Trim()
          $env:OKX_BUILD_SOURCE_HEAD = (git rev-parse HEAD).Trim()
          $dist = Join-Path $env:RUNNER_TEMP "okx-windows-bundle"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $names = @('okx-agent.exe', 'okx-host-control.exe', 'okx-host-launcher.exe', 'okx-research-service.exe')
          $sourceHead = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          $components = [ordered]@{}
          & node scripts/test-research-release-scope.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The full native gate ALWAYS produces fresh binaries, even when a
          # pinned Research reuse base exists. Reuse is isolated to its job.
          cargo build --locked --release -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-research-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in $names) { Copy-Item (Join-Path 'target\release' $name) (Join-Path $dist $name) }
          $freshNames = $names
          foreach ($name in $freshNames) {
            $path = Join-Path $dist $name
            $components[$name] = [ordered]@{
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
              size = (Get-Item -LiteralPath $path).Length
              source_head_sha = $sourceHead
              source_tree = $sourceTree
              run_id = 0
              artifact_id = 0
              protocol_version = 1
              storage_version = 1
            }
          }
          Copy-Item 'Cargo.lock' (Join-Path $dist 'Cargo.lock')
          # Temporary one-release bridge for an already installed v1 CONTROL.
          # That executable rejects the v2 "components" field before it can
          # stage its successor. Keep the marker pinned in the tested source
          # tree and remove it in a follow-up full v2 release.
          if (Test-Path -LiteralPath '.github/windows-legacy-control-bridge.txt') {
            if (Test-Path -LiteralPath '.github/research-release-base.json') {
              throw 'LEGACY_BRIDGE_CANNOT_COMPOSE_RESEARCH_ORIGINS'
            }
            $files = [ordered]@{}
            foreach ($name in $names[0..2]) {
              $files[$name] = [ordered]@{
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dist $name)).Hash.ToLowerInvariant()
              }
            }
            # Current v1 readers never install Research; new v1 readers reject
            # unmanifested Research bytes. The next v2 release restores Worker.
            Remove-Item -LiteralPath (Join-Path $dist 'okx-research-service.exe') -Force
            $manifest = [ordered]@{
              schema = 'okx.windows.bundle/v1'
              repository_id = 1388071566
              source_head_sha = $sourceHead
              source_tree = $sourceTree
              rust_version = (rustc --version).Trim()
              files = $files
            }
          } else {
            $manifest = [ordered]@{
              schema = 'okx.windows.bundle/v2'
              repository_id = 1388071566
              source_head_sha = $sourceHead
              source_tree = $sourceTree
              rust_version = (rustc --version).Trim()
              components = $components
            }
          }
          $manifest | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $dist 'manifest.json') -Encoding utf8NoBOM

      - name: Upload deployable Windows bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okx-windows-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-windows-bundle
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

      - name: Record non-acceptance cache-seed evidence
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          "CACHE_SEED=TRUSTED_MAIN_COMPILATION_ONLY" >> $env:GITHUB_STEP_SUMMARY
          "MAIN_SHA=${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "RELEASE_CACHE_HIT=${{ steps.release-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          "FINANCIAL_TESTS=NOT_EXECUTED; RELEASE=NOT_PUBLISHED; ENGINE=NOT_INSTALLED" >> $env:GITHUB_STEP_SUMMARY

  # Keep the test cache isolated from the release cache. Each rust-cache action
  # owns one target directory on its own runner; post-job cleanup cannot cause
  # the other cache to silently capture an incomplete Cargo profile.
  trusted_main_test_cache_prime:
    name: trusted-main-windows-test-cache-prime
    needs: component_impact
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.prime_windows_cargo_cache == true &&
        github.ref == 'refs/heads/main' &&
        needs.component_impact.outputs.build_required == 'false' &&
        needs.component_impact.outputs.reason == 'merged tree exactly matches successful PR head tree'
      }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact trusted main checkout
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main' -or
              (git rev-parse HEAD).Trim() -cne '${{ github.sha }}' -or
              @(git status --porcelain).Count -ne 0) { throw 'UNTRUSTED_CACHE_SEED_CHECKOUT' }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: test-cache
        with:
          prefix-key: v1-rust
          shared-key: trading-engine-tests-windows
          cache-workspace-crates: true
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Seed only missing Windows debug/test outputs from trusted main
        if: steps.test-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --locked -p okx-trading-engine -p okx-host-controller -p okx-host-launcher -p okx-trade-execution --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_CLIPPY_BUILD_FAILED' }
          cargo test --locked --no-run --all-targets -p okx-trading-engine -p okx-trade-execution -p okx-host-controller -p okx-host-launcher -p okx-strategy-core -p okx-research -p okx-research-service
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_TEST_BUILD_FAILED' }
          # Match the single Cargo selection in the financial collector.
          cargo test --locked --no-run --lib -p okx-domain-core -p okx-trade-execution -p okx-trading-engine -p okx-ipc-contracts -p okx-market-runtime
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_FINANCIAL_LIBTEST_BUILD_FAILED' }
          cargo build --locked -p okx-trading-engine --example native_finance_acceptance
          if ($LASTEXITCODE -ne 0) { throw 'CACHE_SEED_COLLECTOR_BUILD_FAILED' }
      - name: Record non-acceptance test-cache evidence
        shell: pwsh
        run: |
          "CACHE_SEED=TRUSTED_MAIN_TEST_COMPILATION_ONLY" >> $env:GITHUB_STEP_SUMMARY
          "MAIN_SHA=${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "TEST_CACHE_HIT=${{ steps.test-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          "FINANCIAL_TESTS=NOT_EXECUTED; RELEASE=NOT_PUBLISHED; ENGINE=NOT_INSTALLED" >> $env:GITHUB_STEP_SUMMARY

  # Successful protected main checks publish the verified PR artifact here.
  publish_accepted_windows_release:
    name: publish-accepted-windows-release
    needs: [dependency-audit, component_impact, required_linux, required_windows]
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: native-base-publication
      cancel-in-progress: false
    # Explicit status guard is required: the protected aggregators succeed
    # even when intentionally skipped component jobs appear in their ancestry.
    # GitHub's implicit success() would otherwise skip publication on main.
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.component_impact.outputs.component_scope == 'full' &&
        needs['dependency-audit'].result == 'success' &&
        needs.component_impact.result == 'success' &&
        needs.required_linux.result == 'success' &&
        needs.required_windows.result == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_MAIN: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select exact successful full Native PR release
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/windows-legacy-control-bridge.txt ]]; then
            echo "One-time v1 CONTROL migration bridge: preserve the existing v2 Native base; deploy only the exact accepted PR CI artifact through CONTROL."
            exit 0
          fi
          [[ "$ACCEPTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          current="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$current" != "$ACCEPTED_MAIN" ]]; then
            echo "Main advanced; a newer successful CI will publish the base."
            exit 0
          fi
          prs="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$ACCEPTED_MAIN/pulls")"
          head="$(jq -r --arg main "$ACCEPTED_MAIN" '[.[] | select(.merged_at != null and .merge_commit_sha == $main and .base.ref == "main")] | first | .head.sha // empty' <<<"$prs")"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || exit 0
          main_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$ACCEPTED_MAIN" --jq .tree.sha)"
          head_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)"
          test "$main_tree" = "$head_tree"
          runs="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$head" -f event=pull_request -f status=completed -f per_page=100)"
          run_id=""
          artifact_id=""
          artifact_digest=""
          while read -r candidate; do
            [[ -n "$candidate" ]] || continue
            jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs?per_page=100")"
            # Require the *fresh* 4-EXE financial gate, never an aggregate
            # that reused older proof or the isolated Research-only worker.
            if ! jq -e '[.jobs[] | select(.conclusion == "success") | .name] as $ok | all(["trading-engine-acceptance-windows","trading-engine-regressions-windows","trading-engine-build-windows","linux-core","windows-native"][]; . as $name | $ok | index($name) != null)' <<<"$jobs" >/dev/null; then
              continue
            fi
            artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100")"
            candidate_artifact="$(jq -r --arg name "okx-windows-bundle-$head" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else empty end' <<<"$artifacts")"
            candidate_digest="$(jq -r --arg name "okx-windows-bundle-$head" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].digest else empty end' <<<"$artifacts")"
            if [[ "$candidate_artifact" =~ ^[1-9][0-9]*$ && "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              run_id="$candidate"
              artifact_id="$candidate_artifact"
              artifact_digest="$candidate_digest"
              break
            fi
          done < <(jq -r '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success" and .event == "pull_request")] | .[].id' <<<"$runs")
          if [[ -z "$run_id" ]]; then
            echo "No fresh accepted full Windows bundle: non-Native merge, no new release."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$head_tree" >> "$GITHUB_OUTPUT"
          echo "run=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Verify complete four-component source and archive
        if: steps.select.outputs.publish == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/okx-windows-base.zip"
          extract="$RUNNER_TEMP/native-base"
          mkdir -p "$extract"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.select.outputs.artifact }}/zip" > "$zip"
          digest="$(sha256sum "$zip" | cut -d' ' -f1)"
          test "sha256:$digest" = "${{ steps.select.outputs.digest }}"
          test "$(unzip -Z1 "$zip" | sort | paste -sd'|' -)" = 'Cargo.lock|manifest.json|okx-agent.exe|okx-host-control.exe|okx-host-launcher.exe|okx-research-service.exe'
          unzip -q "$zip" -d "$extract"
          jq -e --arg head '${{ steps.select.outputs.head }}' --arg tree '${{ steps.select.outputs.tree }}' '
            .schema == "okx.windows.bundle/v2" and .repository_id == 1388071566 and
            .source_head_sha == $head and .source_tree == $tree and
            (.components | length == 4) and (.rust_version | type == "string" and length > 0)
          ' "$extract/manifest.json" >/dev/null
          for file in okx-agent.exe okx-host-control.exe okx-host-launcher.exe okx-research-service.exe; do
            jq -e --arg f "$file" --arg head '${{ steps.select.outputs.head }}' --arg tree '${{ steps.select.outputs.tree }}' '
              .components[$f] | .source_head_sha == $head and .source_tree == $tree and .run_id == 0 and
              .artifact_id == 0 and .protocol_version == 1 and .storage_version == 1
            ' "$extract/manifest.json" >/dev/null
            test "$(sha256sum "$extract/$file" | cut -d' ' -f1)" = "$(jq -r --arg f "$file" '.components[$f].sha256' "$extract/manifest.json")"
            test "$(stat -c %s "$extract/$file")" = "$(jq -r --arg f "$file" '.components[$f].size' "$extract/manifest.json")"
          done
          input="$RUNNER_TEMP/native-base-origin-input.json"
          jq -n --arg head '${{ steps.select.outputs.head }}' --arg tree '${{ steps.select.outputs.tree }}' \
            --arg merge "$ACCEPTED_MAIN" --argjson run '${{ steps.select.outputs.run }}' \
            --argjson artifact '${{ steps.select.outputs.artifact }}' --arg digest "$digest" \
            '{repository_id:1388071566,source_head_sha:$head,source_tree:$tree,merged_main_sha:$merge,run_id:$run,artifact_id:$artifact,artifact_sha256:$digest}' > "$input"
          node scripts/test-published-release-origin.cjs
          node scripts/published-release-origin.cjs "$input" "$extract/manifest.json" "$zip" "$RUNNER_TEMP/published-origin.json"
          {
            (cd "$RUNNER_TEMP" && sha256sum okx-windows-base.zip published-origin.json)
            (cd "$extract" && sha256sum Cargo.lock manifest.json okx-agent.exe okx-host-control.exe okx-host-launcher.exe okx-research-service.exe)
          } > "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish current base and prune only superseded Native bases
        if: steps.select.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Each tag has immutable commit identity; only one *native-base-*
          # release remains after a new complete release was verified.
          tag="native-base-$ACCEPTED_MAIN"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              '${{ steps.verify.outputs.zip }}' \
              "$RUNNER_TEMP/published-origin.json" \
              "$RUNNER_TEMP/SHA256SUMS.txt" \
              --target "$ACCEPTED_MAIN" --title "OKX accepted Native base $ACCEPTED_MAIN" \
              --notes "Automatically accepted after full financial/Windows CI. Download assets with checked SHA256; this is not a production deployment."
          fi
          release="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e --arg tag "$tag" --arg main "$ACCEPTED_MAIN" '
            .tag_name == $tag and .target_commitish == $main and .draft == false and .prerelease == false and
            ([.assets[].name] | sort) == ["SHA256SUMS.txt","okx-windows-base.zip","published-origin.json"]
          ' <<<"$release" >/dev/null
          for name in okx-windows-base.zip published-origin.json SHA256SUMS.txt; do
            expected="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest' <<<"$release")"
            actual="$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)"
            test "$expected" = "sha256:$actual"
          done
          current="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$current" = "$ACCEPTED_MAIN"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name,.immutable] | @tsv' |
          while IFS=$'\t' read -r old immutable; do
            if [[ "$old" =~ ^native-base-[0-9a-f]{40}$ && "$old" != "$tag" ]]; then
              test "$immutable" = "false"
              gh release delete "$old" --cleanup-tag --yes
            fi
          done

name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      # Existing A1 work branch: targeted Windows only, no premature full gate.
      - work/t10-07-one-campaign-native-20261105
  workflow_dispatch:
    inputs:
      run_a1:
        description: 'Run exact 21-case A1 gate on this SHA (no duplicate target preflight)'
        type: boolean
        required: false
        default: false
      target_case:
        description: 'One targeted Windows integration case, B1 or S2-05 (not 26/26)'
        type: choice
        required: false
        default: T09.6
        options:
          - UnsentRelease
          - T09.1
          - T09.5
          - B1
          - S2-05
          - T10-14
          - T10-03
          - T10-05
          - T10-06
          - T10-08
          - T10-09
          - T10-10
          - T10-11
          - T10-12
          - T10-15
          - T09.3
          - T09.4
          - T09.6
          - T09.7
          - T09.8

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  classify:
    name: classify
    if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/work/t10-07-one-campaign-native-20261105'
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}
      reason: ${{ steps.classify.outputs.reason }}
      native_required: ${{ steps.classify.outputs.native_required }}
      native_proof: ${{ steps.classify.outputs.native_proof }}
    steps:
      - name: Decide whether compilation is required
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # In-progress Draft edits must not launch repeated Windows releases.
          # A Ready-for-review event retains the original full CI contract.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "native_required=false" >> "$GITHUB_OUTPUT"
            echo "reason=draft PR; defer release build until ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" != "push" ]]; then
            # Exact, one-time attestation for owner-only inspection #506.
            # There is NO general Cloudflare-path exemption: this owner code
            # also hosts trading/risk and must fail closed for every other diff.
            # GitHub accepted recorded T09/T10 proof: #43227700933 on
            # PR head 94287abf, same Git tree as main 6efa7dd4.
            accepted_main="6efa7dd4747731119b05b68aa102b28870d5443c"
            accepted_tree="13562425d00eede25bac3eb09bc5ed13c469ab09"
            if [[ "${{ github.event_name }}" == "pull_request" ]] &&
               [[ "${{ github.event.pull_request.number }}" == "506" ]] &&
               [[ "${{ github.event.pull_request.base.sha }}" == "$accepted_main" ]]; then
              head="${{ github.event.pull_request.head.sha }}"
              run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/43227700933" --jq '[.head_sha,.conclusion,.event] | join("|")')"
              tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$accepted_main" --jq .tree.sha)"
              diff="$(gh api "/repos/$GITHUB_REPOSITORY/compare/$accepted_main...$head" \
                --jq '[.files[].filename] | sort | join("|")')"
              # The three Cloudflare blobs are the already reviewed exact
              # owner-only response+auth+readback files. Changing any byte
              # of this set or ANY other source invalidates the reuse.
              expected_diff=".github/workflows/ci.yml|.github/workflows/cloudflare-mcp-deploy.yml|cloudflare/okx-mcp/src/auth.test.ts|cloudflare/okx-mcp/src/runtime_session.ts"
              if [[ "$run" == "94287abf9b1c270ca66a2b583ab2b1c6df51d896|success|pull_request" ]] &&
                 [[ "$tree" == "$accepted_tree" ]] &&
                 [[ "$diff" == "$expected_diff" ]] &&
                 [[ "$(gh api "/repos/$GITHUB_REPOSITORY/contents/cloudflare/okx-mcp/src/runtime_session.ts?ref=$head" --jq .sha)" == "6e383e84812de344a0dc1ad2ab67637bce7bf263" ]] &&
                 [[ "$(gh api "/repos/$GITHUB_REPOSITORY/contents/cloudflare/okx-mcp/src/auth.test.ts?ref=$head" --jq .sha)" == "674146fab0946f8846dfab0e6a235976bbfea423" ]] &&
                 [[ "$(gh api "/repos/$GITHUB_REPOSITORY/contents/.github/workflows/cloudflare-mcp-deploy.yml?ref=$head" --jq .sha)" == "75b5eef6093461d24a19dd5e1b8146445002f1ba" ]]; then
                echo "build_required=true" >> "$GITHUB_OUTPUT"
                echo "native_required=false" >> "$GITHUB_OUTPUT"
                echo "native_proof=ACCEPTED_MAIN_EXACT_READONLY_506" >> "$GITHUB_OUTPUT"
                echo "reason=exact approved owner-only readback; Native code unchanged since accepted 26/26" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "native_required=true" >> "$GITHUB_OUTPUT"
            echo "native_proof=NONE" >> "$GITHUB_OUTPUT"
            echo "reason=non-push event requires full native proof" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "native_required=true" >> "$GITHUB_OUTPUT"
          prs_json="$(gh api             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"

          head_sha="$(jq -r '
            [.[] | select(.merged_at != null and .base.ref == "main")]
            | first
            | .head.sha // empty
          ' <<<"$prs_json")"

          if [[ -z "$head_sha" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=direct main push or no merged PR association" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          successful_pr_ci="$(gh api             --method GET             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/runs"             -f head_sha="$head_sha"             -f event="pull_request"             -f status="completed"             -f per_page=100             --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')"

          merge_tree="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" \
            --jq '.tree.sha')"
          head_tree="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
            --jq '.tree.sha')"

          if [[ "$successful_pr_ci" -gt 0 && "$merge_tree" == "$head_tree" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "reason=merged tree exactly matches successful PR head tree" >> "$GITHUB_OUTPUT"
          elif [[ "$successful_pr_ci" -gt 0 ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=merge tree differs from successful PR head tree" >> "$GITHUB_OUTPUT"
          else
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=no successful PR CI found for merged head" >> "$GITHUB_OUTPUT"
          fi

      - name: Classification
        run: |
          echo "BUILD_REQUIRED=${{ steps.classify.outputs.build_required }}"
          echo "REASON=${{ steps.classify.outputs.reason }}"

  # #512: one bounded compiler/test cycle while its PR is Draft. This job
  # verifies real production and test configurations; it is NOT full acceptance.
  draft-512-rust:
    name: draft-512-rust
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/512-rust-boundaries-20261116' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Fast formatting gate before any Cargo build
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Existing architecture rules and negative self-tests
        run: |
          python3 scripts/check_architecture.py --self-test
          python3 scripts/check_architecture.py
          python3 scripts/acceptance_product.py --self-test
      - name: Compile shipping Engine without retired finance path
        run: |
          cargo check --locked -p okx-execution --lib
          cargo check --locked -p okx-agent --bin okx-agent
      - name: Compile exact Agent Rust unit-test source
        run: cargo test --locked -p okx-agent --lib --no-run
      - name: Compile all Agent targets including examples and integration targets
        run: cargo check --locked -p okx-agent --all-targets
      - name: Negative compile contracts for retired public financial APIs
        run: |
          cargo test --locked -p okx-execution --doc
          cargo test --locked -p okx-agent --doc
      - name: Finance owner durable diagnostic restore and both indexed query plans
        run: |
          cargo test --locked -p okx-execution --lib risk_book_contract_native_durable_operation_diagnostics_scoped_readback -- --nocapture
          cargo test --locked -p okx-execution --lib terminal_diagnostics_ -- --nocapture
      - name: Current finance owner startup queue and busy diagnostics, not legacy workers
        run: |
          cargo test --locked -p okx-execution --lib risk_book_contract_new_owner_exact_replay_reopen_and_no_trade_permission -- --nocapture
          cargo test --locked -p okx-execution --lib risk_book_contract_fresh_owner_queue_bounded_128_fifo_and_shutdown -- --nocapture
          cargo test --locked -p okx-execution --lib risk_book_contract_native_diagnostic_busy_deadline_preserves_identity_across_reopen -- --nocapture
      - name: Original failed SQL job and unchanged receipt on current finance owner
        run: cargo test --locked -p okx-execution --lib risk_book_contract_fresh_owner_failed_job_counts_and_preserves_installation -- --nocapture
      - name: Existing risk client and bound raw-frame regressions
        run: |
          cargo test --locked -p okx-agent --lib risk_bridge::tests -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_initialize_account -- --nocapture
          cargo test --locked -p okx-agent --lib actual_native_session_binds_risk_reply_to_generation_and_id -- --nocapture
      - name: Status and Recovery direct operation regressions
        run: |
          cargo test --locked -p okx-agent --lib trade_service::reconcile::entry_cost_status_tests -- --nocapture
          cargo test --locked -p okx-agent --lib trade_service::recovery::tests -- --nocapture
      - name: Original Native campaign, governance and Execute operation contracts
        run: |
          cargo test --locked -p okx-agent --lib risk_book_contract_native_maintenance_ -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_public_execute_lost_ack_and_replay_send_once -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_execute_bound_rejection_preserves_code_and_reserve -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_public_strategies_crud_claim_no_trade_share_original_owner -- --nocapture
      - name: Current-owner POST replay UNKNOWN and two-account replacements
        run: |
          cargo test --locked -p okx-agent --lib risk_book_contract_native_execute_100_callers_one_send_policy_cas_and_payload_conflict -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_public_cancel_after_held_replays_and_cold_reopens_without_send -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_os_kill_after_create_recovers_original_unknown -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_two_accounts_share_budget_and_isolate_public_capital_receipts -- --nocapture
      - name: Native connected-account identity and original shared finance owner
        run: |
          cargo test --locked -p okx-agent --lib risk_book_contract_native_connect_two_accounts_and_reopen_one_original_sqlite -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_connect_wrong_uid_does_not_create_account_or_publish_catalog -- --nocapture
      - name: Current Native scope and source-generation witnesses
        run: |
          cargo test --locked -p okx-agent --lib risk_book_contract_native_intent_diagnostic_is_account_scoped_and_refuses_foreign_installation -- --nocapture
          cargo test --locked -p okx-agent --lib risk_book_contract_native_changed_post_held_fee_releases_unsent_and_replans -- --nocapture
          cargo test --locked -p okx-agent --lib stale_generation_rejects_before_financial_or_venue_action -- --nocapture
      - name: Census original source, scope, receipt and post-HELD regressions
        run: |
          cargo test --locked -p okx-agent --lib trade_service::execute::tests::e2_ -- --nocapture
          cargo test --locked -p okx-agent --lib trade_service::execute::tests::e1_ -- --nocapture
          cargo test --locked -p okx-agent --lib trade_service::execute::tests::t10_native_ -- --nocapture
          cargo test --locked -p okx-agent --lib trade_service::execute::tests::k4_ -- --nocapture
      - name: Native diagnostic snapshot and stopped finance-mode exclusion
        run: |
          cargo test --locked -p okx-execution --lib risk_book_contract_native_account_diagnostics_one_scoped_read_no_mutation -- --nocapture
          cargo test --locked -p okx-execution --lib legacy_stopped_maintenance_uses_same_cross_process_mode_and_rejects_import -- --nocapture

  riskbook-draft-rust:
    # Fast, real-source feedback for the active Rust RiskBook draft. Final
    # acceptance remains the existing full required CI after Ready for review.
    name: riskbook-draft-rust
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/510-riskbook-rust-20261113' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify existing architecture guard and its negative self-tests
        run: |
          python3 scripts/check_architecture.py --self-test
          python3 scripts/check_architecture.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Direct RiskBook Rust/SQLite regression target
        run: cargo test --locked -p okx-kernel -p okx-execution --lib risk_book_contract -- --nocapture
      - name: Verify original AccountStore fill/bill source partial receipt
        run: cargo test --locked -p okx-execution --lib e1_partial_and_final_entry_settlement_are_monotone_and_not_double_counted -- --nocapture
      # The full original AccountStore API (including begin_post) is touched
      # by #510. One reusable compilation, same job and same draft gate;
      # 74 filtered risk contracts alone cannot prove zero regressions.
      - name: Regression of complete original execution Rust library
        run: cargo test --locked -p okx-execution --lib
      - name: Native startup and stopped unified finance readback (no trading)
        run: |
          cargo test --locked -p okx-agent --lib finance_staged_import_never_falls_back_to_old_trade_or_cloudflare_finance -- --nocapture
          cargo test --locked -p okx-agent --lib finance_inspection::tests -- --nocapture
          cargo test --locked -p okx-agent --lib native_finance_risk::tests -- --nocapture
          cargo test --locked -p okx-agent --lib risk_bridge::tests -- --nocapture
          cargo test --locked -p okx-agent --bin okx-agent --no-run
          cargo test --locked -p okx-agent --bin okx-agent native_finance_startup_tests -- --nocapture
      - name: Strict price and bounded derivative context regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p okx-observation --lib risk_market_uses_strict_price_and_bounded_derivative_context -- --nocapture | tee "$RUNNER_TEMP/native-market-contract.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/native-market-contract.log"
      - name: Native admission and existing trading boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          for contract in native_connect_contracts native_trade_contracts native_acceptance_coverage account_opening_capture storage_commands::tests storage_commands::native_backup::tests admission_source::tests native_finance_admission::tests source_capture::tests trade_service::plan::tests entry_settlement::direct_tests strategy_contract_tests protection_cleanup_direct_tests terminal_release::tests unsent_release::tests; do
            log="$RUNNER_TEMP/native-boundary-${contract//:/_}.log"
            cargo test --locked -p okx-agent --lib "$contract" -- --nocapture | tee "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$log"
          done
      - name: Worker transport and retired financial RPC boundary
        working-directory: cloudflare/okx-mcp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node scripts/test-native-finance-retirement-do.mjs
      - name: Fresh Rust property collector self-tests and known witnesses
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p okx-agent --example native_finance_acceptance
          cargo run --locked -p okx-agent --example native_finance_acceptance -- --known > "$RUNNER_TEMP/native-finance-known.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"native-finance-known.json"))); assert r["overall"] == "PARTIAL"; assert r["observed_witnesses"]; print("FRESH_NATIVE_PROPERTIES=PARTIAL_NOT_FULL")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-finance-properties-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-finance-known.json
          if-no-files-found: error
          retention-days: 14


  architecture:
    name: architecture
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Architecture checker self-test
        run: python3 scripts/check_architecture.py --self-test

      - name: Enforce accepted local-crate dependency graph
        run: python3 scripts/check_architecture.py

      - name: Verify versioned SQLite account ledger schema
        run: python3 scripts/check_ledger_sql.py

      - name: Verify exact T09/T10 required-case manifest
        run: node scripts/run-trade-integration.mjs --list

      - name: Reject incomplete or fabricated T09/T10 runner evidence
        run: node scripts/run-trade-integration.mjs --self-test

      - name: Preserve bounded primary and secondary Native failures
        run: node --test scripts/trade-integration/native-failure.test.mjs

      - name: Verify clean Engine product contract
        run: |
          python3 scripts/check_product_contract.py --self-test
          python3 scripts/check_product_contract.py

      - name: Verify fail-closed capability acceptance
        run: python3 scripts/acceptance_product.py --self-test


  linux-rust:
    name: linux-rust
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy portable crates
        run: cargo clippy --locked --workspace --exclude okx-agent --exclude okx-host-control --all-targets -- -D warnings

      - name: Test portable crates
        run: cargo test --locked --workspace --exclude okx-agent --exclude okx-host-control

      - name: Accept one million native SQLite terminal intents
        timeout-minutes: 30
        run: cargo test --locked -p okx-execution --lib sqlite_million_history_bounded_rss -- --ignored --nocapture

      - name: Measure two-account 100-parallel native SQL (not WSS)
        run: cargo test --locked -p okx-execution --lib two_account_100_parallel_sql_readonly_isolation -- --nocapture

      # #510: finances now commit inside the Native SQLite owner. Old Worker
      # monetary CAS traces are retired; they cannot witness the current owner.
      - name: Native policy and original financial invariants
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p okx-execution --lib risk_book_contract_native_campaign_policy_ -- --nocapture | tee "$RUNNER_TEMP/native-policy.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/native-policy.log"
          cargo test --locked -p okx-execution --lib e1_e2_native_real_fee_sources_baseline_and_second_admission_under_ten -- --nocapture
      - name: Actual Worker authenticated transport without financial authority
        timeout-minutes: 8
        working-directory: cloudflare/okx-mcp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node scripts/test-native-finance-retirement-do.mjs

  cloudflare-mcp:
    name: cloudflare-mcp
    needs: classify
    if: needs.classify.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/okx-mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Install locked package surface
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run check
      - name: Accept authenticated RuntimeSession transport without financial authority
        run: node scripts/test-native-finance-retirement-do.mjs

      # The previous Worker shared-cap owner no longer exists. The original
      # scoped Rust shared-budget invariants run in the execution job. Full
      # Native T10-07 acceptance remains part of the mandatory matrix (#512).
      - name: Reject drift in generated MCP public contracts
        working-directory: cloudflare/okx-mcp
        run: git diff --exit-code -- contracts/tools.schema.json contracts/action-fixtures.json



  linux:
    name: linux-core
    needs: [classify, architecture, linux-rust, cloudflare-mcp]
    if: always() && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/work/t10-07-one-campaign-native-20261105' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required Linux, architecture and Cloudflare gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.classify.result }}" = "success"
          if [[ "${{ needs.classify.outputs.build_required }}" == "false" ]]; then
            echo "REUSED_SUCCESSFUL_PR_CI=true"
            exit 0
          fi
          test "${{ needs.architecture.result }}" = "success"
          test "${{ needs.linux-rust.result }}" = "success"
          test "${{ needs.cloudflare-mcp.result }}" = "success"
          echo "REPOSITORY_GUARD_AND_LINUX=PASS"


  windows_native_full:
    name: windows-native-full
    needs: classify
    if: needs.classify.outputs.build_required == 'true' && needs.classify.outputs.native_required != 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Windows installation root migration contracts
        shell: pwsh
        run: ./scripts/test-windows-unify-root.ps1

      - name: Clippy native Windows crates
        run: cargo clippy --locked -p okx-agent -p okx-host-control -p okx-host-launcher -p okx-execution --all-targets -- -D warnings

      - name: Install locked production workerd test dependencies on Windows
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The JavaScript Native/Worker finance scenario driver is retired with
      # its separate financial owner. Its driver-only PID/cleanup tests do not
      # establish the shipped Engine lifecycle. Current Rust process, SQLite,
      # Engine drain and real workerd transport witnesses run in the gate below;
      # CONTROL/Launcher tests above and #449 physical acceptance remain.
      - name: Current Rust collector negative controls
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent --example native_finance_acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mandatory current Rust financial property acceptance
        id: native-properties
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # The old Native/Worker finance driver is retired. Its properties
          # remain in the reviewed current Rust map; missing evidence BLOCKS
          # this full gate rather than falling back to historical26 results.
          cargo run --locked -p okx-agent --example native_finance_acceptance > "$env:RUNNER_TEMP\native-finance-full.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -Raw "$env:RUNNER_TEMP\native-finance-full.json" | ConvertFrom-Json
          if ($report.overall -ne 'FULL_PASS') { throw 'FULL_NATIVE_PROPERTIES_NOT_PROVEN' }

      - name: Upload current Rust property evidence even on failure
        if: always() && github.event_name == 'pull_request' && steps.native-properties.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-finance-full-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\native-finance-full.json
          if-no-files-found: error
          retention-days: 14

      # These remain complete regressions, not substitutes for the exact current
      # property map above. Independent CPU-heavy research fixtures must not age
      # a separate financial fixture's real-time sources. Concurrency INSIDE
      # the 100-caller, fairness and two-heavy-job tests is not reduced.
      - name: Native trading, SQL, CONTROL and Launcher regression
        run: |
          cargo test --locked -p okx-agent -p okx-host-control -p okx-host-launcher -p okx-execution -- --skip analytics:: --test-threads 2

      - name: Independent research regression
        run: |
          cargo test --locked -p okx-agent -p okx-host-control -p okx-host-launcher -p okx-execution --lib analytics:: -- --test-threads 2 --skip two_heavy_research_jobs_ingestion_stop_and_cancel_latency

      - name: K9 native two-heavy cancellation latency evidence
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent -p okx-host-control -p okx-host-launcher -p okx-execution --lib two_heavy_research_jobs_ingestion_stop_and_cancel_latency -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\k9-two-heavy.txt"
          $line = [regex]::Match($log, 'ANALYTICS_PERF_JSON:(\{[^\r\n]+\})')
          if (-not $line.Success) { throw "K9_PERF_RECEIPT_MISSING" }
          $evidence = $line.Groups[1].Value | ConvertFrom-Json
          if ($evidence.two_heavy_stop.measurements -ne 30) { throw "K9_PERF_SAMPLE_COUNT_INVALID" }
          if ($evidence.two_heavy_stop.os -ne "windows") { throw "K9_PERF_NOT_WINDOWS" }
          $line.Groups[1].Value | Set-Content -LiteralPath "$env:RUNNER_TEMP\k9-native-evidence.json" -Encoding utf8NoBOM

      - name: Upload K9 native latency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k9-native-two-heavy-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\k9-native-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Build deployable Windows binaries
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $env:OKX_BUILD_SOURCE_TREE = (git rev-parse "HEAD^{tree}").Trim()
          cargo build --locked --release -p okx-agent -p okx-host-control -p okx-host-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dist = Join-Path $env:RUNNER_TEMP "okx-windows-bundle"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "target\release\okx-agent.exe" (Join-Path $dist "okx-agent.exe")
          Copy-Item "target\release\okx-host-control.exe" (Join-Path $dist "okx-host-control.exe")
          Copy-Item "target\release\okx-host-launcher.exe" (Join-Path $dist "okx-host-launcher.exe")
          Copy-Item "Cargo.lock" (Join-Path $dist "Cargo.lock")

          $sourceHead = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse "HEAD^{tree}").Trim()
          $agentHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-agent.exe")).Hash.ToLowerInvariant()
          $controllerHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-host-control.exe")).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "okx-host-launcher.exe")).Hash.ToLowerInvariant()
          $rustVersion = (rustc --version).Trim()

          $manifest = [ordered]@{
            schema = "okx.windows.bundle/v1"
            repository_id = 1388071566
            source_head_sha = $sourceHead
            source_tree = $sourceTree
            rust_version = $rustVersion
            files = [ordered]@{
              "okx-agent.exe" = [ordered]@{ sha256 = $agentHash }
              "okx-host-control.exe" = [ordered]@{ sha256 = $controllerHash }
              "okx-host-launcher.exe" = [ordered]@{ sha256 = $launcherHash }
            }
          }

          $manifest |
            ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $dist "manifest.json") -Encoding utf8NoBOM

      - name: Upload deployable Windows bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: okx-windows-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\okx-windows-bundle
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  # Manually dispatched from the existing CI workflow on the selected PR
  # branch. No deployment, no exchange network and no relaxation of the
  # mandatory 26-case pull_request gate.
  windows-t09-preflight:
    name: windows-t09-b1-s2-targeted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/work/t10-07-one-campaign-native-20261105')
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Bind exact source SHA and restrict target scenario
        shell: pwsh
        env:
          OKX_TARGET_CASE: ${{ inputs.target_case || ((github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-12]') && 'T10-12') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-11]') && 'T10-11') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-10]') && 'T10-10') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-09]') && 'T10-09') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-08]') && 'T10-08') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-05]') && 'T10-05') || (github.event_name == 'push' && 'T09.8')) || 'T09.6' }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "PREFLIGHT_HEAD_MISMATCH" }
          if ($env:OKX_TARGET_CASE -notin @('UnsentRelease','T09.1','T09.3','T09.4','T09.5','T09.6','T09.7','T09.8','B1','S2-05','T10-14','T10-03','T10-05','T10-06','T10-08','T10-09','T10-10','T10-11','T10-12','T10-15')) {
            throw "PREFLIGHT_CASE_NOT_ALLOWED"
          }
          Write-Host "PREFLIGHT_HEAD=$head"
          Write-Host "PREFLIGHT_CASE=$env:OKX_TARGET_CASE"
          Write-Host "PREFLIGHT_SCOPE=TARGETED_ONLY_NOT_26_CASE_ACCEPTANCE"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Prove ACK-bound immutable order source before Native acceptance
        if: inputs.target_case != 'UnsentRelease'
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent --lib immutable_acked_order_readback_is_bound_to_one_signed_post_and_query -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'ACK_BOUND_ORDER_SOURCE_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib immutable_acked_orders_keep_independent_sources_on_one_route -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'TWO_ORDER_SOURCE_SCOPE_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib recorded_terminal_algo_witness_requires_delivered_complete_account_scopes -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'TERMINAL_ALGO_DELIVERY_WITNESS_FAILED' }
          cargo test --locked -p okx-agent --lib executor_uid_cache_cannot_cross_account_or_outlive_signed_source -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'EXECUTOR_IDENTITY_UID_GENERATION_TTL_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib uid_waiting_is_bounded_and_other_account_progresses -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'EXECUTOR_UID_ASYNC_ADMISSION_FAILED' }
          cargo test --locked -p okx-agent --lib bounded_source_owner_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'FINANCE_SOURCE_OWNER_ASYNC_ADMISSION_FAILED' }
          cargo test --locked -p okx-agent --lib managed_census_stale_position_source_requires_fresh_event -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'MANAGED_CENSUS_EVENT_ORDER_REGRESSION' }
          cargo test --locked -p okx-agent --lib unresolved_peer_outcome_is_not_verified_protection_failure -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'MANAGED_CENSUS_PENDING_PEER_MUST_NOT_TRIGGER_EMERGENCY' }
          cargo test --locked -p okx-agent --lib e2_active_real_intents_have_complete_bounded_central_coverage -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'COHORT_PEER_POSTING_SQL_BOUNDARY_FAILED' }
          cargo test --locked -p okx-agent --lib t10_08_emergency_policy_is_bounded_before_financial_capture -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_PROTECTIVE_ACTION_MUST_PRECEDE_FINANCE' }
          cargo test --locked -p okx-agent --lib t10_08_emergency_close_requires_same_intent_signed_sql_lots -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_EMERGENCY_UNOWNED_REDUCE_MUST_NOT_POST' }
          cargo test --locked -p okx-agent --lib t10_08_later_live_stop_get_cannot_clear_durable_protection_incident -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_INCIDENT_RESTORATION_MUST_BE_PROVEN' }
          cargo test --locked -p okx-execution --lib t10_08_flat_protection_stop_resolution_is_atomic_and_idempotent -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'T10_08_ATOMIC_SQL_AND_ORIGINAL_WORKER_RELEASE_REQUIRED' }
          cargo test --locked -p okx-agent --lib immutable_signed_leverage_handoff_preserves_exact_source_without_extra_pages -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'SIGNED_LEVERAGE_SOURCE_UNIT_FAILED' }
          cargo test --locked -p okx-agent --lib signed_fee_phase_advances_only_on_explicit_event_and_keeps_prior_source_time -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'SIGNED_FEE_CAUSAL_EVENT_UNIT_FAILED' }

      - name: Check Rust format before expensive Native/Worker scenarios
        run: cargo fmt --all -- --check

      - name: Native unsent authority and Demo guards (economic replay in Native contracts)
        shell: pwsh
        run: |
          $output = & cargo test --locked -p okx-agent --lib trade_service::unsent_release::tests:: -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          $proof = [regex]::Match(($output -join "`n"), 'test result: ok\.\s+(\d+) passed;')
          if (-not $proof.Success -or [int]$proof.Groups[1].Value -ne 2) { throw 'UNSENT_RELEASE_NATIVE_GUARD_COUNT_INVALID' }
          # The removed Inspect/CAS/second-ACK fixture no longer represents
          # financial execution. Require actual local release + cold replay
          # and post-HELD source refusal, rather than counting only guards.
          foreach ($case in @(
            'accounts::native_trade_contracts::native_reserve_recovery::risk_book_contract_native_public_cancel_after_held_replays_and_cold_reopens_without_send',
            'accounts::native_trade_contracts::native_changed_source::risk_book_contract_native_changed_post_held_fee_releases_unsent_and_replans'
          )) {
            $output = & cargo test --locked -p okx-agent --lib $case -- --exact --nocapture 2>&1
            $code = $LASTEXITCODE
            $output | Out-Host
            if ($code -ne 0) { exit $code }
            if (($output -join "`n") -notmatch 'test result: ok\.\s+1 passed;') {
              throw "UNSENT_RELEASE_CURRENT_OWNER_NOT_EXECUTED: $case"
            }
          }

      - name: Verify recovery owner failures before integration
        if: inputs.target_case != 'UnsentRelease'
        shell: pwsh
        run: |
          node --test scripts/trade-integration/native-failure.test.mjs cloudflare/okx-mcp/scripts/t10-11-native-crash.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_FAILURE_PROJECTION_FAILED' }
          $output = & cargo test --locked -p okx-agent --lib cloudflare_transport::raw_native_session_tests::recovery_ -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          $proof = [regex]::Match(($output -join "`n"), 'test result: ok\.\s+(\d+) passed;')
          if (-not $proof.Success -or [int]$proof.Groups[1].Value -ne 4) {
            throw 'RECOVERY_WAIT_TEST_COUNT_INVALID'
          }
          $output = & cargo test --locked -p okx-agent --lib accounts::native_trade_contracts::native_source_diagnostic::recovery_prepared_account_reopens_catalog_and_original_sql -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\.\s+1 passed;') {
            throw 'ACCOUNT_REOPEN_TEST_NOT_EXECUTED'
          }
          $output = & cargo test --locked -p okx-agent --lib accounts::recorded_support::negative_order_lookup_without_ack_remains_identity_scoped_and_finite -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\.\s+1 passed;') {
            throw 'NEGATIVE_ORDER_SOURCE_TEST_NOT_EXECUTED'
          }

      - name: Clippy direct operation before integration
        if: inputs.target_case == 'UnsentRelease'
        run: cargo clippy --locked -p okx-agent --all-targets -- -D warnings

      - name: Verify independent recovery order source
        shell: pwsh
        run: |
          $output = & cargo test --locked -p okx-agent --lib accounts::recorded_support::independent_order_readback_uses_literal_source_identity_without_ack -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\.\s+1 passed;') {
            throw 'INDEPENDENT_ORDER_SOURCE_TEST_NOT_EXECUTED'
          }
          # Both witnesses exercise the installed finance.sqlite owner, not
          # a retired per-account SQL worker. Require each exact test to execute.
          foreach ($case in @(
            'accounts::native_trade_contracts::risk_book_contract_native_public_execute_lost_ack_and_replay_send_once',
            'accounts::native_trade_contracts::native_crash::risk_book_contract_native_os_kill_after_create_recovers_original_unknown'
          )) {
            $output = & cargo test --locked -p okx-agent --lib $case -- --exact --nocapture 2>&1
            $code = $LASTEXITCODE
            $output | Out-Host
            if ($code -ne 0) { exit $code }
            if (($output -join "`n") -notmatch 'test result: ok\.\s+1 passed;') {
              throw "NATIVE_LOST_ACK_OR_COLD_REOPEN_TEST_NOT_EXECUTED: $case"
            }
          }
          $output = & cargo test --locked -p okx-agent --lib cloudflare_transport::raw_native_session_tests::original_order_observation_uses_production_sql_and_identity_checks -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Out-Host
          if ($code -ne 0) { exit $code }
          if (($output -join "`n") -notmatch 'test result: ok\.\s+1 passed;') {
            throw 'PRODUCTION_ORDER_OBSERVATION_TEST_NOT_EXECUTED'
          }

      - name: Install locked workerd test dependencies
        if: inputs.target_case != 'UnsentRelease'
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute one Native/Worker scenario or B1/S2-05 prerequisite
        if: (github.event_name == 'workflow_dispatch' && !inputs.run_a1 && inputs.target_case != 'UnsentRelease') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[A1]'))
        shell: pwsh
        env:
          OKX_TARGET_CASE: ${{ inputs.target_case || ((github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-12]') && 'T10-12') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-11]') && 'T10-11') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-10]') && 'T10-10') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-09]') && 'T10-09') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-08]') && 'T10-08') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-05]') && 'T10-05') || (github.event_name == 'push' && 'T09.8')) || 'T09.6' }}
        run: |
          if ($env:OKX_TARGET_CASE -notin @('T09.1','T09.3','T09.4','T09.5','T09.6','T09.7','T09.8','B1','S2-05','T10-14','T10-03','T10-05','T10-06','T10-08','T10-09','T10-10','T10-11','T10-12','T10-15')) {
            throw "PREFLIGHT_CASE_NOT_ALLOWED"
          }
          $artifacts = Join-Path $env:RUNNER_TEMP "trade-integration"
          if ($env:OKX_TARGET_CASE -eq 'B1') {
            $env:OKX_B1_SECOND_POSITIVE_PROBE = '1'
            node scripts/trade-integration/b1-native-cap.mjs --artifacts "$artifacts"
          } elseif ($env:OKX_TARGET_CASE -eq 'S2-05') {
            $env:OKX_S2_05_POLICY_CAS_PROBE = '1'
            node scripts/run-trade-integration.mjs --case T09.5 --artifacts "$artifacts"
          } else {
            node scripts/run-trade-integration.mjs --case $env:OKX_TARGET_CASE --artifacts "$artifacts"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Canonical #449 r9.3 A1 exact 21-case gate on one SHA
        if: (github.event_name == 'workflow_dispatch' && inputs.run_a1 && github.ref == 'refs/heads/work/t10-07-one-campaign-native-20261105') || (github.event_name == 'push' && github.ref == 'refs/heads/work/t10-07-one-campaign-native-20261105' && contains(github.event.head_commit.message, '[A1]'))
        shell: pwsh
        timeout-minutes: 28
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'GIT_HEAD_FAILED' }
          $raw = node scripts/run-trade-integration.mjs --list
          if ($LASTEXITCODE -ne 0) { throw 'MANIFEST_FAILED' }
          $manifest = ($raw -join "`n") | ConvertFrom-Json
          if ($manifest.spec_revision -ne '#449-r9') { throw 'SPEC_NOT_ADOPTED' }
          $required = @($manifest.required)
          if ($required.Count -ne 26 -or @($required | Sort-Object -Unique).Count -ne 26) {
              throw 'INVALID_26_MANIFEST'
          }
          $excluded = @('T10-08','T10-09','T10-10','T10-11','T10-12')
          $ids = @($required | Where-Object { $_ -notin $excluded })
          if ($ids.Count -ne 21) { throw 'INVALID_A1_SELECTION' }
          $runRoot = Join-Path $env:TEMP ('okx-a1-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runRoot | Out-Null
          $rows = @()
          foreach ($id in $ids) {
              $out = Join-Path $runRoot $id
              node scripts/run-trade-integration.mjs --case $id --artifacts $out
              $exitCode = $LASTEXITCODE
              $file = Join-Path $out 'summary.json'
              $ok = $false
              if (Test-Path -LiteralPath $file) {
                  $s = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
                  $ok = $exitCode -eq 0 -and $s.exact_commit -eq $sha -and
                      $s.spec_revision -eq $manifest.spec_revision -and
                      @($s.selected).Count -eq 1 -and $s.selected[0] -eq $id -and
                      @($s.outcomes).Count -eq 1 -and $s.outcomes[0].id -eq $id -and
                      $s.outcomes[0].status -eq 'PASS' -and $s.gate -eq 'PASS'
              }
              $rows += [pscustomobject]@{id=$id;pass=$ok;exit_code=$exitCode;sha=$sha;artifact=$out}
          }
          $rows | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $runRoot 'a1-results.json')
          Write-Output "A1_ARTIFACTS=$runRoot"
          # Preserve exact canonical summary and each case evidence on CI failure as well.
          $a1ArtifactRoot = Join-Path $env:RUNNER_TEMP 'trade-integration/a1'
          New-Item -ItemType Directory -Path $a1ArtifactRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $runRoot '*') -Destination $a1ArtifactRoot -Recurse -Force
          if (@($rows | Where-Object { -not $_.pass }).Count -gt 0) { throw 'A1_NOT_ACCEPTED' }
          Write-Output 'A1=21/21; CODE=BLOCKED_PENDING_OTHER_REQUIREMENTS'

      - name: Preserve targeted evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-targeted-${{ inputs.target_case || ((github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-12]') && 'T10-12') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-11]') && 'T10-11') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-10]') && 'T10-10') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-09]') && 'T10-09') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-08]') && 'T10-08') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[T10-05]') && 'T10-05') || (github.event_name == 'push' && 'T09.8')) || 'T09.6' }}-${{ github.sha }}
          path: ${{ runner.temp }}\trade-integration
          if-no-files-found: warn
          retention-days: 14

  # Opt-in autonomous Windows reproduction on the exact PR head.
  # Triggered by PR synchronize only while the temporary PR title has
  # [T09-REPRO]; intentionally does NOT substitute the mandatory ALL26 gate.
  windows-agent:
    # This exact name remains the protected main required check. It succeeds
    # on a real Windows gate or on the narrowly proven identical native tree;
    # it never reports a newly executed 26/26 on the reuse path.
    name: windows-native
    needs: [classify, windows_native_full, cloudflare-mcp]
    if: always() && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - name: Enforce native gate or exact accepted evidence reuse
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.classify.result }}" = "success"
          if [[ "${{ needs.classify.outputs.build_required }}" == "false" ]]; then
            test "${{ needs.classify.outputs.reason }}" = "merged tree exactly matches successful PR head tree"
            echo "WINDOWS_NATIVE_PROOF=EXACT_SUCCESSFUL_MERGED_TREE"
          elif [[ "${{ needs.classify.outputs.native_required }}" == "false" ]]; then
            test "${{ needs.classify.outputs.native_proof }}" = "ACCEPTED_MAIN_EXACT_READONLY_506"
            test "${{ needs.windows_native_full.result }}" = "skipped"
            test "${{ needs['cloudflare-mcp'].result }}" = "success"
            echo "WINDOWS_NATIVE_PROOF=REUSED_ACCEPTED_26_OF_26_UNCHANGED_NATIVE_TREE"
            echo "WINDOWS_NATIVE_EXECUTED_IN_THIS_RUN=false"
          else
            test "${{ needs.windows_native_full.result }}" = "success"
            echo "WINDOWS_NATIVE_PROOF=FULL_WINDOWS_NATIVE_SUCCESS"
            echo "WINDOWS_NATIVE_EXECUTED_IN_THIS_RUN=true"
          fi

  windows-t09-autonomous:
    name: windows-t09-repro-${{ matrix.case_id }}
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[T09-REPRO]')
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        case_id: ['T09.3', 'T09.6', 'T09.7', 'T09.8']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Pin the immutable PR HEAD
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          CASE_ID: ${{ matrix.case_id }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "T09_REPRO_SOURCE_SHA_MISMATCH" }
          Write-Host "T09_REPRO_HEAD=$actual"
          Write-Host "T09_REPRO_CASE=$env:CASE_ID"
          Write-Host "T09_REPRO_SCOPE=THREE_TARGETED_REPETITIONS_NOT_ALL26"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # Compile the exact Rust test harness before the nested Workerd run:
      # its 115s/120s bootstrap deadlines measure runtime readiness, not a
      # cold cargo build. No production timeout or finance guard is changed.
      - name: Precompile Native SQL and Worker acceptance Rust harness
        shell: pwsh
        run: |
          cargo test --locked -p okx-agent --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw "T09_REPRO_NATIVE_PREBUILD_FAILED" }

      - name: Install pinned Workerd dependencies
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run three independent repetitions with separate evidence
        shell: pwsh
        env:
          CASE_ID: ${{ matrix.case_id }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/run-trade-integration.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "T09_REPRO_RUNNER_SELF_TEST_FAILED" }
          $base = Join-Path $env:RUNNER_TEMP "t09-repro"
          for ($repetition = 1; $repetition -le 3; $repetition++) {
            $dir = Join-Path $base "repeat-$repetition"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            "head=$env:EXPECTED_SHA case=$env:CASE_ID repeat=$repetition" |
              Set-Content -Path (Join-Path $dir "source.txt")
            Write-Host "T09_REPRO_BEGIN case=$env:CASE_ID repeat=$repetition"
            node scripts/run-trade-integration.mjs --case $env:CASE_ID --artifacts "$dir/evidence" 2>&1 |
              Tee-Object -FilePath (Join-Path $dir "console.log")
            $status = $LASTEXITCODE
            Write-Host "T09_REPRO_END case=$env:CASE_ID repeat=$repetition exit=$status"
            if ($status -ne 0) { throw "T09_REPRO_CASE_FAILED:$($env:CASE_ID):repeat-$repetition" }
          }

      - name: Preserve each repetition even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t09-repro-${{ matrix.case_id }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\\t09-repro
          if-no-files-found: warn
          retention-days: 14

  # Current Native A/B and semantic/CAS prerequisite on an isolated runner.
  # Full property/physical/resource acceptance remains windows-native-full.
  b1-native:
    # Preserve the existing check name; its obsolete remote-finance driver is
    # replaced by the actual current Native public contracts, not an exemption.
    name: windows-b1-native-prerequisite
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.build_required == 'true' && needs.classify.outputs.native_required != 'false'
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Precompile current Rust property targets
        run: cargo test --locked -p okx-agent -p okx-execution -p okx-kernel -p okx-protocol -p okx-runtime --lib --no-run
      - name: Public Native A/B cap, independent progress, replay and policy CAS
        shell: pwsh
        run: |
          $names = @(
            'accounts::native_trade_contracts::native_public_cohort::risk_book_contract_native_public_cohort_denied_b_does_not_block_held_a_post'
            'accounts::native_trade_contracts::native_public_fairness::risk_book_contract_native_public_b_executes_and_keeps_reserve_while_a_source_blocked'
            'accounts::native_trade_contracts::native_public_fairness::risk_book_contract_native_public_b_status_and_cancel_leave_blocked_a_held'
            'accounts::native_trade_contracts::native_execute_safety::risk_book_contract_native_execute_100_callers_one_send_policy_cas_and_payload_conflict'
            'accounts::native_trade_contracts::native_strategies::risk_book_contract_native_public_strategies_crud_claim_no_trade_share_original_owner'
          )
          $packages = @('-p','okx-agent','-p','okx-execution','-p','okx-kernel','-p','okx-protocol','-p','okx-runtime')
          $output = & cargo test --locked @packages --lib -- --exact --test-threads 4 --nocapture @names 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\native-b1-current.log" | Out-Host
          if ($code -ne 0) { exit $code }
          $proof = [regex]::Matches(($output -join "`n"), 'test result: ok\.\s+([1-9]\d*) passed;')
          if ($proof.Count -ne 1 -or [int]$proof[0].Groups[1].Value -ne $names.Count) {
            throw 'CURRENT_NATIVE_B1_PUBLIC_WITNESSES_MISSING'
          }
      - name: Current single-writer queue deadlines and FIFO drain
        shell: pwsh
        run: |
          $packages = @('-p','okx-agent','-p','okx-execution','-p','okx-kernel','-p','okx-protocol','-p','okx-runtime')
          $output = & cargo test --locked @packages --lib owner_queue_tests:: -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\native-queue-current.log" | Out-Host
          if ($code -ne 0) { exit $code }
          $proof = [regex]::Matches(($output -join "`n"), 'test result: ok\.\s+([1-9]\d*) passed;')
          if ($proof.Count -ne 1 -or [int]$proof[0].Groups[1].Value -ne 2) {
            throw 'CURRENT_SINGLE_WRITER_QUEUE_WITNESSES_MISSING'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-b1-current-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}\native-b1-current.log
            ${{ runner.temp }}\native-queue-current.log
          if-no-files-found: error
          retention-days: 14

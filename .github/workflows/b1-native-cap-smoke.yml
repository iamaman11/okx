name: B1 Native Shared Cap (WIP only)
on:
  push:
    branches:
      - work/b1-native-cap-20261104
permissions:
  contents: read
jobs:
  b1-windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Rust 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check exact source formatting (show diff on failure)
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --exit-code -- crates/okx-agent/src/cloudflare_transport.rs
      - name: Install existing locked Workerd dependencies
        run: npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
      - name: Precompile Rust Native integration test
        run: cargo test --locked -p okx-agent --lib native_to_workerd_risk_summary_over_actual_websocket --no-run
      - name: Execute public Native B denial on same persisted Worker as A
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "b1-native"
          node scripts/trade-integration/b1-native-cap.mjs --artifacts "$dir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-native-${{ github.sha }}
          path: ${{ runner.temp }}\b1-native
          if-no-files-found: warn
          retention-days: 7

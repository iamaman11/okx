# S2 integration regression against actual Native/Worker public TradeService; no real venue POST.
# PR #493 remains the sole release/mandatory-26 gate.
name: S1 targeted recorded Windows
on:
  push:
    branches:
      - work/s2-integrated-p02-20261103

permissions:
  contents: read

concurrency:
  group: s1-t09-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t09-repeat:
    name: S2 combined Native / Worker semantic and financial acceptance
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-29
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Exact Rust format
        run: cargo fmt --all -- --check
      - name: Install locked production workerd dependencies
        shell: pwsh
        run: |
          npm ci --prefix cloudflare/okx-mcp --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Precompile the same Native test before starting its bounded child
        run: cargo test --locked -p okx-agent --lib native_to_workerd_risk_summary_over_actual_websocket --no-run
      - name: Repeat T09.2 / T09.6 / T09.7 on one immutable SHA
        shell: pwsh
        run: |
          $cases = @('T09.5', 'T09.2', 'T09.6', 'T09.7', 'T09.8')
          $anyFailure = $false
          for ($i = 0; $i -lt $cases.Length; $i++) {
            $case = $cases[$i]
            $iteration = $i + 1
            $dir = Join-Path $env:RUNNER_TEMP ("s1-targeted\\iteration-{0}-{1}" -f $iteration, $case.Replace('.', '-'))
            Write-Host ("S2_EXACT_SHA_BOUNDARY_V1:{0} iteration={1} case={2}" -f $env:GITHUB_SHA, $iteration, $case)
            if ($case -eq 'T09.5') {
              $env:OKX_S2_05_POLICY_CAS_PROBE = '1'
            } else {
              Remove-Item Env:OKX_S2_05_POLICY_CAS_PROBE -ErrorAction SilentlyContinue
            }
            node scripts/run-trade-integration.mjs --case $case --artifacts "$dir"
            if ($LASTEXITCODE -ne 0) {
              $anyFailure = $true
              Write-Host ("::error title=S1 targeted case failure::sha={0} iteration={1} case={2}" -f $env:GITHUB_SHA, $iteration, $case)
            }
          }
          if ($anyFailure) { exit 1 }
      - name: Preserve actual signed-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s1-t09-repeated-${{ github.sha }}
          path: ${{ runner.temp }}\s1-targeted
          retention-days: 14

[workspace]
resolver = "2"
members = [
    "crates/okx-api",
    "crates/okx-cli",
    "crates/okx-protocol",
    "crates/okx-github",
    "crates/okx-agent",
    "crates/okx-host-control",
    "crates/okx-host-launcher",
    "crates/okx-bridge-mcp",
    "crates/okx-observation",
    "crates/okx-ws",
    "crates/okx-runtime",
    "crates/okx-analysis",
    "crates/okx-research",
    "crates/okx-execution",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Optimize the same native Windows ReleaseSet for a bounded download by
# the previously accepted 60-second controller. No new installer/transport.
# Keep panic semantics and runtime feature set unchanged.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

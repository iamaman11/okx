[workspace]
resolver = "2"
members = [
    "crates/okx-api",
    "crates/okx-cli",
    "crates/okx-ipc-contracts",
    "crates/okx-github",
    "crates/okx-trading-engine",
    "crates/okx-native-finance-check",
    "crates/okx-host-controller",
    "crates/okx-host-protocol",
    "crates/okx-host-launcher",
    "crates/okx-bridge-mcp",
    "crates/okx-observation",
    "crates/okx-ws",
    "crates/okx-market-runtime",
    "crates/okx-engine-domain",
    "crates/okx-research-domain",
    "crates/okx-strategy-core",
    "crates/okx-analysis",
    "crates/okx-research",
    "crates/okx-research-service",
    "crates/okx-research-protocol",
    "crates/okx-trade-execution",
]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

# Explicit maintenance exceptions remain empty after the chrono replacement.
# Any future exception must pass the graph-scoped expiry validation in CI.
[workspace.metadata.dependency-policy]
maintenance-exceptions = []

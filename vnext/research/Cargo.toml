[workspace]
resolver = "2"
members = ["crates/okx-strategy-core"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[package]
name = "okx-research-replay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
okx-strategy-core = { path = "crates/okx-strategy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

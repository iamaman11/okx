[package]
name = "okx-host-controller"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
# Preserve the installed service/task identity until a separately accepted migration.
name = "okx-host-control"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
jiff = "1.0"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
okx-github = { path = "../okx-github" }
okx-host-launcher = { path = "../okx-host-launcher" }
okx-host-protocol = { path = "../okx-host-protocol" }
okx-ipc-contracts = { path = "../okx-ipc-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { package = "keyring-core", version = "1" }
windows-native-keyring-store = "1.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[package]
name = "okx-research-service"
autobins = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Only for CI's non-shipping debug Research EXE. Engine test clients use
# isolated fixtures while accepted Release binaries enforce one global Worker.
test-isolated-singleton = []

[[bin]]
name = "okx-research-service"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
sha2 = "0.10"
jiff = "1.0"
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
getrandom = "0.4"
okx-analysis = { path = "../okx-analysis" }
okx-research-domain = { path = "../okx-research-domain" }
okx-strategy-core = { path = "../okx-strategy-core" }
okx-research-protocol = { path = "../okx-research-protocol" }
okx-research = { path = "../okx-research" }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
# Source/immutable-artifact f64 values must survive JSON roundtrips bit-for-bit.
# Otherwise a second replay may fail the original dataset hash despite
# unchanged archived bytes (serde_json's default parser is best-effort).
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-std", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { package = "keyring-core", version = "1" }
windows-native-keyring-store = "1.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

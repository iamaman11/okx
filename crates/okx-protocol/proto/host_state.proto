syntax = "proto3";
package okx.host;

// Internal crash-safe OS journal, NOT operator configuration or trade permit.
// Identified version and immutable full source/target transition witness.
message HostState {
  uint32 version = 1;
  uint32 desired_agent = 2; // 1 running; 2 stopped
  uint32 selected_environment = 3; // 1 real; 2 demo
  bool read_only = 4;
  LegacyProductionPolicy legacy_production_policy = 5; // migration only; no new authority
  Transition transition = 6;
  SourceDrainHold switch_hold = 7;
  bool explicit_trade_rearm = 8; // false for every pre-migration journal
}
message LegacyProductionPolicy {
  string schema = 1;
  uint64 revision = 2;
  uint32 permission = 3; // 0 OFF, 1 READ_ONLY, 2 ENABLED, 3 STOPPED
  string account_uid_fingerprint = 4;
  string strategy_run_id = 5;
  string operator_authority_id = 6;
  repeated string allowed_instruments = 7;
  string max_total_modelled_loss_usdt = 8;
}
message SourceDrainHold {
  uint32 source_environment = 1;
  uint32 destination_environment = 2;
  uint32 source_pid = 3;
}
message SourceWitness {
  uint64 sequence = 1;
  uint32 source_environment = 2;
  uint32 destination_environment = 3;
  uint32 source_pid = 4;
  string launch_lease_sha256 = 5;
  string account_uid_fingerprint = 6;
  uint64 private_ws_generation = 7;
  string ledger_manifest_sha256 = 8;
  string source_tree = 9;
  string agent_sha256 = 10;
  string controller_sha256 = 11;
  uint64 source_observed_at_ms = 12;
  uint64 issued_at_ms = 13;
  uint64 expires_at_ms = 14;
}
message Transition {
  string schema = 1;
  uint32 phase = 2; // 1 FROZEN, 2 CONSUMED, 3 SOURCE_EXITED
  SourceWitness witness = 3;
  optional uint64 consumed_at_ms = 4;
  optional uint64 source_exited_at_ms = 5;
  string checksum_sha256 = 6;
}

[package]
name = "okx-market-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Test-only adapter for the historical Engine-child Research IPC witnesses.
legacy-research-test = ["okx-ipc-contracts/legacy-research-test"]

[dependencies]
jiff = "1.0"
okx-api = { path = "../okx-api" }
okx-observation = { path = "../okx-observation" }
okx-ipc-contracts = { path = "../okx-ipc-contracts" }
okx-ws = { path = "../okx-ws" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }

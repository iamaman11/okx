[package]
name = "okx-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "okx-agent"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
futures-util = "0.3"
okx-analysis = { path = "../okx-analysis" }
okx-api = { path = "../okx-api" }
okx-github = { path = "../okx-github" }
okx-execution = { path = "../okx-execution" }
okx-observation = { path = "../okx-observation" }
okx-protocol = { path = "../okx-protocol" }
okx-runtime = { path = "../okx-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1"] }

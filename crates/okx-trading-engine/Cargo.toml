[package]
name = "okx-trading-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
# Compatibility with the installed Windows controller and accepted bundle schema.
# The Cargo package is named for its owner; the executable keeps its v2 wire name.
name = "okx-agent"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
jiff = "1.0"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
futures-util = "0.3"
okx-api = { path = "../okx-api" }
okx-github = { path = "../okx-github" }
okx-trade-execution = { path = "../okx-trade-execution" }
okx-observation = { path = "../okx-observation" }
okx-ipc-contracts = { path = "../okx-ipc-contracts" }
okx-market-runtime = { path = "../okx-market-runtime" }
rust_decimal = "1"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "ansi"] }
zeroize = { version = "1", features = ["derive"] }

# Native crash acceptance additionally controls Tokio time in isolated tests.
[dev-dependencies]
bytes = "1"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["process", "io-util", "test-util"] }
# Explicit, temporary pre-cutover cross-owner test debt (T06–T10). These
# features do not participate in `cargo build -p okx-trading-engine --release`.
okx-ipc-contracts = { path = "../okx-ipc-contracts", features = ["legacy-research-test"] }
okx-market-runtime = { path = "../okx-market-runtime", features = ["legacy-research-test"] }
okx-research-protocol = { path = "../okx-research-protocol" }

[target.'cfg(windows)'.dependencies]
keyring = { package = "keyring-core", version = "1" }
windows-native-keyring-store = "1.1"


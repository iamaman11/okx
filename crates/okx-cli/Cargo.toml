[package]
name = "okx-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "okx-capabilities"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
okx-api = { path = "../okx-api" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "okx-trade-execution"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
okx-domain-core = { path = "../okx-domain-core" }
tokio = { version = "1", features = ["sync", "time"] }
rusqlite = { version = "=0.41.0", features = ["bundled", "backup", "hooks"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt"] }

